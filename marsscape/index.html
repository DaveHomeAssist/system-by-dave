<body>
<div id="splash">
  <div class="art"></div>
  <div class="scrim"></div>
  <div class="inner">
    <p class="tag">Gather. Craft. Build. <b>Survive.</b><br>Become the foundation of humanity.</p>
    <button id="startBtn" class="start">Start Expedition</button>
    <p class="sub">A colony skiller on the red planet</p>
  </div>
</div>
<div id="app">
  <header>
    <div class="brand">
      <h1>Mars<span>Scape</span></h1>
      <span class="sol" id="sol">Sol 1</span>
    </div>
    <div class="gauges">
      <div class="gauge" id="g-o2">
        <div class="lbl"><span>OXYGEN</span><b id="o2v">100%</b></div>
        <div class="bar o2"><i id="o2bar" style="width:100%"></i></div>
      </div>
      <div class="gauge" id="g-pwr">
        <div class="lbl"><span>POWER</span><b id="pwrv">100%</b></div>
        <div class="bar pwr"><i id="pwrbar" style="width:100%"></i></div>
      </div>
    </div>
  </header>

  <main>
    <div id="surface">
      <div class="ground"></div>
      <div class="sun"></div>
      <div class="haze"></div>
      <div class="vignette"></div>
      <div id="dust"></div>
      <div class="horizon"></div>
      <div class="crater" style="width:190px;height:60px;left:8%;top:20%"></div>
      <div class="crater" style="width:130px;height:46px;left:74%;top:26%"></div>
      <div class="crater" style="width:96px;height:36px;left:44%;top:30%"></div>
      <div class="crater" style="width:150px;height:52px;left:60%;top:86%"></div>
      <div class="crater" style="width:110px;height:40px;left:20%;top:90%"></div>
      <div class="rock" style="width:16px;height:12px;left:12%;top:56%"></div>
      <div class="rock" style="width:22px;height:15px;left:47%;top:70%"></div>
      <div class="rock" style="width:13px;height:10px;left:63%;top:48%"></div>
      <div class="rock" style="width:26px;height:17px;left:88%;top:78%"></div>
      <div class="rock" style="width:12px;height:9px;left:30%;top:84%"></div>
      <div class="rock" style="width:18px;height:12px;left:78%;top:88%"></div>
      <div class="rock" style="width:11px;height:8px;left:40%;top:52%"></div>
      <div id="player" style="left:50%;top:80%"><span class="pshadow"></span><span class="pring"></span><div class="suit">🧑‍🚀</div><div class="prog"><i></i></div></div>
      <div id="storm"></div>
      <div id="stormBanner" style="display:none"></div>
    </div>

    <aside>
      <nav class="tabs" id="tabs">
        <button data-tab="skills" class="on"><span class="ic">📊</span>Skills</button>
        <button data-tab="inv"><span class="ic">🎒</span>Pack</button>
        <button data-tab="gear"><span class="ic">🧑‍🚀</span>Gear</button>
        <button data-tab="build"><span class="ic">🏗️</span>Colony</button>
        <button data-tab="craft"><span class="ic">🔧</span>Forge</button>
        <button data-tab="quest"><span class="ic">🚩</span>Log</button>
      </nav>
      <div class="panel" id="panel"></div>
    </aside>
  </main>

  <footer>
    <div id="log"></div>
    <div class="footctl">
      <button id="saveBtn">Save</button>
      <button id="expBtn">Export</button>
      <button id="impBtn">Import</button>
      <button id="pixelBtn">Pixel: off</button>
      <button id="resetBtn">Reset</button>
    </div>
  </footer>
</div>
<div id="toasts"></div>
<div id="victory" style="display:none"></div>

</body>
</html>
