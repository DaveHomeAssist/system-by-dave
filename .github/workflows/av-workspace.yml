name: AV workspace browser

on:
  pull_request:
    paths:
      - 'ProjectorThrow/**'
      - 'led-wall-calculator.html'
      - 'js/av-*.js'
      - 'js/led-*.js'
      - 'js/sbd-registry.js'
      - 'av-suite-worker.js'
      - 'css/av-*.css'
      - 'design/av-workspace.tokens.json'
      - 'scripts/*av_workspace*'
      - 'scripts/probe_throwline_stage3d.js'
      - 'package*.json'
      - '.github/workflows/av-workspace.yml'

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:av && npm run verify:throwline
      - run: npm run test:av-workspace
      - run: npm run test:throwline-browser
