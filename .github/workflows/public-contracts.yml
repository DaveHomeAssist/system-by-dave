name: Public site contracts

on:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: node --test scripts/root_asset_retention.test.mjs
      - run: npm run verify:private-exposure
      - run: npm run verify:indexing
      - run: python3 scripts/gen_sitemap.py --check
      - run: npm run verify:public-navigation
      - run: npm run verify:public-consistency
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: node scripts/probe_root_asset_retention.mjs
      - run: npm run test:public-viewport
      - name: Verify engineering daily journeys
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/daily-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --silent --fail http://127.0.0.1:8000/demos/engineering-daily/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/probe_engineering_daily.cjs
          node scripts/probe_engineering_entry.cjs
