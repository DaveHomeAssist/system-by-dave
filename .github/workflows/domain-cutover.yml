name: Domain cutover acceptance

on:
  workflow_call:
  pull_request:
    paths:
      - 'js/domain-*.js'
      - 'scripts/*domain*'
      - 'js/sbd-registry.js'
      - 'av-suite-worker.js'
      - 'package*.json'
      - '.github/workflows/domain-cutover.yml'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:domain-sites
      - run: npm run test:domain-cutover
