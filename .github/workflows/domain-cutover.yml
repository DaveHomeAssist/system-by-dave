name: Domain cutover acceptance

on:
  workflow_call:
  pull_request:
    paths:
      - 'js/domain-*.js'
      - 'scripts/*domain*'
      - 'js/sbd-registry.js'
      - 'av-suite-worker.js'
      - 'av-suite.html'
      - 'ProjectorThrow/Stage3D.html'
      - 'package*.json'
      - '.github/workflows/domain-cutover.yml'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify shared offline contracts
        run: |
          npm run verify:av
          npm run verify:throwline
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:domain-sites
      - run: node --test scripts/check_domain_cutover_ready.test.mjs
      - run: npm run test:domain-cutover
        env:
          CUTOVER_CAPTURE_DIR: ${{ runner.temp }}/cutover-evidence
      - name: Upload acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: domain-cutover-evidence
          path: ${{ runner.temp }}/cutover-evidence
          if-no-files-found: ignore
          retention-days: 3
