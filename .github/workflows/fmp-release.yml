name: Verify FMP managed release

on:
  pull_request:
    paths:
      - 'fmp/**'
      - 'fmpwalk/**'
      - 'scripts/*fmp*'
      - 'scripts/verify_public_*.js'
      - '.github/workflows/fmp-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Check generated artifacts, public contracts and destination staging
        run: |
          git diff --check
          npm run verify:fmp
          npm run verify:public-navigation
          npm run verify:public-consistency
          npm run verify:indexing
          npm run verify:domain-sites
