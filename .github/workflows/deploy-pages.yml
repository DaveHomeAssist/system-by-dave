name: Deploy site to Pages

# Publishes the repo's static content to GitHub Pages via Actions, replacing the
# legacy branch build (which was erratically slow — 10-15 min hangs). Serves the
# SAME files the legacy build did: the whole repo root, minus VCS + CI tooling
# (.git / .github), so the git history is never exposed. .nojekyll + CNAME are
# carried through, so no Jekyll processing and the custom domain is preserved.
# The pages listed in scripts/domain-sites.json are also staged as their own
# sites and pushed to the Pages repositories for housevideo.app and
# avbydave.com after this deploy (see docs/domain-sites.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Don't cancel an in-flight publish of the live site.
concurrency:
  group: systembydave-pages
  cancel-in-progress: false

jobs:
  domain-cutover:
    uses: ./.github/workflows/domain-cutover.yml

  deploy:
    needs: domain-cutover
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Actions pinned by SHA per GitHub's security-hardening guide.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install verification dependencies
        run: npm ci

      - name: Verify walk cutover prerequisites
        env:
          DEPLOY_KEY: ${{ secrets.HOUSEVIDEO_WALK_DEPLOY_KEY }}
          CUTOVER_AUTH_VERIFIED: ${{ vars.HOUSEVIDEO_WALK_AUTH_VERIFIED }}
        run: node scripts/check_domain_cutover_ready.mjs housevideo-walk --preflight

      - name: Verify public site contracts
        run: |
          npm run verify:av
          npm run verify:gear-reference
          npm run verify:indexing
          npm run verify:portfolio-schemas
          npm run verify:public-navigation
          npm run verify:public-consistency
          npm run verify:fmp
          npm run test:fmp-hygiene
          npm run verify:domain-sites
          npm run test:camera-training-links

      - name: Verify AV suite import safety
        env:
          CHROME_CHANNEL: chrome
        run: npm run test:av-suite-import-browser

      - name: Verify AV save safety
        env:
          CHROME_CHANNEL: chrome
        run: npm run test:av-save-safety-browser

      - name: Verify ATEM switcher guide
        env:
          CHROME_CHANNEL: chrome
        run: npm run test:switcher-guide-browser

      - name: Verify Throwline release contract
        run: npm run verify:throwline

      - name: Verify Throwline browser runtime
        run: npm run test:throwline-browser

      - name: Verify Shader practice release
        run: npm run verify:shader-practice

      - name: Verify Shader practice browser runtime
        run: npm run test:shader-practice-browser

      - name: Verify NoteForge release contract
        run: npm run verify:noteforge

      - name: Verify AV Workbook
        run: |
          npm run typecheck:av-workbook
          npm run test:av-workbook
          npm run build:av-workbook

      - name: Verify FMP Camera Simulator
        run: |
          npm run typecheck:camera-sim
          npm run test:camera-sim
          npm run build:camera-sim
          npm run verify:camera-sim-release

      - name: Verify FMP Camera Simulator browser runtime
        env:
          CHROME_CHANNEL: chrome
        run: npm run test:camera-sim-browser -- --no-sandbox

      - name: Verify dependency security and generated files
        run: |
          npm audit --audit-level=high
          python3 scripts/gen_sitemap.py
          git diff --exit-code -- av-workbook camera-sim sitemap.xml
          test -z "$(git status --porcelain -- av-workbook camera-sim sitemap.xml)"

      - name: Stage site (everything except VCS + CI tooling)
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' --exclude='_sites' --exclude='node_modules' --exclude='package.json' --exclude='package-lock.json' --exclude='/flooring-contract-review.html' --exclude='/house/56-harding' ./ _site/
          # Private pages stay in the repo but are never published.
          test ! -e _site/flooring-contract-review.html && test ! -e _site/house/56-harding
          echo "Staged $(find _site -type f | wc -l) files."

      - name: Stage domain sites
        run: node scripts/stage_domain_sites.mjs --out _sites --site-root _site

      # Publish and read back the destination before any old origin redirects.
      - name: Publish walk.housevideo.app
        env:
          DEPLOY_KEY: ${{ secrets.HOUSEVIDEO_WALK_DEPLOY_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/publish_domain_site.sh housevideo-walk _sites/housevideo-walk DaveHomeAssist/housevideo-walk "$GITHUB_SHA"

      - name: Verify walk destination before publishing redirects
        run: node scripts/check_domain_cutover_ready.mjs housevideo-walk --live _sites/housevideo-walk

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      # Each target repository deploys its own Pages site when this push lands.
      # These remaining publishes are independent; the walk is already verified.
      - name: Publish housevideo.app
        if: ${{ !cancelled() && steps.deployment.outcome == 'success' && github.ref == 'refs/heads/main' }}
        env:
          DEPLOY_KEY: ${{ secrets.HOUSEVIDEO_DEPLOY_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/publish_domain_site.sh housevideo _sites/housevideo DaveHomeAssist/housevideo "$GITHUB_SHA"

      - name: Publish avbydave.com
        if: ${{ !cancelled() && steps.deployment.outcome == 'success' && github.ref == 'refs/heads/main' }}
        env:
          DEPLOY_KEY: ${{ secrets.AVBYDAVE_DEPLOY_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/publish_domain_site.sh avbydave _sites/avbydave DaveHomeAssist/avbydave "$GITHUB_SHA"
