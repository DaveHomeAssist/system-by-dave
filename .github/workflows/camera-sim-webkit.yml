name: Camera Simulator WebKit smoke

# Field devices are iPads and iPhones, while the Camera Simulator's acceptance probe runs in
# Chromium only (camera-sim audit Q1). This weekly smoke runs the published camera-sim/ in
# Playwright's WebKit with iPhone and iPad emulation (scripts/probe_camera_sim_webkit.mjs).
# It is scheduled, not a pull-request gate for the simulator, until it has a record of being
# stable; it does run on changes to itself.
on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/probe_camera_sim_webkit.mjs'
      - '.github/workflows/camera-sim-webkit.yml'

permissions:
  contents: read

jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: WebKit smoke (iPhone 13, iPad Pro 11 landscape)
        run: npm run test:camera-sim-webkit
