name: hat-in-ring

on:
  schedule:
    - cron: "0 11 * * *"      # daily 11:00 UTC (~6-7am ET)
  workflow_dispatch: {}

permissions:
  contents: write             # commit refreshed data + rebuilt dashboard back to main

# Pages (classic, deploy-from-branch) rebuilds automatically on the push below.
concurrency:
  group: hat-in-ring
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _hat-in-ring-src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: _hat-in-ring-src/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Ingest FEC + news into _hat-in-ring-src/data/ (DEMO_KEY fallback if no secret).
      - name: Ingest signals (FEC + news)
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY || 'DEMO_KEY' }}
        run: python -m hatring.pipeline --fec --news

      # Tests gate the publish: parity/merge/classify/ux must pass.
      - name: Run tests
        run: pytest -q

      # Build straight into the Pages-served folder (../hat-in-ring at repo root).
      # build.py stages the lead portraits beside index.html as assets/candidates/.
      - name: Build dashboard into hat-in-ring/
        run: python -m hatring.pipeline --build --out ../hat-in-ring/index.html

      # Commit refreshed dataset + rebuilt dashboard; the push triggers Pages.
      - name: Commit & push
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name  "hat-in-ring-bot"
          git config user.email "actions@users.noreply.github.com"
          git add _hat-in-ring-src/data hat-in-ring
          git diff --cached --quiet && echo "no changes" || \
            git commit -m "chore: hat-in-ring daily ingest $(date -u +%F)"
          git push
