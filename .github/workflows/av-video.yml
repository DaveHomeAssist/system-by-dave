name: Verify AV Video

on:
  pull_request:
    paths:
      - 'apps/av-video/**'
      - 'av-video/**'
      - 'package*.json'
      - 'scripts/probe_av_video*.mjs'
      - 'js/sbd-registry.js'
      - 'js/av-suite/**'
      - '.github/workflows/av-video.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck, unit tests and build
        run: |
          npm run typecheck:av-video
          npm run test:av-video
          npm run build:av-video
      - name: Committed build matches the source
        run: |
          git diff --exit-code -- av-video
          test -z "$(git status --porcelain -- av-video)"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:av-video-browser
      - name: AV source checks
        run: npm run verify:av
