name: Verify AV Video

on:
  pull_request:
    paths:
      - 'apps/av-suite/**'
      - 'av/**'
      - 'scripts/probe_av_suite_shell.mjs'
      - 'apps/av-video/**'
      - 'apps/av-audio/**'
      - 'apps/show-ops/**'
      - 'apps/show-control/**'
      - 'apps/infrastructure/**'
      - 'apps/front-office/**'
      - 'apps/av-lighting/**'
      - 'apps/av-calculator/**'
      - 'av-calculator/**'
      - 'av-calculator.html'
      - 'js/av-calculator*.js'
      - 'scripts/*calculator*'
      - 'av-lighting/**'
      - 'scripts/probe_av_lighting_console.mjs'
      - 'front-office/**'
      - 'scripts/probe_front_office_console.mjs'
      - 'infrastructure/**'
      - 'apps/the-shop/**'
      - 'the-shop/**'
      - 'scripts/probe_the_shop_console.mjs'
      - 'show-control/**'
      - 'scripts/probe_show_control_console.mjs'
      - 'apps/shared/**'
      - 'scripts/probe_av_console*.mjs'
      - 'av-video/**'
      - 'av-audio/**'
      - 'show-ops/**'
      - 'scripts/probe_show_ops_console.mjs'
      - 'package*.json'
      - 'scripts/probe_av_video*.mjs'
      - 'scripts/probe_av_audio_connector.mjs'
      - 'js/sbd-registry.js'
      - '.github/workflows/av-video.yml'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck, unit tests and build
        run: |
          npm run typecheck:av-video
          npm run test:av-video
          npm run build:av-video
      - name: Committed build matches the source
        run: |
          git diff --exit-code -- av-video
          test -z "$(git status --porcelain -- av-video)"
      - name: AV Suite shell typecheck, build parity and browser
        env:
          CHROME_CHANNEL: chrome
        run: |
          npm run typecheck:av-suite
          npm run build:av-suite
          git diff --exit-code -- av
          test -z "$(git status --porcelain -- av)"
          npx playwright install --with-deps chromium
          npm run test:av-suite-browser
      - name: Audio shared-console consumer matches its source
        run: |
          npm run typecheck:av-audio
          npm run test:av-audio
          npm run build:av-audio
          git diff --exit-code -- av-audio
          test -z "$(git status --porcelain -- av-audio)"
      - run: npx playwright install --with-deps chromium
      - name: Video and embedded layout probes with deployment Chrome
        env:
          CHROME_CHANNEL: chrome
        run: npm run test:av-video-browser
      - name: Show Ops console typecheck, tests, build and browser
        run: |
          npm run typecheck:show-ops
          npm run test:show-ops
          npm run build:show-ops
          git diff --exit-code -- show-ops
          test -z "$(git status --porcelain -- show-ops)"
          npm run test:show-ops-browser
      - name: Show Control panels and saved-run compatibility
        run: |
          npm run typecheck:show-control
          npm run test:show-control
          npm run build:show-control
          git diff --exit-code -- show-control
          test -z "$(git status --porcelain -- show-control)"
          npm run test:show-control-browser
      - name: Front Office panels and saved-document compatibility
        run: |
          npm run typecheck:front-office
          npm run test:front-office
          npm run build:front-office
          git diff --exit-code -- front-office
          test -z "$(git status --porcelain -- front-office)"
          npm run test:front-office-browser
      - name: Lighting panels and saved-plan compatibility
        run: |
          npm run typecheck:av-lighting
          npm run test:av-lighting
          npm run build:av-lighting
          git diff --exit-code -- av-lighting
          test -z "$(git status --porcelain -- av-lighting)"
          npm run test:av-lighting-browser
      - name: Calculator panels and unchanged field calculations
        # The serial gate now verifies Calculator plus eight other consumers.
        run: |
          npm run typecheck:av-calculator
          npm run test:av-calculator
          npm run build:av-calculator
          git diff --exit-code -- av-calculator
          test -z "$(git status --porcelain -- av-calculator)"
          npm run test:av-calculator-browser
      - name: Infrastructure and Shop panels and saved-plan compatibility
        run: |
          npm run typecheck:infrastructure
          npm run test:infrastructure
          npm run build:infrastructure
          git diff --exit-code -- infrastructure
          test -z "$(git status --porcelain -- infrastructure)"
          npm run test:infrastructure-browser
          npm run typecheck:the-shop
          npm run test:the-shop
          npm run build:the-shop
          git diff --exit-code -- the-shop
          test -z "$(git status --porcelain -- the-shop)"
          npm run test:the-shop-browser
      - name: AV source checks
        run: npm run verify:av
