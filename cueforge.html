<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'">

<meta name="robots" content="noindex,follow">
<meta name="description" content="CueForge is part of the System by Dave AV tools suite for cue sheets, run of show control, status tracking, print output, JSON export, and CSV export.">
<link rel="canonical" href="https://systembydave.com/cue-sheet.html">
<meta name="theme-color" content="#0b0d10">
<meta property="og:type" content="article">
<meta property="og:site_name" content="System by Dave">
<meta property="og:title" content="CueForge">
<meta property="og:description" content="CueForge is part of the System by Dave AV tools suite for cue sheets, run of show control, status tracking, print output, JSON export, and CSV export.">
<meta property="og:url" content="https://systembydave.com/cueforge.html">
<meta property="og:image" content="https://systembydave.com/img/card-cover-banner-wide.png">
<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="412">
<meta property="og:image:alt" content="System by Dave preview banner">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="CueForge">
<meta name="twitter:description" content="CueForge is part of the System by Dave AV tools suite for cue sheets, run of show control, status tracking, print output, JSON export, and CSV export.">
<meta name="twitter:image" content="https://systembydave.com/img/card-cover-banner-wide.png">
<link rel="icon" href="svg/system_by_dave_logo_rust.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="profile/assets/apple-touch-icon.png">
<style>
  :root{color-scheme:dark;--bg:#0b0d10;--panel:#12171d;--panel-2:#171e26;--line:#303945;--text:#f6f8fb;--muted:#a9b4c1;--dim:#768391;--rust:#c0623a;--rust-2:#e58a5c;--blue:#72b8ff;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
  *{box-sizing:border-box}
  body{min-height:100vh;margin:0;display:grid;place-items:center;padding:20px;background:linear-gradient(180deg,#0b0d10,#11161b 55%,#080a0d);color:var(--text);font-family:var(--sans);line-height:1.45}
  main{width:min(92vw,620px);padding:28px;border:1px solid var(--line);border-radius:8px;background:var(--panel);box-shadow:0 16px 60px rgba(0,0,0,.32)}
  .kicker{margin:0 0 8px;color:var(--rust-2);font-family:var(--mono);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
  h1{margin:0 0 8px;font-size:30px}
  p{margin:0;color:var(--muted)}
  .status{margin:16px 0 0;padding:10px 12px;border:1px solid rgba(114,184,255,.32);border-radius:8px;background:#0e1318;color:#dceeff;font-family:var(--mono);font-size:12px}
  .route-list{display:grid;gap:8px;margin:18px 0 0;padding:0;list-style:none}
  .route-list li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:8px;color:var(--muted);font-size:13px}
  .route-list strong{color:var(--text)}
  .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
  a{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:10px 14px;border:1px solid var(--rust);border-radius:8px;background:linear-gradient(180deg,var(--rust-2),var(--rust));color:#160b06;font-weight:800;text-decoration:none;transition:transform 140ms ease,border-color 140ms ease,background 140ms ease}
  a.secondary{border-color:var(--line);background:var(--panel-2);color:var(--text)}
  a:hover{transform:translateY(-1px)}
  a:active{transform:translateY(1px) scale(.98)}
  a:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
  noscript{display:block;margin-top:16px;color:var(--dim);font-size:13px}
</style>
<link rel="stylesheet" href="css/sbd-public-nav.css">
</head>
<body>
<main>
  <p class="kicker">AV Suite route</p>
  <h1>CueForge</h1>
  <p>Opening the CueForge cue sheet tool for run of show cues, status, print, JSON, and CSV. <br><a href="/" rel="noopener noreferrer">System by Dave home</a></p>
  <p class="status" id="routeStatus" aria-live="polite">Preparing CueForge link.</p>
  <ul class="route-list" aria-label="CueForge route details">
    <li><strong>Tool</strong><span>cue-sheet.html</span></li>
    <li><strong>Suite context</strong><span>Show fields stay in the link</span></li>
    <li><strong>Saved data</strong><span>cueSheet.v1</span></li>
  </ul>
  <div class="actions">
    <a id="toolLink" href="cue-sheet.html">Open CueForge</a>
    <a id="suiteLink" class="secondary" href="av-suite.html">Back to AV Suite</a>
  </div>
  <noscript>JavaScript is off, so automatic routing is paused. Use Open CueForge to continue.</noscript>
</main>
<script src="js/sbd-registry.js"></script>
<script src="js/av-suite-context.js"></script>
<script>
(function(){
  var destination='cue-sheet.html';
  var query=window.location.search||'';
  var hash=window.location.hash||'';
  function withContext(href){
    var url=new URL(href,window.location.href);
    url.search=query;
    url.hash=hash;
    return url.pathname.split('/').pop()+url.search+url.hash;
  }
  var toolLink=document.getElementById('toolLink');
  var suiteLink=document.getElementById('suiteLink');
  var status=document.getElementById('routeStatus');
  var destinationHref=withContext(destination);
  if(toolLink) toolLink.href=destinationHref;
  if(suiteLink) suiteLink.href=withContext('av-suite.html');
  if(status) status.textContent=query?'Show context found. Opening CueForge with context.':'Opening CueForge.';
  window.location.replace(destinationHref);
})();
</script>
<script src="js/sbd-public-nav.js" defer></script>
</body>
</html>
