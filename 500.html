<style>
  :root{--bg:#0A0D14;--ink:#F3F4F7;--rust:oklch(0.65 0.19 33);
    --ff-display:'Space Grotesk','DM Sans',-apple-system,sans-serif;--ff-body:'DM Sans',-apple-system,sans-serif;--ff-mono:'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{font-family:var(--ff-body);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;min-height:100vh;position:relative;overflow:hidden;}
  ::selection{background:oklch(0.65 0.19 33 / 0.32);color:#fff;}
  .grid{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg, rgba(255,255,255,0.022) 0 1px, transparent 1px 88px), repeating-linear-gradient(0deg, rgba(255,255,255,0.022) 0 1px, transparent 1px 88px);}
  .glow{position:absolute;top:-120px;left:50%;transform:translateX(-50%);width:760px;height:420px;pointer-events:none;background:radial-gradient(ellipse at center, oklch(0.65 0.19 33 / 0.16), transparent 70%);filter:blur(20px);}
  .wrap{position:relative;text-align:center;padding:40px;max-width:560px;}
  .code{font-family:var(--ff-display);font-weight:600;font-size:clamp(72px,16vw,160px);line-height:1;letter-spacing:-0.04em;color:oklch(0.65 0.19 33);}
  h1{font-family:var(--ff-display);font-weight:600;font-size:clamp(24px,4vw,34px);letter-spacing:-0.02em;margin:8px 0 16px;}
  p{font-size:16px;font-weight:300;color:rgba(243,244,247,0.6);margin-bottom:32px;}
  .actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  .btn{font-family:var(--ff-mono);font-size:12px;letter-spacing:0.06em;text-transform:uppercase;text-decoration:none;padding:14px 26px;}
  .btn-p{background:#F3F4F7;color:#0A0D14;transition:background .2s,color .2s;}
  .btn-p:hover{background:oklch(0.65 0.19 33);color:#fff;}
  .btn-g{color:#F3F4F7;border:1px solid rgba(255,255,255,0.18);transition:border-color .2s;}
  .btn-g:hover{border-color:#F3F4F7;}
  .btn:focus-visible{outline:2px solid oklch(0.65 0.19 33);outline-offset:3px;}
</style>
<link rel="stylesheet" href="css/sbd-public-nav.css">
</head>
<body>
  <div class="grid"></div><div class="glow"></div>
  <div class="wrap">
    <div class="code">500</div>
    <h1>Something broke</h1>
    <p>An unexpected error occurred on our end. Try again, or head back to the system.</p>
    <div class="actions">
      <a href="index.html" class="btn btn-p">← Back home</a>
      <a href="tools.html" class="btn btn-g">All tools</a>
    </div>
  </div>
<script src="js/sbd-public-nav.js" defer></script>
</body>
