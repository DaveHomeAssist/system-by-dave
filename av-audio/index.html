</head><body><main><p>Audio now opens inside the AV by Dave console.</p><a href="/av/?app=audio">Open Audio</a> · <a href="https://systembydave.com/">System by Dave</a></main>
<script>
const target = new URL('/av/', location.origin);
target.searchParams.set('app', 'audio');
for (const key of ['sbdShow', 'sbdVenue', 'sbdDate', 'sbdOperator', 'sbdPhase']) {
  const value = new URLSearchParams(location.search).get(key);
  if (value !== null) target.searchParams.set(key, value.slice(0, 200));
}
location.replace(target.pathname + target.search);
</script></body></html>
