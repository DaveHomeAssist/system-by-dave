<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" role="img" aria-labelledby="title desc">
<title id="title">HDCP status indicators</title><desc id="desc">For this Extron model, the OUT HDCP LED can be off with unencrypted input or a non-HDCP sink. These are status examples, not physical routes. Use signal and HDCP status together.</desc>
<style>:root {
  --ground:#111111; --surface:#191919; --surface-raised:#242424; --raised:#303030;
  --line:#3c3c3c; --ink:#eeeeee; --muted:#b6b6b6; --faint:#a0a0a0;
  --blue:#a8bed9; --cyan:#becbd9; --amber:#d0c0a0; --red:#e6a8a8;
  --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
} text {font-family:system-ui,sans-serif;fill:var(--ink)} .eyebrow{fill:var(--cyan);letter-spacing:3px}.story-title{font-weight:750}.story-caption{fill:var(--ink)}.story-source{fill:var(--muted)}    .illustration text { fill: var(--ink); font: 16px var(--sans); }
    .illustration .node { fill: var(--surface); stroke: var(--cyan); stroke-width: 2; }
    .illustration .wire { fill: none; stroke: var(--blue); stroke-width: 3; }
    .illustration .alternate { stroke: var(--amber); }
    .illustration .note { fill: var(--amber); }
    .illustration .canvas { fill: var(--surface); }
    .illustration .panel { fill: var(--surface-raised); stroke: var(--line); stroke-width: 1; }
    .illustration .diagram-index { fill: var(--cyan); font-family: var(--mono); font-weight: 700; }
    .illustration .diagram-heading { font-weight: 700; }
    .illustration .rule { fill: none; stroke: var(--line); stroke-width: 1; }
    .illustration .blue-label { fill: var(--blue); }
    .illustration .good-label { fill: var(--cyan); }
    .illustration .fault { fill: var(--red); font-weight: 700; }
    .illustration .result { fill: var(--ground); stroke: var(--cyan); stroke-width: 1; }
    .illustration .limit { fill: var(--ground); stroke: var(--amber); stroke-width: 1; }
    .illustration .packet, .illustration .picture { fill: var(--ground); stroke: var(--line); stroke-width: 1; }
    .illustration .blue-packet { fill: var(--ground); stroke: var(--blue); stroke-width: 1; }
    .illustration .amber-packet { fill: var(--ground); stroke: var(--amber); stroke-width: 1; }
    .illustration .missing { fill: var(--ground); stroke: var(--red); stroke-width: 1; stroke-dasharray: 3 3; }
    .illustration .packet-label { font-family: var(--mono); }
    .illustration .reference { fill: none; stroke: var(--amber); stroke-width: 2; stroke-dasharray: 4 4; }</style>
<rect width="1080" height="1920" fill="var(--surface)"/>
<text x="108" y="148" font-size="28" class="eyebrow">VIDEO ENGINEERING DAILY · 002</text>
<text x="108" y="228" font-size="54" class="story-title">HDCP status indicators</text>
<g class="illustration" transform="translate(216 342) scale(2.7)"><rect width="240" height="400" rx="8" class="canvas"/><text x="12" y="26" class="diagram-index">02</text><text x="48" y="26" class="diagram-heading">CHECK THE STATE</text><path d="M12 40H228" class="rule"/><text x="120" y="65" text-anchor="middle" class="blue-label">Extron EDID 101H</text><text x="120" y="88" text-anchor="middle">4K PLUS: OUT HDCP</text><rect x="12" y="106" width="216" height="102" rx="8" class="panel"/><text x="120" y="133" text-anchor="middle">No source encryption</text><path d="M120 143V160m-4-6l4 6l4-6" class="wire"/><text x="120" y="188" text-anchor="middle" class="note">HDCP LED OFF</text><rect x="12" y="229" width="216" height="102" rx="8" class="panel"/><text x="120" y="256" text-anchor="middle">Non-HDCP sink</text><path d="M120 266V283m-4-6l4 6l4-6" class="wire"/><text x="120" y="311" text-anchor="middle" class="note">HDCP LED OFF</text><text x="120" y="365" text-anchor="middle">Same LED, two causes</text><text x="120" y="391" text-anchor="middle" class="good-label">Check source and sink</text></g>
<path d="M108 1460H972" stroke="var(--line)"/>
<text x="108" y="1506" font-size="40" class="story-caption">For this Extron model, the OUT HDCP</text>
<text x="108" y="1558" font-size="40" class="story-caption">LED can be off with unencrypted</text>
<text x="108" y="1610" font-size="40" class="story-caption">input or a non-HDCP sink. These are</text>
<text x="108" y="1662" font-size="40" class="story-caption">status examples, not physical</text>
<text x="108" y="1714" font-size="40" class="story-caption">routes. Use signal and HDCP status</text>
<text x="108" y="1766" font-size="40" class="story-caption">together.</text>
<a href="https://media.extron.com/public/download/files/userman/EDID101H4KPlus_68-3109-01_B.pdf"><text x="108" y="1808" font-size="28" class="story-source">Extron EDID 101H 4K PLUS User Guide, p. 4</text></a>
</svg>
