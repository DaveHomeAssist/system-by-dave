<text x="108" y="1506" font-size="40" class="story-caption">Level B-DL multiplexes logical</text>
<text x="108" y="1558" font-size="40" class="story-caption">dual-link components into one 3G-SDI</text>
<text x="108" y="1610" font-size="40" class="story-caption">cable. L1/L2 are mapping components</text>
<text x="108" y="1662" font-size="40" class="story-caption">here, not two physical output</text>
