<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" role="img" aria-labelledby="title desc">
<title id="title">JPEG XS line latency</title><desc id="desc">The first group can emerge before the final input rows arrive. The blocks represent processing order, not a measured latency.</desc>
<style>:root {
  --ground:#111111; --surface:#191919; --surface-raised:#242424; --raised:#303030;
  --line:#3c3c3c; --ink:#eeeeee; --muted:#b6b6b6; --faint:#a0a0a0;
  --blue:#a8bed9; --cyan:#becbd9; --amber:#d0c0a0; --red:#e6a8a8;
  --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
} text {font-family:system-ui,sans-serif;fill:var(--ink)} .eyebrow{fill:var(--cyan);letter-spacing:3px}.story-title{font-weight:750}.story-caption{fill:var(--ink)}.story-source{fill:var(--muted)}    .illustration text { fill: var(--ink); font: 16px var(--sans); }
    .illustration .node { fill: var(--surface); stroke: var(--cyan); stroke-width: 2; }
    .illustration .wire { fill: none; stroke: var(--blue); stroke-width: 3; }
    .illustration .alternate { stroke: var(--amber); }
    .illustration .note { fill: var(--amber); }
    .illustration .canvas { fill: var(--surface); }
    .illustration .panel { fill: var(--surface-raised); stroke: var(--line); stroke-width: 1; }
    .illustration .diagram-index { fill: var(--cyan); font-family: var(--mono); font-weight: 700; }
    .illustration .diagram-heading { font-weight: 700; }
    .illustration .rule { fill: none; stroke: var(--line); stroke-width: 1; }
    .illustration .blue-label { fill: var(--blue); }
    .illustration .good-label { fill: var(--cyan); }
    .illustration .fault { fill: var(--red); font-weight: 700; }
    .illustration .result { fill: var(--ground); stroke: var(--cyan); stroke-width: 1; }
    .illustration .limit { fill: var(--ground); stroke: var(--amber); stroke-width: 1; }
    .illustration .packet, .illustration .picture { fill: var(--ground); stroke: var(--line); stroke-width: 1; }
    .illustration .blue-packet { fill: var(--ground); stroke: var(--blue); stroke-width: 1; }
    .illustration .amber-packet { fill: var(--ground); stroke: var(--amber); stroke-width: 1; }
    .illustration .missing { fill: var(--ground); stroke: var(--red); stroke-width: 1; stroke-dasharray: 3 3; }
    .illustration .packet-label { font-family: var(--mono); }
    .illustration .reference { fill: none; stroke: var(--amber); stroke-width: 2; stroke-dasharray: 4 4; }</style>
<rect width="1080" height="1920" fill="var(--surface)"/>
<text x="108" y="148" font-size="28" class="eyebrow">VIDEO ENGINEERING DAILY · 033</text>
<text x="108" y="228" font-size="54" class="story-title">JPEG XS line latency</text>
<g class="illustration" transform="translate(216 342) scale(2.7)"><rect width="240" height="400" class="canvas"/>
<text x="12" y="26" class="diagram-index">33</text>
<text x="48" y="26" class="diagram-heading">LINE LATENCY</text>
<path d="M12 40H228" class="rule"/>
<rect x="12" y="52" width="216" height="132" rx="4" class="panel"/>
<text x="24" y="79" class="blue-label">1 / Input rows</text>
<text x="24" y="105">Row group A</text>
<rect x="24" y="119" width="38" height="15" rx="4" class="result"/>
<rect x="68" y="119" width="38" height="15" rx="4" class="result"/>
<rect x="112" y="119" width="38" height="15" rx="4" class="result"/>
<rect x="156" y="119" width="38" height="15" rx="4" class="result"/>
<text x="24" y="163" class="good-label">Frame continues</text>
<rect x="12" y="198" width="216" height="132" rx="4" class="panel"/>
<text x="24" y="225" class="blue-label">2 / Codec pipeline</text>
<text x="24" y="251">Encode → Decode</text>
<rect x="24" y="265" width="38" height="15" rx="4" class="result"/>
<rect x="68" y="265" width="38" height="15" rx="4" class="packet"/>
<rect x="112" y="265" width="38" height="15" rx="4" class="packet"/>
<rect x="156" y="265" width="38" height="15" rx="4" class="packet"/>
<text x="24" y="309" class="good-label">Group A emerges</text>
<text x="24" y="365">Line timing schematic</text>
<text x="24" y="390" class="note">Not to scale</text></g>
<path d="M108 1460H972" stroke="var(--line)"/>
<text x="108" y="1506" font-size="40" class="story-caption">The first group can emerge before</text>
<text x="108" y="1558" font-size="40" class="story-caption">the final input rows arrive. The</text>
<text x="108" y="1610" font-size="40" class="story-caption">blocks represent processing order,</text>
<text x="108" y="1662" font-size="40" class="story-caption">not a measured latency.</text>
<a href="https://jpeg.org/jpegxs/"><text x="108" y="1808" font-size="28" class="story-source">JPEG Committee, JPEG XS</text></a>
</svg>
