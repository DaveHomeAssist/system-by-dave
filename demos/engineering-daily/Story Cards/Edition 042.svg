<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" role="img" aria-labelledby="title desc">
<title id="title">Four SDI inputs must agree</title><desc id="desc">In this example, SDI 4 runs at 60p. Auto cannot select Quad Link until all four input formats match.</desc>
<style>:root {
  --ground:#111111; --surface:#191919; --surface-raised:#242424; --raised:#303030;
  --line:#3c3c3c; --ink:#eeeeee; --muted:#b6b6b6; --faint:#a0a0a0;
  --blue:#a8bed9; --cyan:#becbd9; --amber:#d0c0a0; --red:#e6a8a8;
  --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
} text {font-family:system-ui,sans-serif;fill:var(--ink)} .eyebrow{fill:var(--cyan);letter-spacing:3px}.story-title{font-weight:750}.story-caption{fill:var(--ink)}.story-source{fill:var(--muted)}    .illustration text { fill: var(--ink); font: 16px var(--sans); }
    .illustration .node { fill: var(--surface); stroke: var(--cyan); stroke-width: 2; }
    .illustration .wire { fill: none; stroke: var(--blue); stroke-width: 3; }
    .illustration .alternate { stroke: var(--amber); }
    .illustration .note { fill: var(--amber); }
    .illustration .canvas { fill: var(--surface); }
    .illustration .panel { fill: var(--surface-raised); stroke: var(--line); stroke-width: 1; }
    .illustration .diagram-index { fill: var(--cyan); font-family: var(--mono); font-weight: 700; }
    .illustration .diagram-heading { font-weight: 700; }
    .illustration .rule { fill: none; stroke: var(--line); stroke-width: 1; }
    .illustration .blue-label { fill: var(--blue); }
    .illustration .good-label { fill: var(--cyan); }
    .illustration .fault { fill: var(--red); font-weight: 700; }
    .illustration .result { fill: var(--ground); stroke: var(--cyan); stroke-width: 1; }
    .illustration .limit { fill: var(--ground); stroke: var(--amber); stroke-width: 1; }
    .illustration .packet, .illustration .picture { fill: var(--ground); stroke: var(--line); stroke-width: 1; }
    .illustration .blue-packet { fill: var(--ground); stroke: var(--blue); stroke-width: 1; }
    .illustration .amber-packet { fill: var(--ground); stroke: var(--amber); stroke-width: 1; }
    .illustration .missing { fill: var(--ground); stroke: var(--red); stroke-width: 1; stroke-dasharray: 3 3; }
    .illustration .packet-label { font-family: var(--mono); }
    .illustration .reference { fill: none; stroke: var(--amber); stroke-width: 2; stroke-dasharray: 4 4; }
.illustration [fill][font-size]{fill:inherit; font-size:15px}.illustration text[fill="#eff8fa"]{fill:#eff8fa}.illustration text[fill="#8be9f6"]{fill:#8be9f6}.illustration text[fill="#9bf6cb"]{fill:#9bf6cb}.illustration text[fill="#ffbf78"]{fill:#ffbf78}.illustration text[fill="#b8cbd4"]{fill:#b8cbd4}.story-title,.story-caption{fill:#eff8fa}.story-source{fill:#b8cbd4}.eyebrow{fill:#8be9f6}</style>
<rect width="1080" height="1920" fill="#0b1319"/>
<text x="108" y="148" font-size="28" class="eyebrow">VIDEO ENGINEERING DAILY · 042</text>
<text x="108" y="228" font-size="54" class="story-title">Four SDI inputs must agree</text>
<g class="illustration" transform="translate(216 342) scale(2.7)"><rect width="240" height="400" rx="8" fill="#101d25"/><text x="16" y="34" style="fill:#8be9f6;font-size:15px"  font-weight="700">12GM INPUT CHECK</text><rect x="16" y="60" width="208" height="40" rx="4" fill="#21333e"/><circle cx="29" cy="80" r="4" fill="#9bf6cb"/><text x="42" y="85" style="fill:#eff8fa;font-size:15px" >SDI 1</text><text x="106" y="85" style="fill:#9bf6cb;font-size:15px" >59.94p</text><rect x="16" y="112" width="208" height="40" rx="4" fill="#21333e"/><circle cx="29" cy="132" r="4" fill="#9bf6cb"/><text x="42" y="137" style="fill:#eff8fa;font-size:15px" >SDI 2</text><text x="106" y="137" style="fill:#9bf6cb;font-size:15px" >59.94p</text><rect x="16" y="164" width="208" height="40" rx="4" fill="#21333e"/><circle cx="29" cy="184" r="4" fill="#9bf6cb"/><text x="42" y="189" style="fill:#eff8fa;font-size:15px" >SDI 3</text><text x="106" y="189" style="fill:#9bf6cb;font-size:15px" >59.94p</text><rect x="16" y="216" width="208" height="40" rx="4" fill="#21333e"/><circle cx="29" cy="236" r="4" fill="#ffbf78"/><text x="42" y="241" style="fill:#eff8fa;font-size:15px" >SDI 4</text><text x="106" y="241" style="fill:#ffbf78;font-size:15px" >60p mismatch</text><path d="M120 266v26m-6-7 6 7 6-7" stroke="#ffbf78" fill="none"/><rect x="16" y="302" width="208" height="48" rx="4" fill="#21333e"/><text x="30" y="331" style="fill:#ffbf78;font-size:15px"  font-weight="700">Auto: no Quad Link</text><text x="16" y="375" style="fill:#b8cbd4;font-size:15px" >Illustrative format mismatch</text></g>
<path d="M108 1460H972" stroke="var(--line)"/>
<text x="108" y="1506" font-size="40" class="story-caption">In this example, SDI 4 runs at 60p.</text>
<text x="108" y="1558" font-size="40" class="story-caption">Auto cannot select Quad Link until</text>
<text x="108" y="1610" font-size="40" class="story-caption">all four input formats match.</text>
