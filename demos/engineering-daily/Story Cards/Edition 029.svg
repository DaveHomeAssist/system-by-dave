<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" role="img" aria-labelledby="title desc">
<title id="title">Rolling shutter row timing</title><desc id="desc">Blue bars show first and last row exposure. Shorter bars retain the same start offset, marked by amber timing references. Timing schematic, not to scale; actual offsets depend on camera mode.</desc>
<style>:root {
  --ground:#111111; --surface:#191919; --surface-raised:#242424; --raised:#303030;
  --line:#3c3c3c; --ink:#eeeeee; --muted:#b6b6b6; --faint:#a0a0a0;
  --blue:#a8bed9; --cyan:#becbd9; --amber:#d0c0a0; --red:#e6a8a8;
  --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
} text {font-family:system-ui,sans-serif;fill:var(--ink)} .eyebrow{fill:var(--cyan);letter-spacing:3px}.story-title{font-weight:750}.story-caption{fill:var(--ink)}.story-source{fill:var(--muted)}    .illustration text { fill: var(--ink); font: 16px var(--sans); }
    .illustration .node { fill: var(--surface); stroke: var(--cyan); stroke-width: 2; }
    .illustration .wire { fill: none; stroke: var(--blue); stroke-width: 3; }
    .illustration .alternate { stroke: var(--amber); }
    .illustration .note { fill: var(--amber); }
    .illustration .canvas { fill: var(--surface); }
    .illustration .panel { fill: var(--surface-raised); stroke: var(--line); stroke-width: 1; }
    .illustration .diagram-index { fill: var(--cyan); font-family: var(--mono); font-weight: 700; }
    .illustration .diagram-heading { font-weight: 700; }
    .illustration .rule { fill: none; stroke: var(--line); stroke-width: 1; }
    .illustration .blue-label { fill: var(--blue); }
    .illustration .good-label { fill: var(--cyan); }
    .illustration .fault { fill: var(--red); font-weight: 700; }
    .illustration .result { fill: var(--ground); stroke: var(--cyan); stroke-width: 1; }
    .illustration .limit { fill: var(--ground); stroke: var(--amber); stroke-width: 1; }
    .illustration .packet, .illustration .picture { fill: var(--ground); stroke: var(--line); stroke-width: 1; }
    .illustration .blue-packet { fill: var(--ground); stroke: var(--blue); stroke-width: 1; }
    .illustration .amber-packet { fill: var(--ground); stroke: var(--amber); stroke-width: 1; }
    .illustration .missing { fill: var(--ground); stroke: var(--red); stroke-width: 1; stroke-dasharray: 3 3; }
    .illustration .packet-label { font-family: var(--mono); }
    .illustration .reference { fill: none; stroke: var(--amber); stroke-width: 2; stroke-dasharray: 4 4; }</style>
<rect width="1080" height="1920" fill="var(--surface)"/>
<text x="108" y="148" font-size="28" class="eyebrow">VIDEO ENGINEERING DAILY · 029</text>
<text x="108" y="228" font-size="54" class="story-title">Rolling shutter row timing</text>
<g class="illustration" transform="translate(216 342) scale(2.7)"><rect width="240" height="400" class="canvas"/><text x="12" y="26" class="diagram-index">29</text><text x="48" y="26" class="diagram-heading">SCAN TIMING</text><path d="M12 40H228" class="rule"/>
<rect x="12" y="52" width="216" height="110" rx="6" class="panel"/><text x="24" y="77" class="blue-label">1 / Longer exposure</text><text x="24" y="108">First</text><text x="24" y="144">Last</text><path d="M90 102H160M138 138H208" class="wire"/>
<rect x="12" y="182" width="216" height="110" rx="6" class="panel"/><text x="24" y="207" class="blue-label">2 / Shorter exposure</text><text x="24" y="238">First</text><text x="24" y="274">Last</text><path d="M90 232H114M138 268H162" class="wire"/>
<path d="M90 89V151M138 89V151M90 219V281M138 219V281" fill="none" stroke="var(--amber)" stroke-dasharray="4 5"/>
<path d="M90 309H138m-6-5l6 5l-6 5m-36-10l-6 5l6 5" fill="none" stroke="var(--cyan)"/><text x="24" y="341">Same row start offset</text><text x="24" y="368" class="note">Time →  Not to scale</text><text x="24" y="394">Blue = exposure time</text></g>
<path d="M108 1460H972" stroke="var(--line)"/>
<text x="108" y="1506" font-size="40" class="story-caption">Blue bars show first and last row</text>
<text x="108" y="1558" font-size="40" class="story-caption">exposure. Shorter bars retain the</text>
<text x="108" y="1610" font-size="40" class="story-caption">same start offset, marked by amber</text>
<text x="108" y="1662" font-size="40" class="story-caption">timing references. Timing schematic,</text>
<text x="108" y="1714" font-size="40" class="story-caption">not to scale; actual offsets depend</text>
<text x="108" y="1766" font-size="40" class="story-caption">on camera mode.</text>
<a href="https://www.baslerweb.com/en/learning/cmos-rolling-shutter-cameras/"><text x="108" y="1808" font-size="28" class="story-source">Basler, CMOS Rolling Shutter Cameras</text></a>
</svg>
