<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" role="img" aria-labelledby="title desc">
<title id="title">RTP timestamps at 59.94 fps</title><desc id="desc">Example relative RTP timestamps advance by 1501, then 1502, then 1501 ticks. The initial phase and timestamp offset can differ; the two-frame average is 1501.5 ticks.</desc>
<style>:root {
  --ground:#111111; --surface:#191919; --surface-raised:#242424; --raised:#303030;
  --line:#3c3c3c; --ink:#eeeeee; --muted:#b6b6b6; --faint:#a0a0a0;
  --blue:#a8bed9; --cyan:#becbd9; --amber:#d0c0a0; --red:#e6a8a8;
  --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
} text {font-family:system-ui,sans-serif;fill:var(--ink)} .eyebrow{fill:var(--cyan);letter-spacing:3px}.story-title{font-weight:750}.story-caption{fill:var(--ink)}.story-source{fill:var(--muted)}    .illustration text { fill: var(--ink); font: 16px var(--sans); }
    .illustration .node { fill: var(--surface); stroke: var(--cyan); stroke-width: 2; }
    .illustration .wire { fill: none; stroke: var(--blue); stroke-width: 3; }
    .illustration .alternate { stroke: var(--amber); }
    .illustration .note { fill: var(--amber); }
    .illustration .canvas { fill: var(--surface); }
    .illustration .panel { fill: var(--surface-raised); stroke: var(--line); stroke-width: 1; }
    .illustration .diagram-index { fill: var(--cyan); font-family: var(--mono); font-weight: 700; }
    .illustration .diagram-heading { font-weight: 700; }
    .illustration .rule { fill: none; stroke: var(--line); stroke-width: 1; }
    .illustration .blue-label { fill: var(--blue); }
    .illustration .good-label { fill: var(--cyan); }
    .illustration .fault { fill: var(--red); font-weight: 700; }
    .illustration .result { fill: var(--ground); stroke: var(--cyan); stroke-width: 1; }
    .illustration .limit { fill: var(--ground); stroke: var(--amber); stroke-width: 1; }
    .illustration .packet, .illustration .picture { fill: var(--ground); stroke: var(--line); stroke-width: 1; }
    .illustration .blue-packet { fill: var(--ground); stroke: var(--blue); stroke-width: 1; }
    .illustration .amber-packet { fill: var(--ground); stroke: var(--amber); stroke-width: 1; }
    .illustration .missing { fill: var(--ground); stroke: var(--red); stroke-width: 1; stroke-dasharray: 3 3; }
    .illustration .packet-label { font-family: var(--mono); }
    .illustration .reference { fill: none; stroke: var(--amber); stroke-width: 2; stroke-dasharray: 4 4; }</style>
<rect width="1080" height="1920" fill="var(--surface)"/>
<text x="108" y="148" font-size="28" class="eyebrow">VIDEO ENGINEERING DAILY · 003</text>
<text x="108" y="228" font-size="54" class="story-title">RTP timestamps at 59.94 fps</text>
<g class="illustration" transform="translate(216 342) scale(2.7)"><rect x="0" y="0" width="240" height="400" rx="8" class="canvas"/><text x="12" y="26" class="diagram-index" text-anchor="start">03</text><text x="48" y="26" class="diagram-heading" text-anchor="start">INTEGER CLOCK STEPS</text><path d="M12 40H228" class="rule"/><rect x="12" y="56" width="216" height="67" rx="8" class="panel"/><text x="120" y="83" class="" text-anchor="middle">90,000 × 1.001 ÷ 60</text><text x="120" y="109" class="note" text-anchor="middle">1501.5 ticks / frame</text><text x="22" y="153" class="diagram-heading" text-anchor="start">Frame</text><text x="100" y="153" class="diagram-heading" text-anchor="start">Relative RTP ticks</text><path d="M20 164H220" class="rule"/><text x="26" y="191" class="" text-anchor="start">F1</text><text x="117" y="191" class="" text-anchor="start">0</text><text x="163" y="213" class="blue-label" text-anchor="start">+1501</text><text x="26" y="235" class="" text-anchor="start">F2</text><text x="117" y="235" class="" text-anchor="start">1501</text><text x="163" y="257" class="note" text-anchor="start">+1502</text><text x="26" y="279" class="" text-anchor="start">F3</text><text x="117" y="279" class="" text-anchor="start">3003</text><text x="163" y="301" class="blue-label" text-anchor="start">+1501</text><text x="26" y="323" class="" text-anchor="start">F4</text><text x="117" y="323" class="" text-anchor="start">4504</text><rect x="12" y="346" width="216" height="40" rx="8" class="result"/><text x="120" y="372" class="good-label" text-anchor="middle">Check cadence, not equality</text></g>
<path d="M108 1460H972" stroke="var(--line)"/>
<text x="108" y="1506" font-size="40" class="story-caption">Example relative RTP timestamps</text>
<text x="108" y="1558" font-size="40" class="story-caption">advance by 1501, then 1502, then</text>
<text x="108" y="1610" font-size="40" class="story-caption">1501 ticks. The initial phase and</text>
<text x="108" y="1662" font-size="40" class="story-caption">timestamp offset can differ; the</text>
<text x="108" y="1714" font-size="40" class="story-caption">two-frame average is 1501.5 ticks.</text>
