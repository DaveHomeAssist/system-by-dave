<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" role="img" aria-labelledby="title desc">
<title id="title">EDID changes and source detection</title><desc id="desc">The source reads capability data from the EDID manager. A notification may prompt another read, but source behavior varies. Measure the output afterward.</desc>
<style>:root {
  --ground:#111111; --surface:#191919; --surface-raised:#242424; --raised:#303030;
  --line:#3c3c3c; --ink:#eeeeee; --muted:#b6b6b6; --faint:#a0a0a0;
  --blue:#a8bed9; --cyan:#becbd9; --amber:#d0c0a0; --red:#e6a8a8;
  --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
} text {font-family:system-ui,sans-serif;fill:var(--ink)} .eyebrow{fill:var(--cyan);letter-spacing:3px}.story-title{font-weight:750}.story-caption{fill:var(--ink)}.story-source{fill:var(--muted)}    .illustration text { fill: var(--ink); font: 16px var(--sans); }
    .illustration .node { fill: var(--surface); stroke: var(--cyan); stroke-width: 2; }
    .illustration .wire { fill: none; stroke: var(--blue); stroke-width: 3; }
    .illustration .alternate { stroke: var(--amber); }
    .illustration .note { fill: var(--amber); }
    .illustration .canvas { fill: var(--surface); }
    .illustration .panel { fill: var(--surface-raised); stroke: var(--line); stroke-width: 1; }
    .illustration .diagram-index { fill: var(--cyan); font-family: var(--mono); font-weight: 700; }
    .illustration .diagram-heading { font-weight: 700; }
    .illustration .rule { fill: none; stroke: var(--line); stroke-width: 1; }
    .illustration .blue-label { fill: var(--blue); }
    .illustration .good-label { fill: var(--cyan); }
    .illustration .fault { fill: var(--red); font-weight: 700; }
    .illustration .result { fill: var(--ground); stroke: var(--cyan); stroke-width: 1; }
    .illustration .limit { fill: var(--ground); stroke: var(--amber); stroke-width: 1; }
    .illustration .packet, .illustration .picture { fill: var(--ground); stroke: var(--line); stroke-width: 1; }
    .illustration .blue-packet { fill: var(--ground); stroke: var(--blue); stroke-width: 1; }
    .illustration .amber-packet { fill: var(--ground); stroke: var(--amber); stroke-width: 1; }
    .illustration .missing { fill: var(--ground); stroke: var(--red); stroke-width: 1; stroke-dasharray: 3 3; }
    .illustration .packet-label { font-family: var(--mono); }
    .illustration .reference { fill: none; stroke: var(--amber); stroke-width: 2; stroke-dasharray: 4 4; }</style>
<rect width="1080" height="1920" fill="var(--surface)"/>
<text x="108" y="148" font-size="28" class="eyebrow">VIDEO ENGINEERING DAILY · 008</text>
<text x="108" y="228" font-size="54" class="story-title">EDID changes and source</text>
<text x="108" y="304" font-size="54" class="story-title">detection</text>
<g class="illustration" transform="translate(216 342) scale(2.7)"><rect x="0" y="0" width="240" height="400" rx="8" class="canvas"/><text x="12" y="26" class="diagram-index" text-anchor="start">08</text><text x="48" y="26" class="diagram-heading" text-anchor="start">EDID READBACK</text><path d="M12 40H228" class="rule"/><rect x="12" y="56" width="216" height="72" rx="8" class="panel"/><text x="26" y="80" class="diagram-heading" text-anchor="start">EDID manager</text><text x="26" y="106" class="blue-label" text-anchor="start">New capability data</text><path d="M84 182V128m-4 6l4-6l4 6" class="wire alternate"/><text x="22" y="161" class="note" text-anchor="start">Read</text><path d="M156 128V182m-4-6l4 6l4-6" class="wire"/><text x="170" y="161" class="blue-label" text-anchor="start">Data</text><rect x="12" y="192" width="216" height="86" rx="8" class="panel"/><text x="26" y="218" class="diagram-heading" text-anchor="start">Source</text><text x="26" y="243" class="" text-anchor="start">Cache updates on re-read</text><text x="26" y="266" class="note" text-anchor="start">Output may stay the same</text><path d="M120 288V308m-4 -6l4 6l4 -6" class="wire"/><rect x="12" y="318" width="216" height="62" rx="8" class="result"/><text x="26" y="343" class="good-label" text-anchor="start">Measure output timing</text><text x="26" y="367" class="" text-anchor="start">Do not assume it changed</text></g>
<path d="M108 1460H972" stroke="var(--line)"/>
<text x="108" y="1506" font-size="40" class="story-caption">The source reads capability data</text>
<text x="108" y="1558" font-size="40" class="story-caption">from the EDID manager. A</text>
<text x="108" y="1610" font-size="40" class="story-caption">notification may prompt another</text>
<text x="108" y="1662" font-size="40" class="story-caption">read, but source behavior varies.</text>
<text x="108" y="1714" font-size="40" class="story-caption">Measure the output afterward.</text>
