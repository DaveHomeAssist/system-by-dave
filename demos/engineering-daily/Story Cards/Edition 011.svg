<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" role="img" aria-labelledby="title desc">
<title id="title">12G-SDI interface and image mapping</title><desc id="desc">The 12G-SDI electrical link is only one layer. A successful handoff also needs a supported image mapping and matching endpoint format capability.</desc>
<style>:root {
  --ground:#111111; --surface:#191919; --surface-raised:#242424; --raised:#303030;
  --line:#3c3c3c; --ink:#eeeeee; --muted:#b6b6b6; --faint:#a0a0a0;
  --blue:#a8bed9; --cyan:#becbd9; --amber:#d0c0a0; --red:#e6a8a8;
  --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
} text {font-family:system-ui,sans-serif;fill:var(--ink)} .eyebrow{fill:var(--cyan);letter-spacing:3px}.story-title{font-weight:750}.story-caption{fill:var(--ink)}.story-source{fill:var(--muted)}    .illustration text { fill: var(--ink); font: 16px var(--sans); }
    .illustration .node { fill: var(--surface); stroke: var(--cyan); stroke-width: 2; }
    .illustration .wire { fill: none; stroke: var(--blue); stroke-width: 3; }
    .illustration .alternate { stroke: var(--amber); }
    .illustration .note { fill: var(--amber); }
    .illustration .canvas { fill: var(--surface); }
    .illustration .panel { fill: var(--surface-raised); stroke: var(--line); stroke-width: 1; }
    .illustration .diagram-index { fill: var(--cyan); font-family: var(--mono); font-weight: 700; }
    .illustration .diagram-heading { font-weight: 700; }
    .illustration .rule { fill: none; stroke: var(--line); stroke-width: 1; }
    .illustration .blue-label { fill: var(--blue); }
    .illustration .good-label { fill: var(--cyan); }
    .illustration .fault { fill: var(--red); font-weight: 700; }
    .illustration .result { fill: var(--ground); stroke: var(--cyan); stroke-width: 1; }
    .illustration .limit { fill: var(--ground); stroke: var(--amber); stroke-width: 1; }
    .illustration .packet, .illustration .picture { fill: var(--ground); stroke: var(--line); stroke-width: 1; }
    .illustration .blue-packet { fill: var(--ground); stroke: var(--blue); stroke-width: 1; }
    .illustration .amber-packet { fill: var(--ground); stroke: var(--amber); stroke-width: 1; }
    .illustration .missing { fill: var(--ground); stroke: var(--red); stroke-width: 1; stroke-dasharray: 3 3; }
    .illustration .packet-label { font-family: var(--mono); }
    .illustration .reference { fill: none; stroke: var(--amber); stroke-width: 2; stroke-dasharray: 4 4; }</style>
<rect width="1080" height="1920" fill="var(--surface)"/>
<text x="108" y="148" font-size="28" class="eyebrow">VIDEO ENGINEERING DAILY · 011</text>
<text x="108" y="228" font-size="54" class="story-title">12G-SDI interface and image</text>
<text x="108" y="304" font-size="54" class="story-title">mapping</text>
<g class="illustration" transform="translate(216 342) scale(2.7)"><rect x="0" y="0" width="240" height="400" rx="8" class="canvas"/><text x="12" y="26" class="diagram-index" text-anchor="start">11</text><text x="48" y="26" class="diagram-heading" text-anchor="start">12G IS A LAYER</text><path d="M12 40H228" class="rule"/><rect x="18" y="61" width="204" height="71" rx="8" class="panel"/><text x="34" y="87" class="diagram-heading" text-anchor="start">1  Format description</text><text x="34" y="111" class="note" text-anchor="start">raster · rate · sampling</text><path d="M120 132V153m-4-6l4 6l4-6" class="wire"/><rect x="18" y="153" width="204" height="73" rx="8" class="panel"/><text x="34" y="179" class="diagram-heading" text-anchor="start">2  Image mapping</text><text x="34" y="203" class="blue-label" text-anchor="start">e.g. ST 2082-10</text><path d="M120 226V247m-4-6l4 6l4-6" class="wire"/><rect x="18" y="247" width="204" height="61" rx="8" class="panel"/><text x="34" y="273" class="diagram-heading" text-anchor="start">3  Electrical link</text><text x="34" y="295" class="amber-label" text-anchor="start">12G · 11.88 Gb/s payload</text><path d="M120 308V330m-4-6l4 6l4-6" class="wire"/><rect x="18" y="330" width="204" height="51" rx="8" class="result"/><text x="120" y="358" class="good-label" text-anchor="middle">Both endpoints must agree</text><text x="120" y="376" class="note" text-anchor="middle">link alone is not enough</text></g>
<path d="M108 1460H972" stroke="var(--line)"/>
<text x="108" y="1506" font-size="40" class="story-caption">The 12G-SDI electrical link is only</text>
<text x="108" y="1558" font-size="40" class="story-caption">one layer. A successful handoff also</text>
<text x="108" y="1610" font-size="40" class="story-caption">needs a supported image mapping and</text>
<text x="108" y="1662" font-size="40" class="story-caption">matching endpoint format capability.</text>
<a href="https://pub.smpte.org/latest/st2082-1/st2082-1-2023.pdf"><text x="108" y="1808" font-size="28" class="story-source">SMPTE ST 2082-1:2023, 12 Gb/s SDI Electrical</text></a>
</svg>
