<text x="24" y="309" class="good-label">10 ms exposure</text>
<text x="24" y="365">180° in both cases</text>
<text x="24" y="390" class="note">Half the frame interval</text></g>
<path d="M108 1460H972" stroke="var(--line)"/>
<text x="108" y="1506" font-size="40" class="story-caption">The blue segment is exposure and the</text>
<text x="108" y="1558" font-size="40" class="story-caption">remaining segment is the rest of the</text>
<text x="108" y="1610" font-size="40" class="story-caption">frame interval. Both rows use the</text>
