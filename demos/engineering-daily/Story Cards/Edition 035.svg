<path d="M114 117v17" class="reference"/>
<text x="24" y="163" class="good-label">20 ms exposure</text>
<rect x="12" y="198" width="216" height="132" rx="4" class="panel"/>
<text x="24" y="225" class="blue-label">2 / 50 fps</text>
<text x="24" y="251">20 ms frame</text>
<rect x="24" y="263" width="90" height="17" rx="4" class="packet"/>
<path d="M24 272h45" class="wire"/>
