<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" role="img" aria-labelledby="title desc">
<title id="title">PQ and HLG transfer functions</title><desc id="desc">PQ references absolute luminance; HLG presentation depends on the display system and viewing conditions. This comparison is not a transfer-function plot or a guarantee of displayed brightness.</desc>
<style>:root {
  --ground:#111111; --surface:#191919; --surface-raised:#242424; --raised:#303030;
  --line:#3c3c3c; --ink:#eeeeee; --muted:#b6b6b6; --faint:#a0a0a0;
  --blue:#a8bed9; --cyan:#becbd9; --amber:#d0c0a0; --red:#e6a8a8;
  --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
} text {font-family:system-ui,sans-serif;fill:var(--ink)} .eyebrow{fill:var(--cyan);letter-spacing:3px}.story-title{font-weight:750}.story-caption{fill:var(--ink)}.story-source{fill:var(--muted)}    .illustration text { fill: var(--ink); font: 16px var(--sans); }
    .illustration .node { fill: var(--surface); stroke: var(--cyan); stroke-width: 2; }
    .illustration .wire { fill: none; stroke: var(--blue); stroke-width: 3; }
    .illustration .alternate { stroke: var(--amber); }
    .illustration .note { fill: var(--amber); }
    .illustration .canvas { fill: var(--surface); }
    .illustration .panel { fill: var(--surface-raised); stroke: var(--line); stroke-width: 1; }
    .illustration .diagram-index { fill: var(--cyan); font-family: var(--mono); font-weight: 700; }
    .illustration .diagram-heading { font-weight: 700; }
    .illustration .rule { fill: none; stroke: var(--line); stroke-width: 1; }
    .illustration .blue-label { fill: var(--blue); }
    .illustration .good-label { fill: var(--cyan); }
    .illustration .fault { fill: var(--red); font-weight: 700; }
    .illustration .result { fill: var(--ground); stroke: var(--cyan); stroke-width: 1; }
    .illustration .limit { fill: var(--ground); stroke: var(--amber); stroke-width: 1; }
    .illustration .packet, .illustration .picture { fill: var(--ground); stroke: var(--line); stroke-width: 1; }
    .illustration .blue-packet { fill: var(--ground); stroke: var(--blue); stroke-width: 1; }
    .illustration .amber-packet { fill: var(--ground); stroke: var(--amber); stroke-width: 1; }
    .illustration .missing { fill: var(--ground); stroke: var(--red); stroke-width: 1; stroke-dasharray: 3 3; }
    .illustration .packet-label { font-family: var(--mono); }
    .illustration .reference { fill: none; stroke: var(--amber); stroke-width: 2; stroke-dasharray: 4 4; }</style>
<rect width="1080" height="1920" fill="var(--surface)"/>
<text x="108" y="148" font-size="28" class="eyebrow">VIDEO ENGINEERING DAILY · 004</text>
<text x="108" y="228" font-size="54" class="story-title">PQ and HLG transfer functions</text>
<g class="illustration" transform="translate(216 342) scale(2.7)"><rect x="0" y="0" width="240" height="400" rx="8" class="canvas"/><text x="12" y="26" class="diagram-index" text-anchor="start">04</text><text x="48" y="26" class="diagram-heading" text-anchor="start">HDR INTERPRETATION</text><path d="M12 40H228" class="rule"/><rect x="12" y="56" width="216" height="122" rx="8" class="panel"/><text x="26" y="83" class="blue-label" text-anchor="start">PQ</text><text x="26" y="110" class="" text-anchor="start">Code values reference</text><text x="26" y="134" class="" text-anchor="start">absolute luminance</text><text x="26" y="160" class="note" text-anchor="start">Display limits still apply</text><text x="120" y="207" class="note" text-anchor="middle">Choose the correct transform</text><rect x="12" y="230" width="216" height="122" rx="8" class="panel"/><text x="26" y="257" class="good-label" text-anchor="start">HLG</text><text x="26" y="284" class="" text-anchor="start">Presentation depends on</text><text x="26" y="308" class="" text-anchor="start">display + viewing setup</text><text x="26" y="337" class="note" text-anchor="start">No fixed-nit guarantee</text><text x="120" y="383" class="" text-anchor="middle">An HDR label is not enough</text></g>
<path d="M108 1460H972" stroke="var(--line)"/>
<text x="108" y="1506" font-size="40" class="story-caption">PQ references absolute luminance;</text>
<text x="108" y="1558" font-size="40" class="story-caption">HLG presentation depends on the</text>
<text x="108" y="1610" font-size="40" class="story-caption">display system and viewing</text>
<text x="108" y="1662" font-size="40" class="story-caption">conditions. This comparison is not a</text>
<text x="108" y="1714" font-size="40" class="story-caption">transfer-function plot or a</text>
<text x="108" y="1766" font-size="40" class="story-caption">guarantee of displayed brightness.</text>
<a href="https://www.itu.int/dms_pubrec/itu-r/rec/bt/R-REC-BT.2100-3-202502-I%21%21PDF-E.pdf"><text x="108" y="1808" font-size="28" class="story-source">ITU-R BT.2100-3; ITU-R BT.2408-4</text></a>
</svg>
