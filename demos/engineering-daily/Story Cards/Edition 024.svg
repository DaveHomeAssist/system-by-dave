<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" role="img" aria-labelledby="title desc">
<title id="title">B frame reordering</title><desc id="desc">Example with future-referenced B pictures: P3 arrives before B1 and B2; a buffer restores display order. The blue arrow shows a prediction dependency, not a cable or measured delay.</desc>
<style>:root {
  --ground:#111111; --surface:#191919; --surface-raised:#242424; --raised:#303030;
  --line:#3c3c3c; --ink:#eeeeee; --muted:#b6b6b6; --faint:#a0a0a0;
  --blue:#a8bed9; --cyan:#becbd9; --amber:#d0c0a0; --red:#e6a8a8;
  --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
} text {font-family:system-ui,sans-serif;fill:var(--ink)} .eyebrow{fill:var(--cyan);letter-spacing:3px}.story-title{font-weight:750}.story-caption{fill:var(--ink)}.story-source{fill:var(--muted)}    .illustration text { fill: var(--ink); font: 16px var(--sans); }
    .illustration .node { fill: var(--surface); stroke: var(--cyan); stroke-width: 2; }
    .illustration .wire { fill: none; stroke: var(--blue); stroke-width: 3; }
    .illustration .alternate { stroke: var(--amber); }
    .illustration .note { fill: var(--amber); }
    .illustration .canvas { fill: var(--surface); }
    .illustration .panel { fill: var(--surface-raised); stroke: var(--line); stroke-width: 1; }
    .illustration .diagram-index { fill: var(--cyan); font-family: var(--mono); font-weight: 700; }
    .illustration .diagram-heading { font-weight: 700; }
    .illustration .rule { fill: none; stroke: var(--line); stroke-width: 1; }
    .illustration .blue-label { fill: var(--blue); }
    .illustration .good-label { fill: var(--cyan); }
    .illustration .fault { fill: var(--red); font-weight: 700; }
    .illustration .result { fill: var(--ground); stroke: var(--cyan); stroke-width: 1; }
    .illustration .limit { fill: var(--ground); stroke: var(--amber); stroke-width: 1; }
    .illustration .packet, .illustration .picture { fill: var(--ground); stroke: var(--line); stroke-width: 1; }
    .illustration .blue-packet { fill: var(--ground); stroke: var(--blue); stroke-width: 1; }
    .illustration .amber-packet { fill: var(--ground); stroke: var(--amber); stroke-width: 1; }
    .illustration .missing { fill: var(--ground); stroke: var(--red); stroke-width: 1; stroke-dasharray: 3 3; }
    .illustration .packet-label { font-family: var(--mono); }
    .illustration .reference { fill: none; stroke: var(--amber); stroke-width: 2; stroke-dasharray: 4 4; }</style>
<rect width="1080" height="1920" fill="var(--surface)"/>
<text x="108" y="148" font-size="28" class="eyebrow">VIDEO ENGINEERING DAILY · 024</text>
<text x="108" y="228" font-size="54" class="story-title">B frame reordering</text>
<g class="illustration" transform="translate(216 342) scale(2.7)"><rect width="240" height="400" rx="6" class="canvas"/><text x="12" y="26" class="diagram-index">24</text><text x="48" y="26" class="diagram-heading">FRAME ORDER</text><path d="M12 40H228" class="rule"/><rect x="12" y="52" width="216" height="82" rx="6" class="panel"/><text x="24" y="76" class="blue-label">1 / Display order</text><rect x="24" y="89" width="43" height="34" rx="4" class="node"/><text x="45" y="112" text-anchor="middle">I0</text><rect x="73" y="89" width="43" height="34" rx="4" class="node"/><text x="94" y="112" text-anchor="middle">B1</text><rect x="122" y="89" width="43" height="34" rx="4" class="node"/><text x="143" y="112" text-anchor="middle">B2</text><rect x="171" y="89" width="43" height="34" rx="4" class="node"/><text x="192" y="112" text-anchor="middle">P3</text><rect x="12" y="150" width="216" height="82" rx="6" class="panel"/><text x="24" y="174" class="blue-label">2 / Decoder input</text><rect x="24" y="187" width="43" height="34" rx="4" class="node"/><text x="45" y="210" text-anchor="middle">I0</text><rect x="73" y="187" width="43" height="34" rx="4" class="node"/><text x="94" y="210" text-anchor="middle">P3</text><rect x="122" y="187" width="43" height="34" rx="4" class="node"/><text x="143" y="210" text-anchor="middle">B1</text><rect x="171" y="187" width="43" height="34" rx="4" class="node"/><text x="192" y="210" text-anchor="middle">B2</text><path d="M94 224V245H168V224m-6 7l6-7l6 7" class="wire"/><text x="120" y="272" text-anchor="middle" class="blue-label">P3 available first</text><rect x="12" y="291" width="216" height="80" rx="6" class="panel"/><text x="24" y="315" class="note">Future reference</text><text x="24" y="340">Buffer, then reorder</text><text x="24" y="363" class="good-label">Show I0 B1 B2 P3</text><text x="120" y="393" text-anchor="middle">Example, not a delay spec</text></g>
<path d="M108 1460H972" stroke="var(--line)"/>
<text x="108" y="1506" font-size="40" class="story-caption">Example with future-referenced B</text>
<text x="108" y="1558" font-size="40" class="story-caption">pictures: P3 arrives before B1 and</text>
<text x="108" y="1610" font-size="40" class="story-caption">B2; a buffer restores display order.</text>
<text x="108" y="1662" font-size="40" class="story-caption">The blue arrow shows a prediction</text>
<text x="108" y="1714" font-size="40" class="story-caption">dependency, not a cable or measured</text>
<text x="108" y="1766" font-size="40" class="story-caption">delay.</text>
