<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" role="img" aria-labelledby="title desc">
<title id="title">Frame rate conversion families</title><desc id="desc">FS4 rate families, in fps. Blue lines group rates within a family. The amber cross marks a 50 to 59.94 fps request outside these families. Conceptual grouping, not physical wiring.</desc>
<style>:root {
  --ground:#111111; --surface:#191919; --surface-raised:#242424; --raised:#303030;
  --line:#3c3c3c; --ink:#eeeeee; --muted:#b6b6b6; --faint:#a0a0a0;
  --blue:#a8bed9; --cyan:#becbd9; --amber:#d0c0a0; --red:#e6a8a8;
  --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
} text {font-family:system-ui,sans-serif;fill:var(--ink)} .eyebrow{fill:var(--cyan);letter-spacing:3px}.story-title{font-weight:750}.story-caption{fill:var(--ink)}.story-source{fill:var(--muted)}    .illustration text { fill: var(--ink); font: 16px var(--sans); }
    .illustration .node { fill: var(--surface); stroke: var(--cyan); stroke-width: 2; }
    .illustration .wire { fill: none; stroke: var(--blue); stroke-width: 3; }
    .illustration .alternate { stroke: var(--amber); }
    .illustration .note { fill: var(--amber); }
    .illustration .canvas { fill: var(--surface); }
    .illustration .panel { fill: var(--surface-raised); stroke: var(--line); stroke-width: 1; }
    .illustration .diagram-index { fill: var(--cyan); font-family: var(--mono); font-weight: 700; }
    .illustration .diagram-heading { font-weight: 700; }
    .illustration .rule { fill: none; stroke: var(--line); stroke-width: 1; }
    .illustration .blue-label { fill: var(--blue); }
    .illustration .good-label { fill: var(--cyan); }
    .illustration .fault { fill: var(--red); font-weight: 700; }
    .illustration .result { fill: var(--ground); stroke: var(--cyan); stroke-width: 1; }
    .illustration .limit { fill: var(--ground); stroke: var(--amber); stroke-width: 1; }
    .illustration .packet, .illustration .picture { fill: var(--ground); stroke: var(--line); stroke-width: 1; }
    .illustration .blue-packet { fill: var(--ground); stroke: var(--blue); stroke-width: 1; }
    .illustration .amber-packet { fill: var(--ground); stroke: var(--amber); stroke-width: 1; }
    .illustration .missing { fill: var(--ground); stroke: var(--red); stroke-width: 1; stroke-dasharray: 3 3; }
    .illustration .packet-label { font-family: var(--mono); }
    .illustration .reference { fill: none; stroke: var(--amber); stroke-width: 2; stroke-dasharray: 4 4; }</style>
<rect width="1080" height="1920" fill="var(--surface)"/>
<text x="108" y="148" font-size="28" class="eyebrow">VIDEO ENGINEERING DAILY · 023</text>
<text x="108" y="228" font-size="54" class="story-title">Frame rate conversion families</text>
<g class="illustration" transform="translate(216 342) scale(2.7)"><rect width="240" height="400" rx="6" class="canvas"/><text x="12" y="26" class="diagram-index">23</text><text x="48" y="26" class="diagram-heading">RATE FAMILIES</text><path d="M12 40H228" class="rule"/><rect x="12" y="50" width="216" height="70" rx="6" class="panel"/><text x="24" y="73" class="blue-label">1 / Fractional fps</text><text x="120" y="99" text-anchor="middle">59.94 / 29.97 / 23.98</text><path d="M32 109H208" class="wire"/><rect x="12" y="132" width="216" height="70" rx="6" class="panel"/><text x="24" y="155" class="blue-label">2 / 50 fps family</text><text x="120" y="181" text-anchor="middle">50 / 25 fps</text><path d="M32 191H208" class="wire"/><rect x="12" y="214" width="216" height="70" rx="6" class="panel"/><text x="24" y="237" class="blue-label">3 / 60 fps family</text><text x="120" y="263" text-anchor="middle">60 / 30 / 24 fps</text><path d="M32 273H208" class="wire"/><rect x="12" y="296" width="216" height="76" rx="6" class="panel"/><text x="24" y="319" class="note">Cross-family request</text><text x="24" y="350">50 fps</text><text x="140" y="350">59.94 fps</text><path d="M78 345H132m-6-5l6 5l-6 5M101 336l18 18m0-18l-18 18" class="reference"/><text x="120" y="392" text-anchor="middle" class="note">Outside FS4 capability</text></g>
<path d="M108 1460H972" stroke="var(--line)"/>
<text x="108" y="1506" font-size="40" class="story-caption">FS4 rate families, in fps. Blue</text>
<text x="108" y="1558" font-size="40" class="story-caption">lines group rates within a family.</text>
<text x="108" y="1610" font-size="40" class="story-caption">The amber cross marks a 50 to 59.94</text>
<text x="108" y="1662" font-size="40" class="story-caption">fps request outside these families.</text>
<text x="108" y="1714" font-size="40" class="story-caption">Conceptual grouping, not physical</text>
<text x="108" y="1766" font-size="40" class="story-caption">wiring.</text>
<a href="https://www.aja.com/products/fs4"><text x="108" y="1808" font-size="28" class="story-source">AJA FS4 technical specifications, Format Conversion</text></a>
</svg>
