<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" role="img" aria-labelledby="title desc">
<title id="title">Projection throw ratio</title><desc id="desc">Illustrative top view, not to scale: throw D = 3 m and image width W = 2 m give D/W = 1.5:1. Use width, not diagonal. Verify the actual lens/projector.</desc>
<style>:root {
  --ground:#111111; --surface:#191919; --surface-raised:#242424; --raised:#303030;
  --line:#3c3c3c; --ink:#eeeeee; --muted:#b6b6b6; --faint:#a0a0a0;
  --blue:#a8bed9; --cyan:#becbd9; --amber:#d0c0a0; --red:#e6a8a8;
  --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
} text {font-family:system-ui,sans-serif;fill:var(--ink)} .eyebrow{fill:var(--cyan);letter-spacing:3px}.story-title{font-weight:750}.story-caption{fill:var(--ink)}.story-source{fill:var(--muted)}    .illustration text { fill: var(--ink); font: 16px var(--sans); }
    .illustration .node { fill: var(--surface); stroke: var(--cyan); stroke-width: 2; }
    .illustration .wire { fill: none; stroke: var(--blue); stroke-width: 3; }
    .illustration .alternate { stroke: var(--amber); }
    .illustration .note { fill: var(--amber); }
    .illustration .canvas { fill: var(--surface); }
    .illustration .panel { fill: var(--surface-raised); stroke: var(--line); stroke-width: 1; }
    .illustration .diagram-index { fill: var(--cyan); font-family: var(--mono); font-weight: 700; }
    .illustration .diagram-heading { font-weight: 700; }
    .illustration .rule { fill: none; stroke: var(--line); stroke-width: 1; }
    .illustration .blue-label { fill: var(--blue); }
    .illustration .good-label { fill: var(--cyan); }
    .illustration .fault { fill: var(--red); font-weight: 700; }
    .illustration .result { fill: var(--ground); stroke: var(--cyan); stroke-width: 1; }
    .illustration .limit { fill: var(--ground); stroke: var(--amber); stroke-width: 1; }
    .illustration .packet, .illustration .picture { fill: var(--ground); stroke: var(--line); stroke-width: 1; }
    .illustration .blue-packet { fill: var(--ground); stroke: var(--blue); stroke-width: 1; }
    .illustration .amber-packet { fill: var(--ground); stroke: var(--amber); stroke-width: 1; }
    .illustration .missing { fill: var(--ground); stroke: var(--red); stroke-width: 1; stroke-dasharray: 3 3; }
    .illustration .packet-label { font-family: var(--mono); }
    .illustration .reference { fill: none; stroke: var(--amber); stroke-width: 2; stroke-dasharray: 4 4; }</style>
<rect width="1080" height="1920" fill="var(--surface)"/>
<text x="108" y="148" font-size="28" class="eyebrow">VIDEO ENGINEERING DAILY · 017</text>
<text x="108" y="228" font-size="54" class="story-title">Projection throw ratio</text>
<g class="illustration" transform="translate(216 342) scale(2.7)"><rect x="0" y="0" width="240" height="400" rx="6" class="canvas"/><text x="12" y="26" class="diagram-index">17</text><text x="48" y="26" class="diagram-heading">THROW RATIO</text><path d="M12 40H228" class="rule"/><rect x="12" y="54" width="216" height="214" rx="6" class="panel"/><text x="120" y="78" text-anchor="middle" class="note">TOP VIEW EXAMPLE</text><text x="132" y="103" text-anchor="middle">Projector</text><rect x="109" y="113" width="46" height="24" rx="4" class="node"/><circle cx="132" cy="141" r="4" class="blue-packet"/><path d="M132 145L60 218M132 145L204 218" class="wire"/><path d="M60 218H204" class="wire"/><path d="M30 145V218m-4-6l4 6l4-6M26 151l4-6l4 6" class="reference"/><text x="49" y="185" text-anchor="middle" class="note">3 m</text><path d="M60 231V239M204 231V239M60 235H204m-6-4l6 4l-6 4M66 231l-6 4l6 4" class="wire"/><text x="132" y="256" text-anchor="middle" class="blue-label">2 m image width</text><rect x="12" y="282" width="216" height="62" rx="6" class="result"/><text x="120" y="305" text-anchor="middle">Throw ratio = D / W</text><text x="120" y="331" text-anchor="middle" class="good-label">3 m / 2 m = 1.5:1</text><text x="120" y="373" text-anchor="middle" class="note">Not to scale</text><text x="120" y="395" text-anchor="middle">Use width, not diagonal</text></g>
<path d="M108 1460H972" stroke="var(--line)"/>
<text x="108" y="1506" font-size="40" class="story-caption">Illustrative top view, not to scale:</text>
<text x="108" y="1558" font-size="40" class="story-caption">throw D = 3 m and image width W = 2</text>
<text x="108" y="1610" font-size="40" class="story-caption">m give D/W = 1.5:1. Use width, not</text>
<text x="108" y="1662" font-size="40" class="story-caption">diagonal. Verify the actual</text>
<text x="108" y="1714" font-size="40" class="story-caption">lens/projector.</text>
