<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" role="img" aria-labelledby="title desc">
<title id="title">Chroma sampling and fine text</title><desc id="desc">One chroma plane: 4:2:2 halves horizontal samples, not rows. Luma remains full resolution. Dots show sample counts, not filter shape or exact chroma siting.</desc>
<style>:root {
  --ground:#111111; --surface:#191919; --surface-raised:#242424; --raised:#303030;
  --line:#3c3c3c; --ink:#eeeeee; --muted:#b6b6b6; --faint:#a0a0a0;
  --blue:#a8bed9; --cyan:#becbd9; --amber:#d0c0a0; --red:#e6a8a8;
  --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
} text {font-family:system-ui,sans-serif;fill:var(--ink)} .eyebrow{fill:var(--cyan);letter-spacing:3px}.story-title{font-weight:750}.story-caption{fill:var(--ink)}.story-source{fill:var(--muted)}    .illustration text { fill: var(--ink); font: 16px var(--sans); }
    .illustration .node { fill: var(--surface); stroke: var(--cyan); stroke-width: 2; }
    .illustration .wire { fill: none; stroke: var(--blue); stroke-width: 3; }
    .illustration .alternate { stroke: var(--amber); }
    .illustration .note { fill: var(--amber); }
    .illustration .canvas { fill: var(--surface); }
    .illustration .panel { fill: var(--surface-raised); stroke: var(--line); stroke-width: 1; }
    .illustration .diagram-index { fill: var(--cyan); font-family: var(--mono); font-weight: 700; }
    .illustration .diagram-heading { font-weight: 700; }
    .illustration .rule { fill: none; stroke: var(--line); stroke-width: 1; }
    .illustration .blue-label { fill: var(--blue); }
    .illustration .good-label { fill: var(--cyan); }
    .illustration .fault { fill: var(--red); font-weight: 700; }
    .illustration .result { fill: var(--ground); stroke: var(--cyan); stroke-width: 1; }
    .illustration .limit { fill: var(--ground); stroke: var(--amber); stroke-width: 1; }
    .illustration .packet, .illustration .picture { fill: var(--ground); stroke: var(--line); stroke-width: 1; }
    .illustration .blue-packet { fill: var(--ground); stroke: var(--blue); stroke-width: 1; }
    .illustration .amber-packet { fill: var(--ground); stroke: var(--amber); stroke-width: 1; }
    .illustration .missing { fill: var(--ground); stroke: var(--red); stroke-width: 1; stroke-dasharray: 3 3; }
    .illustration .packet-label { font-family: var(--mono); }
    .illustration .reference { fill: none; stroke: var(--amber); stroke-width: 2; stroke-dasharray: 4 4; }</style>
<rect width="1080" height="1920" fill="var(--surface)"/>
<text x="108" y="148" font-size="28" class="eyebrow">VIDEO ENGINEERING DAILY · 020</text>
<text x="108" y="228" font-size="54" class="story-title">Chroma sampling and fine text</text>
<g class="illustration" transform="translate(216 342) scale(2.7)"><rect width="240" height="400" rx="6" class="canvas"/><text x="12" y="26" class="diagram-index">20</text><text x="48" y="26" class="diagram-heading">CHROMA SAMPLES</text><path d="M12 40H228" class="rule"/><rect x="12" y="54" width="216" height="132" rx="6" class="panel"/><text x="24" y="80" class="blue-label">4:4:4</text><text x="24" y="104">4 columns per row</text><circle cx="48" cy="130" r="8" class="blue-packet"/><circle cx="96" cy="130" r="8" class="blue-packet"/><circle cx="144" cy="130" r="8" class="blue-packet"/><circle cx="192" cy="130" r="8" class="blue-packet"/><circle cx="48" cy="160" r="8" class="blue-packet"/><circle cx="96" cy="160" r="8" class="blue-packet"/><circle cx="144" cy="160" r="8" class="blue-packet"/><circle cx="192" cy="160" r="8" class="blue-packet"/><rect x="12" y="200" width="216" height="132" rx="6" class="panel"/><text x="24" y="226" class="note">4:2:2</text><text x="24" y="250">2 columns per row</text><circle cx="48" cy="276" r="8" class="amber-packet"/><circle cx="144" cy="276" r="8" class="amber-packet"/><circle cx="48" cy="306" r="8" class="amber-packet"/><circle cx="144" cy="306" r="8" class="amber-packet"/><path d="M96 266V286M192 266V286M96 296V316M192 296V316" class="rule"/><text x="120" y="360" text-anchor="middle" class="good-label">Luma unchanged</text><text x="120" y="386" text-anchor="middle" class="note">One chroma plane</text></g>
<path d="M108 1460H972" stroke="var(--line)"/>
<text x="108" y="1506" font-size="40" class="story-caption">One chroma plane: 4:2:2 halves</text>
<text x="108" y="1558" font-size="40" class="story-caption">horizontal samples, not rows. Luma</text>
<text x="108" y="1610" font-size="40" class="story-caption">remains full resolution. Dots show</text>
<text x="108" y="1662" font-size="40" class="story-caption">sample counts, not filter shape or</text>
<text x="108" y="1714" font-size="40" class="story-caption">exact chroma siting.</text>
<a href="https://videos.extron.com/article/testpattern?tab=tools"><text x="108" y="1808" font-size="28" class="story-source">Extron, 4:4:4 Test Pattern</text></a>
</svg>
