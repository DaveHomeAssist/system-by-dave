<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" role="img" aria-labelledby="title desc">
<title id="title">ST 2110 essence routing</title><desc id="desc">Three logical RTP flows leave an SDI gateway; they may share a physical link. Here ANC is interrupted, so picture and sound alone do not prove a complete handoff. Numbers denote ST 2110 parts.</desc>
<style>:root {
  --ground:#111111; --surface:#191919; --surface-raised:#242424; --raised:#303030;
  --line:#3c3c3c; --ink:#eeeeee; --muted:#b6b6b6; --faint:#a0a0a0;
  --blue:#a8bed9; --cyan:#becbd9; --amber:#d0c0a0; --red:#e6a8a8;
  --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
} text {font-family:system-ui,sans-serif;fill:var(--ink)} .eyebrow{fill:var(--cyan);letter-spacing:3px}.story-title{font-weight:750}.story-caption{fill:var(--ink)}.story-source{fill:var(--muted)}    .illustration text { fill: var(--ink); font: 16px var(--sans); }
    .illustration .node { fill: var(--surface); stroke: var(--cyan); stroke-width: 2; }
    .illustration .wire { fill: none; stroke: var(--blue); stroke-width: 3; }
    .illustration .alternate { stroke: var(--amber); }
    .illustration .note { fill: var(--amber); }
    .illustration .canvas { fill: var(--surface); }
    .illustration .panel { fill: var(--surface-raised); stroke: var(--line); stroke-width: 1; }
    .illustration .diagram-index { fill: var(--cyan); font-family: var(--mono); font-weight: 700; }
    .illustration .diagram-heading { font-weight: 700; }
    .illustration .rule { fill: none; stroke: var(--line); stroke-width: 1; }
    .illustration .blue-label { fill: var(--blue); }
    .illustration .good-label { fill: var(--cyan); }
    .illustration .fault { fill: var(--red); font-weight: 700; }
    .illustration .result { fill: var(--ground); stroke: var(--cyan); stroke-width: 1; }
    .illustration .limit { fill: var(--ground); stroke: var(--amber); stroke-width: 1; }
    .illustration .packet, .illustration .picture { fill: var(--ground); stroke: var(--line); stroke-width: 1; }
    .illustration .blue-packet { fill: var(--ground); stroke: var(--blue); stroke-width: 1; }
    .illustration .amber-packet { fill: var(--ground); stroke: var(--amber); stroke-width: 1; }
    .illustration .missing { fill: var(--ground); stroke: var(--red); stroke-width: 1; stroke-dasharray: 3 3; }
    .illustration .packet-label { font-family: var(--mono); }
    .illustration .reference { fill: none; stroke: var(--amber); stroke-width: 2; stroke-dasharray: 4 4; }</style>
<rect width="1080" height="1920" fill="var(--surface)"/>
<text x="108" y="148" font-size="28" class="eyebrow">VIDEO ENGINEERING DAILY · 030</text>
<text x="108" y="228" font-size="54" class="story-title">ST 2110 essence routing</text>
<g class="illustration" transform="translate(216 342) scale(2.7)"><rect width="240" height="400" class="canvas"/><text x="12" y="26" class="diagram-index">30</text><text x="48" y="26" class="diagram-heading">ESSENCE FLOWS</text><path d="M12 40H228" class="rule"/>
<rect x="12" y="52" width="216" height="64" rx="6" class="panel"/><text x="24" y="77" class="blue-label">1 / SDI gateway</text><text x="24" y="104">Video + audio + ANC</text>
<path d="M44 124V157m-5-6l5 6l5-6M120 124V157m-5-6l5 6l5-6M196 124V157m-5-6l5 6l5-6" class="wire"/>
<rect x="12" y="168" width="64" height="78" rx="6" class="panel"/><rect x="88" y="168" width="64" height="78" rx="6" class="panel"/><rect x="164" y="168" width="64" height="78" rx="6" class="panel"/>
<text x="44" y="195" text-anchor="middle">Video</text><text x="44" y="225" text-anchor="middle">-20</text><text x="120" y="195" text-anchor="middle">Audio</text><text x="120" y="225" text-anchor="middle">-30</text><text x="196" y="195" text-anchor="middle">ANC</text><text x="196" y="225" text-anchor="middle">-40</text>
<path d="M44 254V286m-5-6l5 6l5-6M120 254V286m-5-6l5 6l5-6" class="wire"/><path d="M196 254V286" class="reference"/><path d="M188 262l16 16m0-16l-16 16" fill="none" stroke="var(--amber)" stroke-width="2"/>
<rect x="12" y="300" width="216" height="76" rx="6" class="panel"/><text x="24" y="324" class="blue-label">2 / Receiver check</text><text x="24" y="347">Picture + sound: yes</text><text x="24" y="370" class="note">Required ANC: missing</text><text x="120" y="395" text-anchor="middle">Logical flows, not cables</text></g>
<path d="M108 1460H972" stroke="var(--line)"/>
<text x="108" y="1506" font-size="40" class="story-caption">Three logical RTP flows leave an SDI</text>
<text x="108" y="1558" font-size="40" class="story-caption">gateway; they may share a physical</text>
<text x="108" y="1610" font-size="40" class="story-caption">link. Here ANC is interrupted, so</text>
<text x="108" y="1662" font-size="40" class="story-caption">picture and sound alone do not prove</text>
<text x="108" y="1714" font-size="40" class="story-caption">a complete handoff. Numbers denote</text>
<text x="108" y="1766" font-size="40" class="story-caption">ST 2110 parts.</text>
<a href="https://www.smpte.org/standards/st2110"><text x="108" y="1808" font-size="28" class="story-source">SMPTE ST 2110 standards suite</text></a>
</svg>
