<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" role="img" aria-labelledby="title desc">
<title id="title">SDI equalizer reach</title><desc id="desc">The same 1694A cable has less equalized reach as SDI data rate rises. Values shown are AJA FiDO 3G ratings, not universal limits; line lengths are not to scale.</desc>
<style>:root {
  --ground:#111111; --surface:#191919; --surface-raised:#242424; --raised:#303030;
  --line:#3c3c3c; --ink:#eeeeee; --muted:#b6b6b6; --faint:#a0a0a0;
  --blue:#a8bed9; --cyan:#becbd9; --amber:#d0c0a0; --red:#e6a8a8;
  --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
} text {font-family:system-ui,sans-serif;fill:var(--ink)} .eyebrow{fill:var(--cyan);letter-spacing:3px}.story-title{font-weight:750}.story-caption{fill:var(--ink)}.story-source{fill:var(--muted)}    .illustration text { fill: var(--ink); font: 16px var(--sans); }
    .illustration .node { fill: var(--surface); stroke: var(--cyan); stroke-width: 2; }
    .illustration .wire { fill: none; stroke: var(--blue); stroke-width: 3; }
    .illustration .alternate { stroke: var(--amber); }
    .illustration .note { fill: var(--amber); }
    .illustration .canvas { fill: var(--surface); }
    .illustration .panel { fill: var(--surface-raised); stroke: var(--line); stroke-width: 1; }
    .illustration .diagram-index { fill: var(--cyan); font-family: var(--mono); font-weight: 700; }
    .illustration .diagram-heading { font-weight: 700; }
    .illustration .rule { fill: none; stroke: var(--line); stroke-width: 1; }
    .illustration .blue-label { fill: var(--blue); }
    .illustration .good-label { fill: var(--cyan); }
    .illustration .fault { fill: var(--red); font-weight: 700; }
    .illustration .result { fill: var(--ground); stroke: var(--cyan); stroke-width: 1; }
    .illustration .limit { fill: var(--ground); stroke: var(--amber); stroke-width: 1; }
    .illustration .packet, .illustration .picture { fill: var(--ground); stroke: var(--line); stroke-width: 1; }
    .illustration .blue-packet { fill: var(--ground); stroke: var(--blue); stroke-width: 1; }
    .illustration .amber-packet { fill: var(--ground); stroke: var(--amber); stroke-width: 1; }
    .illustration .missing { fill: var(--ground); stroke: var(--red); stroke-width: 1; stroke-dasharray: 3 3; }
    .illustration .packet-label { font-family: var(--mono); }
    .illustration .reference { fill: none; stroke: var(--amber); stroke-width: 2; stroke-dasharray: 4 4; }</style>
<rect width="1080" height="1920" fill="var(--surface)"/>
<text x="108" y="148" font-size="28" class="eyebrow">VIDEO ENGINEERING DAILY · 010</text>
<text x="108" y="228" font-size="54" class="story-title">SDI equalizer reach</text>
<g class="illustration" transform="translate(216 342) scale(2.7)"><rect x="0" y="0" width="240" height="400" rx="8" class="canvas"/><text x="12" y="26" class="diagram-index" text-anchor="start">10</text><text x="48" y="26" class="diagram-heading" text-anchor="start">RATE VS REACH</text><path d="M12 40H228" class="rule"/><text x="120" y="67" class="note" text-anchor="middle">1694A / FiDO 3G example</text><rect x="12" y="84" width="216" height="218" rx="8" class="panel"/><text x="28" y="113" class="diagram-heading" text-anchor="start">270 Mb/s</text><path d="M28 128H144m-8-5l8 5l-8 5" class="wire"/><text x="202" y="155" class="blue-label" text-anchor="end">400 m</text><text x="28" y="180" class="diagram-heading" text-anchor="start">1.5 Gb/s</text><path d="M28 195H132m-8-5l8 5l-8 5" class="wire"/><text x="202" y="200" class="blue-label" text-anchor="end">200 m</text><text x="28" y="247" class="diagram-heading" text-anchor="start">3 Gb/s</text><path d="M28 262H95m-8-5l8 5l-8 5" class="wire alternate"/><text x="202" y="267" class="note" text-anchor="end">140 m</text><text x="120" y="289" class="note" text-anchor="middle">lines not to scale</text><rect x="12" y="319" width="216" height="61" rx="8" class="result"/><text x="120" y="346" class="good-label" text-anchor="middle">Test the whole route</text><text x="120" y="369" class="" text-anchor="middle">at the intended rate</text></g>
<path d="M108 1460H972" stroke="var(--line)"/>
<text x="108" y="1506" font-size="40" class="story-caption">The same 1694A cable has less</text>
<text x="108" y="1558" font-size="40" class="story-caption">equalized reach as SDI data rate</text>
<text x="108" y="1610" font-size="40" class="story-caption">rises. Values shown are AJA FiDO 3G</text>
<text x="108" y="1662" font-size="40" class="story-caption">ratings, not universal limits; line</text>
<text x="108" y="1714" font-size="40" class="story-caption">lengths are not to scale.</text>
