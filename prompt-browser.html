round.", "created": "2025-11-18", "tstat": "desc-only", "ai_rename": "🤖 | TEC | PROMPTS", "naming_sugg": "🤖🛠️ | TEC | Draft UI Component Specifications | v1", "id": 238}, {"src": "Notion DB", "orig": "🤖🗂️ | ORG | Outline Information Architecture", "name": "🤖🗂️ | ORG | Outline Information Architecture", "changed": false, "untitled": false, "area": "ORG", "pack": "📦 ORG | Organization \u0026 Productivity", "fmt": "Input Template", "status": "", "cx": "***", "plat": [], "tags": ["User Interface Design", "Content Structuring", "Content Creation"], "flag": "", "fav": false, "desc": "🛰 Control Center", "text": "🛰 Control Center", "field": "📝 Description", "img": "A sleek, futuristic control‑center interface displaying organized information‑architecture diagrams, with glowing neon accents, robotic elements, and clean, high‑tech UI visuals.", "created": "2025-11-18", "tstat": "desc-only", "ai_rename": "🤖 | ORG | PROMPTS", "naming_sugg": "🤖🗂️ | ORG | Outline Information Architecture", "id": 239}, {"src": "Notion DB", "orig": "NotionAI Prompt Playbook", "name": "NotionAI Prompt Playbook", "changed": false, "untitled": false, "area": "ADMIN", "pack": "📦 ADMIN | Workspace Administration", "fmt": "Output Template", "status": "", "cx": "***", "plat": ["Notion AI", "ChatGPT", "Claude", "Gemini", "Generic"], "tags": ["Workflow Optimization", "Content Structuring", "Project Management", "Formatting"], "flag": "", "fav": false, "desc": "Copy/paste playbook of prompts for auditing, organizing, formatting, and generating Notion content and systems.", "text": "---\n\n## Prompt Text Extraction\n\n1. Workspace Audit \u0026 MigrationSearch the entire workspace for all pages related to [topic]. For each page found, decide whether it should be moved or linked to a central hub page based on relevance, duplication, and long-term value. Create a summary table of recommended changes with page name, current location, recommended action, and reasoning.\n\n2. Content ConsolidationScan this page and all linked subpages. Identify duplicate ideas, redundant sections, outdated info, and missing pieces. Consolidate everything into a single clean page with sections, headers, and a clear flow. Add a callout summary at the top explaining what was merged and why.\n\n3. Tag Cleanup \u0026 ReclassificationAnalyze this content and suggest 3 to 7 accurate tags based on themes, topics, and recurring patterns. If content fits multiple categories in the workspace, propose primary and secondary classification.\n\n4. Relational Database OrganizerIdentify all databases in the workspace that contain items related to this topic. Map out how they connect. Recommend new relations, rollups, and synced properties that reduce redundancy and improve navigation. Present results in a table with columns for database, link type, and recommended structure.\n\n5. Full Page RestyleImprove style and readability throughout this entire page. Use color-coded callouts, consistent headers, clean spacing, tables where needed, and scannable bullet lists. Keep visuals attractive without clutter. Preserve meaning while improving clarity.\n\n6. Two Column ConversionRefactor this content into two column formatting. Place high-level summaries, navigation, or key ideas in the left column. Place details, long text, and expandable sections in the right column. Use callouts to highlight important information.\n\n7. Visual Hierarchy OverhaulRebuild the visual hierarchy of this content. Ensure H2 breaks major topics, H3 breaks subtopics, and bullets remain short and scannable. Highlight critical insights in callouts. Remove all clutter or unnecessary phrasing.\n\n8. \"Make it Pretty\" EnhancementUpgrade this page's aesthetic. Add tasteful color, callouts for key sections, dividers between major areas, and consistent formatting for lists, tables, and headings. Do not change the meaning of the text. Only improve clarity and appearance.\n\n9. Table BuilderConvert the following section into a clean table with header row, 3 to 6 columns, concise labels, and consistent alignment. Use bold formatting for the most critical data. Add one sentence above the table explaining what it shows.\n\n10. Project Dashboard BuilderCreate a full project dashboard with the following sections: Page Title, Overview, Goals, Milestones Table, Resources Columns, Roles \u0026 Responsibilities, Risks \u0026 Issues with color-coded callouts, and a Next Steps checklist. Keep the formatting clean and scannable.\n\n11. Knowledge Base ArticleGenerate a structured knowledge base page with H1 title, summary, H2 sections for definitions, workflows, examples, troubleshooting, and related links. Add a resources table at the bottom. Use simple Markdown only.\n\n12. SOP / Procedure TemplateBuild a Standard Operating Procedure page with the following structure: Title, Purpose, Scope, Tools Needed, Step by Step Procedure (numbered list), Safety Notes, Troubleshooting, and a Log section for revisions. Use clear headers and add callouts where appropriate.\n\n13. Full Glossary GeneratorBuild a glossary organized alphabetically with H2 letters, bolded terms, and short definitions. Add a table of contents at the top and use dividers between letter sections.\n\n14. Multi View Learning PageCreate a learning page with three parallel structures: a conceptual explanation, step by step instructions, and real-world examples. Organize each section with headers and bullets. Add a short summary at the top explaining how to use the page.\n\n15. Rewrite Into Clear BulletsConvert this text into clear, concise bullets with bold key terms. Keep each bullet under two sentences. Remove filler language and tighten the flow.\n\n16. Executive SummaryWrite a sharp, professional executive summary of this content. Use 3 to 6 bullets, highlight the main insights, and make it scannable for quick decision making.\n\n17. Tone Clean Up (Professional)Rewrite this section with a professional, direct tone. Improve clarity, remove fluff, and tighten the language. Preserve the original intent.\n\n18. Prep for PresentationTurn this content into a presentation-friendly outline. Use headers for sections, bullets for details, and callouts for important points. Remove unnecessary sentences.\n\n19. Expand With ExamplesRewrite the content and insert helpful examples to clarify complex ideas. Use callouts for each example. Keep the tone clear and approachable.\n\n20. Summary AutofillWrite a one to two sentence summary of this entry that captures the core idea and intended outcome.\n\n21. Status AutofillBased on the content, assign a status from: Idea, Drafting, In Review, Finalized, Published.\n\n22. Tag AutofillSuggest 3 to 6 tags for this content based on themes and repeated ideas.\n\n23. Priority AutofillAssign a priority of High, Medium, or Low based on urgency, impact, and dependencies implied in the content.\n\n24. Effort EstimateProvide a rough effort estimate labeled as Low, Medium, or High based on complexity and length.\n\n25. System MapAnalyze all linked and referenced pages. Build a system map that shows the relationships, dependencies, and data flows. Suggest improvements to reduce clutter and improve navigation.\n\n26. Database Architecture ReviewReview the structure of this database. Suggest improvements to property names, relations, rollups, grouping, and views. Provide justification for each change.\n\n27. \"Manual to Modular\" ConversionBreak this page into modular components that can be reused across the workspace. Create a table listing each module, its purpose, and where it should be stored.\n\n28. Naming \u0026 Consistency CheckCheck this page for naming inconsistencies, header mismatches, repeated labels, and unclear terminology. Recommend consistent naming patterns and correct them across the page.\n\n29. How To GuideWrite a complete how-to guide on this topic with H2 sections for Overview, Tools Needed, Step by Step Instructions, Tips, and Common Mistakes. Keep the language friendly and clear.\n\n30. Multi Section ExplainerTurn this rough content into a structured explainer with sections for high-level concept, core idea, supporting details, and real-world application. Use bullets and callouts to keep it scannable.\n\n31. Documentation UpgradeConvert this into clear documentation. Use headers, bullets, and short paragraphs. Add an example section and a small glossary at the end.\n\n32. Research SummarySummarize this research into three sections: Key Points, Insights, and Actionable Takeaways. Keep it concise and easy to scan.\n\n---", "field": "Exact Prompt Copy", "img": "A sleek, modern illustration of a digital workspace dashboard with sections labeled “Search \u0026 Organization,” “Formatting \u0026 Aesthetics,” “Page Generation,” and “Database Autofill,” each represented by colorful icons (magnifying glass, paintbrush, puzzle piece, DNA helix) arranged around a central Notion logo, set against a clean, light‑gray background with subtle grid lines.", "created": "2025-11-16", "tstat": "valid", "ai_rename": "🤖 | REF | PROMPTS", "naming_sugg": "", "id": 240}, {"src": "Notion DB", "orig": "🤖 | REF | Knowledge Wiki Formatter", "name": "🤖 | REF | Knowledge Wiki Formatter", "changed": false, "untitled": false, "area": "ADMIN", "pack": "📦 ADMIN | Workspace Administration", "fmt": "Input Template", "status": "", "cx": "***", "plat": [], "tags": ["Content Structuring", "Information Extraction"], "flag": "", "fav": false, "desc": "🛰 Control Center", "text": "🛰 Control Center", "field": "📝 Description", "img": "🎨 Image Prompt: A futuristic control center where a sleek robot assistant organizes and formats knowledge wiki pages, surrounded by holographic screens displaying code snippets, data charts, and stylized markdown, bathed in cool blue‑purple lighting.", "created": "2025-09-18", "tstat": "desc-only", "ai_rename": "🤖 | REF | PROMPTS", "naming_sugg": "", "id": 241}, {"src": "Notion DB", "orig": "🤖 | FMT | Knowledge Wiki Formatter", "name": "🤖 | FMT | Knowledge Wi ate:** [Insert date] - **Topics:** [Topics to cover in next meeting]  \n\n## Tips for Effective Meeting Notes\n\n- Be concise: Capture key points without unnecessary detail.\n- Use clear attribution: Note who said or suggested what when it matters.\n- Focus on outcomes: Emphasize decisions and action items over discussion details.\n- Include deadlines: Always specify timeframes for action items.\n- Distribute promptly: Share notes within 24 hours while details are fresh.\n\nCustomize this template based on your meeting type, organizational culture, and documentation requirements.", "field": "Exact Prompt Copy", "img": "Create a visually appealing infographic that summarizes the meeting notes template, highlighting the sections for Agenda, Discussion Points, Decisions Made, and Action Items. Use icons to represent each section, and ensure the design is clean and easy to read.", "created": "2025-08-20", "tstat": "valid", "ai_rename": "🤖 | FMT | Admin Meeting Notes Template", "naming_sugg": "", "id": 373}, {"src": "Notion DB", "orig": "🤖 | FMT | Admin Notes Format", "name": "🤖 | FMT | Admin Notes Format", "changed": false, "untitled": false, "area": "ADMIN", "pack": "📦 ADMIN | Workspace Administration", "fmt": "Output Template", "status": "", "cx": "***", "plat": [], "tags": ["Content Structuring", "Formatting", "Content Optimization"], "flag": "Duplicate Candidate", "fav": false, "desc": "🛰 Control Center", "text": "🤖 | FMT | Admin Notes Format", "field": "Exact Prompt Copy", "img": "Create an image of a futuristic control center that illustrates the concept of \"Admin Notes Format\" in a digital environment. The design should include elements like holographic displays, sleek user interfaces, and a visually appealing layout that emphasizes organization and efficiency. Use a color scheme that conveys professionalism and advanced technology, such as blues and silvers. Incorporate symbols or icons that represent data management and communication to enhance the theme of a uts.\n- Include reflection prompts in toggle blocks.\n- Create a rewards system checklist.\n- End with a strategies for consistency section.", "img": "", "created": "", "id": 405, "orig": "Habit Tracker", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Seed", "name": "Workshop Facilitator Guide", "area": "business", "pack": "📝 Notion Page Formatter", "fmt": "Single Prompt", "status": "", "cx": "", "plat": [], "tags": ["notion", "workshop", "facilitation", "agenda"], "flag": "", "fav": false, "desc": "", "text": "Reformat this into a workshop facilitator guide.\n- Start with a workshop overview (objectives, audience, duration).\n- Create a minute-by-minute agenda as H2 sections.\n- Include activity instructions in toggle blocks.\n- Add discussion questions in callout blocks.\n- Create a materials checklist.\n- End with follow-up actions and evaluation methods.", "img": "", "created": "", "id": 406, "orig": "Workshop Facilitator Guide", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Seed", "name": "Duplicate Page Finder", "area": "audit", "pack": "🧹 Workspace Cleanup Suite", "fmt": "Single Prompt", "status": "", "cx": "", "plat": [], "tags": ["cleanup", "duplicates", "workspace", "notion"], "flag": "", "fav": false, "desc": "", "text": "Search this workspace for pages that appear to cover the same topic, person, or project more than once. Look for:\n- Pages with nearly identical titles\n- Pages with the same TypeCode prefix pointing to the same subject\n- Database entries that describe the same entity under slightly different names\n\nFor each duplicate cluster you find:\n1. List all the pages in the cluster with their URLs and parent locations\n2. Identify which one appears most recently edited or most complete\n3. Recommend: Keep / Archive / Merge — with one sentence of reasoning\n\nDo not delete anything. Output a table with columns: Cluster | Page Name | URL | Parent | Recommended Action | Reasoning", "img": "", "created": "", "id": 407, "orig": "Duplicate Page Finder", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Seed", "name": "Naming Standard Violations Audit", "area": "audit", "pack": "🧹 Workspace Cleanup Suite", "fmt": "Single Prompt", "status": "", "cx": "", "plat": [], "tags": ["cleanup", "naming", "standards", "conventions"], "flag": "", "fav": false, "desc": "", "text": "Audit the pages in this section of the workspace against the following naming rules:\n- Page titles should begin with a TypeCode prefix (e.g. GOV, HUB, DOC, SOP, REF, PRJ, SFT, EVT, NOTE, LOG, DB, OPS, TEMP)\n- After the TypeCode, titles should follow the pattern: [TypeCode] | [Descriptive Name] - [Date if applicable]\n- Hub pages should be prefixed HUB |\n- Database pages should be prefixed DB |\n\nFor each page that violates these rules:\n1. List the current title and URL\n2. Suggest a corrected title following the naming standard\n3. Flag if the page appears to be a draft, duplicate, or orphan\n\nOutput a table: Current Title | URL | Suggested Title | Flag (Draft / Duplicate / Orphan / OK)", "img": "", "created": "", "id": 408, "orig": "Naming Standard Violations Audit", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Seed", "name": "Orphan Page Detector", "area": "audit", "pack": "🧹 Workspace Cleanup Suite", "fmt": "Single Prompt", "status": "", "cx": "", "plat": [], "tags": ["cleanup", "orphans", "unlinked", "stale"], "flag": "", "fav": false, "desc": "", "text": "Search for pages in this section that:\n- Are not linked or mentioned from any other page\n- Have no parent database entry pointing to them\n- Have not been edited in more than 60 days\n- Have no content other than a title\n\nFor each orphan page found:\n1. List the title, URL, and last edited date\n2. Estimate its likely original purpose based on the title\n3. Recommend: Keep and link | Archive | Delete (if clearly empty)\n\nDo not delete anything. Output a table: Title | URL | Last Edited | Likely Purpose | Recommended Action", "img": "", "created": "", "id": 409, "orig": "Orphan Page Detector", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Seed", "name": "TEMP and Draft Page Sweep", "area": "audit", "pack": "🧹 Workspace Cleanup Suite", "fmt": "Single Prompt", "status": "", "cx": "", "plat": [], "tags": ["cleanup", "drafts", "staging", "temp"], "flag": "", "fav": false, "desc": "", "text": "Search this workspace for pages that appear to be temporary, draft, or staging in nature. Look for:\n- Pages prefixed TEMP |\n- Pages in folders or sections labeled Archive, Needs Review, Staging, or Inbox\n- Pages whose titles contain words like \"draft,\" \"copy,\" \"old,\" \"backup,\" \"test,\" or \"untitled\"\n- Pages created more than 90 days ago that have never been linked from another page\n\nFor each page found:\n1. List the title, URL, parent location, and created date\n2. Identify if it has any content worth keeping\n3. Recommend: Promote (move to canonical location) | Archive | Delete\n\nOutput a table: Title | URL | Parent | Created | Has Content | Recommended Action", "img": "", "created": "", "id": 410, "orig": "TEMP and Draft Page Sweep", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Seed", "name": "Hub Page Navigation Audit", "area": "audit", "pack": "🧹 Workspace Cleanup Suite", "fmt": "Single Prompt", "status": "", "cx": "", "plat": [], "tags": ["cleanup", "hub", "navigation", "links"], "flag": "", "fav": false, "desc": "", "text": "Audit this hub page for navigation quality. Check for:\n- Links that point to pages that no longer exist or have been moved\n- Linked views that are pointing to the wrong database or show no results\n- Sections that reference pages not actually related to this hub's topic\n- Missing links to pages that clearly belong here but are not currently linked\n\nFor each issue found:\n1. Describe the problem\n2. Identify the specific element (link, section, view, callout)\n3. Recommend the fix\n\nDo not edit the page. Output a numbered list of issues with recommendations.", "img": "", "created": "", "id": 411, "orig": "Hub Page Navigation Audit", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Seed", "name": "Database Schema Cleanup", "area": "audit", "pack": "🧹 Workspace Cleanup Suite", "fmt": "Single Prompt", "status": "", "cx": "", "plat": [], "tags": ["cleanup", "database", "schema", "properties"], "flag": "", "fav": false, "desc": "", "text": "Audit this database schema for cleanup opportunities. Look for:\n- Properties with names like \"Text,\" \"Text (1),\" \"Text 1,\" or other clearly placeholder names\n- Properties that appear to duplicate another property's purpose\n- Properties with no values across any entries\n- Select or multi-select properties whose option lists have grown inconsistent\n\nFor each issue found:\n1. Name the property and describe the problem\n2. Recommend: Rename | Delete | Merge with [other property] | Leave as-is\n3. If renaming, suggest the correct name\n\nOutput a table: Property Name | Issue | Recommended Action | Notes", "img": "", "created": "", "id": 412, "orig": "Database Schema Cleanup", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Seed", "name": "Projects Stale Entry Sweep", "area": "audit", "pack": "🧹 Workspace Cleanup Suite", "fmt": "Single Prompt", "status": "", "cx": "", "plat": [], "tags": ["cleanup", "projects", "stale", "status"], "flag": "", "fav": false, "desc": "", "text": "Review the entries in DB | Projects and flag any that need attention. Look for:\n- Entries with Status = Doing or Ongoing but no Next Action filled in\n- Entries with Status = Doing but Last Update older than 30 days\n- Entries with no Category assigned\n- Entries with no Priority assigned\n\nFor each flagged entry:\n1. List the project name and URL\n2. Describe the specific issue\n3. Suggest the corrective action\n\nOutput a table: Project Name | URL | Issue | Suggested Action", "img": "", "created": "", "id": 413, "orig": "Projects Stale Entry Sweep", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Seed", "name": "Inbox Zero Sweep", "area": "audit", "pack": "🧹 Workspace Cleanup Suite", "fmt": "Single Prompt", "status": "", "cx": "", "plat": [], "tags": ["cleanup", "inbox", "triage", "processing"], "flag": "", "fav": false, "desc": "", "text": "Review all items currently in this inbox or staging area. For each item:\n1. Read the title and any available content\n2. Determine the most likely destination based on the workspace structure\n3. For each item, output: Title | Current Location | Recommended Destination | Action (Move / Archive / Convert to task)\n\nDo not move anything. Output the full triage table first for review.", "img": "", "created": "", "id": 414, "orig": "Inbox Zero Sweep", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Seed", "name": "Cross-System Link Consistency Check", "area": "audit", "pack": "🧹 Workspace Cleanup Suite", "fmt": "Single Prompt", "status": "", "cx": "", "plat": [], "tags": ["cleanup", "cross-links", "consistency", "navigation"], "flag": "", "fav": false, "desc": "", "text": "Check cross-linking consistency across the main hub pages in this workspace. For each hub:\n1. List which of the other hubs it currently links to\n2. Identify any cross-links that are missing and should exist\n3. Flag any links that point to outdated or moved pages\n\nOutput a matrix table: Hub | Currently Links To | Missing Links | Broken Links", "img": "", "created": "", "id": 415, "orig": "Cross-System Link Consistency Check", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Seed", "name": "Post-Session Cleanup", "area": "audit", "pack": "🧹 Workspace Cleanup Suite", "fmt": "Single Prompt", "status": "", "cx": "", "plat": [], "tags": ["cleanup", "post-session", "sweep", "loose-ends"], "flag": "", "fav": false, "desc": "", "text": "This workspace just went through a significant build or working session. Help me do a post-session cleanup sweep. Search for:\n- Pages created in the last 7 days that have no parent hub link and are not in a database\n- Pages created in the last 7 days with placeholder titles (Untitled, Copy of, Test, Draft)\n- Any open to-do checkboxes that are more than 3 days old\n\nFor each item found:\n1. List the title, URL, and created date\n2. Recommend the next action: File | Link to hub | Fill in Next Action | Process from inbox | Close out\n\nOutput a grouped list by category.", "img": "", "created": "", "id": 416, "orig": "Post-Session Cleanup", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Seed", "name": "Task Steps", "area": "process", "pack": "📋 Document \u0026 Process Formatter", "fmt": "Single Prompt", "status": "", "cx": "", "plat": [], "tags": ["checklist", "tasks", "actionable", "steps"], "flag": "", "fav": false, "desc": "", "text": "Transform the data I provide into a step-by-step checklist. Each item should be a concise, action-oriented task. Preserve the original order where it makes sense, and group related tasks under short headings.", "img": "", "created": "", "id": 417, "orig": "Task Steps", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Seed 27, "orig": "Proj Brief", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Seed", "name": "Track Info", "area": "tracking", "pack": "📡 Information Tracking \u0026 Ops", "fmt": "Single Prompt", "status": "", "cx": "", "plat": [], "tags": ["tracking", "extraction", "status", "fields"], "flag": "", "fav": false, "desc": "", "text": "Extract all key information from the data I provide and organize it into a tracking format with clear fields such as item name, status, date, owner, and notes. Flag any incomplete or missing information.", "img": "", "created": "", "id": 428, "orig": "Track Info", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Seed", "name": "Log Parse", "area": "tracking", "pack": "📡 Information Tracking \u0026 Ops", "fmt": "Single Prompt", "status": "", "cx": "", "plat": [], "tags": ["logs", "chronological", "events", "metadata"], "flag": "", "fav": false, "desc": "", "text": "Take the log or record I provide and convert it into a structured tracking table with columns for timestamp, event type, description, and any relevant metadata. Sort entries chronologically.", "img": "", "created": "", "id": 429, "orig": "Log Parse", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Seed", "name": "Status Board", "area": "tracking", "pack": "📡 Information Tracking \u0026 Ops", "fmt": "Single Prompt", "status": "", "cx": "", "plat": [], "tags": ["dashboard", "status", "progress", "overview"], "flag": "", "fav": false, "desc": "", "text": "From the information I provide, create a status dashboard layout showing current state, progress indicators, last updated date, and next actions for each tracked item.", "img": "", "created": "", "id": 430, "orig": "Status Board", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Seed", "name": "Change Log", "area": "tracking", "pack": "📡 Information Tracking \u0026 Ops", "fmt": "Single Prompt", "status": "", "cx": "", "plat": [], "tags": ["changelog", "versioning", "history", "audit"], "flag": "", "fav": false, "desc": "", "text": "Convert the data I provide into a change log format with entries for date, version/iteration, what changed, who made the change, and reason for change where applicable.", "img": "", "created": "", "id": 431, "orig": "Change Log", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Seed", "name": "Issue Track", "area": "tracking", "pack": "📡 Information Tracking \u0026 Ops", "fmt": "Single Prompt", "status": "", "cx": "", "plat": [], "tags": ["issues", "bugs", "priority", "resolution"], "flag": "", "fav": false, "desc": "", "text": "Structure the information I provide as an issue tracker with fields for issue ID, title, priority, status, assigned to, date reported, and resolution notes.", "img": "", "created": "", "id": 432, "orig": "Issue Track", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Seed", "name": "Prompt Intent Extractor", "area": "meta", "pack": "🧪 Prompt Engineering Meta-Toolkit", "fmt": "Single Prompt", "status": "", "cx": "", "plat": [], "tags": ["prompt-engineering", "intent", "analysis", "diagnostics"], "flag": "", "fav": false, "desc": "", "text": "Analyze the following prompt and identify its true intent.\n\nPrompt:\n[PASTE PROMPT]\n\nReturn:\n- Primary task\n- Secondary implied tasks\n- Requested artifact\n- Likely output medium\n- Tone signals\n- Formatting signals\n- Ambiguities\n- Missing constraints\n- What the model is most likely to infer on its own", "img": "", "created": "", "id": 433, "orig": "Prompt Intent Extractor", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Seed", "name": "Seed Prompt Diagnostic", "area": "meta", "pack": "🧪 Prompt Engineering Meta-Toolkit", "fmt": "Single Prompt", "status": "", "cx": "", "plat": [], "tags": ["prompt-engineering", "scoring", "rubric", "evaluation"], "flag": "", "fav": false, "desc": "", "text": "You are a prompt diagnostics analyst.\n\nEvaluate this prompt as a seed prompt:\n[PASTE PROMPT]\n\nScore each from 1 to 5 and explain briefly:\n- Execution Strength\n- Artifact Specificity\n- Medium Clarity\n- Structure Control\n- Audience Control\n- Tone Control\n- Constraint Coverage\n- Ambiguity Load\n- Enhancement Yield\n- Assumption Risk\n\nThen provide:\n- Overall diagnosis in one sentence\n- Main strengths\n- Main weaknesses\n- What a prompt enhancement layer should add carefully", "img": "", "created": "", "id": 434, "orig": "Seed Prompt Diagnostic", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Seed", "name": "Prompt Decomposition", "area": "meta", "pack": "🧪 Prompt Engineering Meta-Toolkit", "fmt": "Single Prompt", "status": "", "cx": "", "plat": [], "tags": ["prompt-engineering", "breakdown", "structure", "analysis"], "flag": "", "fav": false, "desc": "", "text": "Break down the following prompt into its functional parts.\n\nPrompt:\n[PASTE PROMPT]\n\nIdentify:\n- Role or persona instructions\n- Core task directive\n- Output format instructions\n- Constraints\n- Tone or style guidance\n- Audience signals\n- Hidden assumptions\n- Risky ambiguities\n\nThen rewrite the breakdown as a compact table.", "img": "", "created": "", "id": 435, "orig": "Prompt Decomposition", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Seed", "name": "Enhancement Risk Review", "area": "meta", "pack": "🧪 Prompt Engineering Meta-Toolkit", "fmt": "Single Prompt", "status": "", "cx": "", "plat": [], "tags": ["prompt-engineering", "risk", "enhancement", "safety"], "flag": "", "fav": false, "desc": "", "text": "Review this prompt and determine how risky it would be for an enhancement system to expand it.\n\nPrompt:\n[PASTE PROMPT]\n\nAssess:\n- Which details are explicit\n- Which details would need to be inferred\n- Which inferences are safe\n- Which inferences could distort intent\n- Whether the prompt should be expanded minimally, moderately, or aggressively\n\nThen give:\n- Risk level: low, medium, or high\n- Recommended enhancement strategy", "img": "", "created": "", "id": 436, "orig": "Enhancement Risk Review", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Seed", "name": "Original vs Enhanced Comparison", "area": "meta", "pack": "🧪 Prompt Engineering Meta-Toolkit", "fmt": "Single Prompt", "status": "", "cx": "", "plat": [], "tags": ["prompt-engineering", "comparison", "a-b-test", "evaluation"], "flag": "", "fav": false, "desc": "", "text": "Compare these two prompts.\n\nOriginal prompt:\n[PASTE ORIGINAL]\n\nEnhanced prompt:\n[PASTE ENHANCED]\n\nEvaluate:\n- What the enhanced version clarified\n- What it preserved from the original\n- What assumptions it introduced\n- Whether it oversteered\n- Whether the enhancement improved execution reliability\n\nReturn:\n- A side by side score table\n- A short verdict\n- A safer improved version if needed", "img": "", "created": "", "id": 437, "orig": "Original vs Enhanced Comparison", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Seed", "name": "Medium Detection", "area": "meta", "pack": "🧪 Prompt Engineering Meta-Toolkit", "fmt": "Single Prompt", "status": "", "cx": "", "plat": [], "tags": ["prompt-engineering", "medium", "output-format", "classification"], "flag": "", "fav": false, "desc": "", "text": "Determine what output medium this prompt most likely intends.\n\nPrompt:\n[PASTE PROMPT]\n\nChoose the best fit and explain why:\n- Notion page\n- Markdown article\n- HTML page\n- Email\n- Report\n- Slide deck\n- Internal note\n- Social post\n- Other\n\nThen state what wording in the prompt created the signal, and what wording is missing.", "img": "", "created": "", "id": 438, "orig": "Medium Detection", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Seed", "name": "Ambiguity Extraction", "area": "meta", "pack": "🧪 Prompt Engineering Meta-Toolkit", "fmt": "Single Prompt", "status": "", "cx": "", "plat": [], "tags": ["prompt-engineering", "ambiguity", "clarity", "rewrite"], "flag": "", "fav": false, "desc": "", "text": "Interrogate this prompt for ambiguity.\n\nPrompt:\n[PASTE PROMPT]\n\nList every phrase that is vague, subjective, or under-specified.\nFor each one, explain:\n- Why it is ambiguous\n- What a model might assume it means\n- What risk that creates\n- How to rewrite it more operationally", "img": "", "created": "", "id": 439, "orig": "Ambiguity Extraction", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Seed", "name": "Constraint Recovery", "area": "meta", "pack": "🧪 Prompt Engineering Meta-Toolkit", "fmt": "Single Prompt", "status": "", "cx": "", "plat": [], "tags": ["prompt-engineering", "constraints", "defaults", "enhancement"], "flag": "", "fav": false, "desc": "", "text": "This prompt is under-specified. Recover the missing constraints without changing the likely intent.\n\nPrompt:\n[PASTE PROMPT]\n\nInfer the most important missing dimensions:\n- audience\n- tone\n- length\n- medium\n- structure\n- formatting\n- exclusions\n- output rules\n\nFor each:\n- state whether it is explicit, implied, or missing\n- suggest a cautious default\n\nThen produce a minimally enhanced rewrite.", "img": "", "created": "", "id": 440, "orig": "Constraint Recovery", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Seed", "name": "Prompt Hardening", "area": "meta", "pack": "🧪 Prompt Engineering Meta-Toolkit", "fmt": "Single Prompt", "status": "", "cx": "", "plat": [], "tags": ["prompt-engineering", "hardening", "reliability", "deterministic"], "flag": "", "fav": false, "desc": "", "text": "Take this prompt and harden it for more reliable execution while preserving its original meaning.\n\nPrompt:\n[PASTE PROMPT]\n\nRules:\n- preserve the user's intent\n- do not over-template\n- add only the minimum needed clarity\n- make execution more deterministic\n\nReturn:\n- revised prompt\n- list of changes made\n- explanation of why each change improves reliability", "img": "", "created": "", "id": 441, "orig": "Prompt Hardening", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Seed", "name": "PromptLab Evaluator", "area": "meta", "pack": "🧪 Prompt Engineering Meta-Toolkit", "fmt": "Single Prompt", "status": "", "cx": "", "plat": [], "tags": ["prompt-engineering", "evaluation", "pipeline", "quality"], "flag": "", "fav": false, "desc": "", "text": "You are evaluating a prompt enhancement pipeline.\n\nSeed prompt:\n[PASTE SEED]\n\nEnhanced prompt:\n[PASTE ENHANCED]\n\nScore 1 to 5:\n- Intent Preservation\n- Clarity Gain\n- Execution Reliability\n- Assumption Load\n- Medium Accuracy\n- Structural Helpfulness\n- Oversteer Risk\n\nThen answer:\n- What did the enhancer do well?\n- Where did it add too much?\n- What would a better enhancement look like?\n- Final verdict: good enhancement, acceptable but risky, or oversteered", "img": "", "created": "", "id": 442, "orig": "PromptLab Evaluator", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Seed", "name": "Fast One-Shot Prompt Audit", "area": "meta", "pack": "🧪 Prompt Engineering Meta-Toolkit", "fmt": "Single Prompt", "status": "", "cx": "", "plat": [], "tags": ["prompt-engineering", "audit", "quick", "diagnosis"], "flag": "", "fav": false, "desc": "", "text": "Audit this prompt quickly.\n\nPrompt:\n[PASTE PROMPT]\n\nReturn only:\n- Prompt type\n- Primary intent\n- Biggest ambiguity\n- Biggest strength\n- Biggest risk\n- Best minimal rewrite", "img": "", "created": "", "id": 443, "orig": "Fast One-Shot Prompt Audit", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Seed", "name": "Codex / Claude Code Feedback", "area": "meta", "pack": "🧪 Prompt Engineering Meta-Toolkit", "fmt": "Single Prompt", "status": "", "cx": "", "plat": [], "tags": ["prompt-engineering", "code", "feedback", "technical"], "flag": "", "fav": false, "desc": "", "text": "You are reviewing prompt quality for a development workflow.\n\nPrompt under review:\n[PASTE PROMPT]\n\nTask:\nProvide feedback suitable for Claude Code or Codex.\n\nInclude:\n- one sentence diagnosis\n- rubric scores from 1 to 5\n- top three issues\n- top three strengths\n- recommended rewrite\n- implementation advice for a prompt enhancement system\n\nKeep the output compact, technical, and actionable.", "img": "", "created": "", "id": 444, "orig": "Codex / Claude Code Feedback", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Seed", "name": "Full Vehicle Systems Research Report", "area": "research", "pack": "🚗 Automotive Systems Research", "fmt": "Single Prompt", "status": "", "cx": "", "plat": [], "tags": ["automotive", "engineering", "technical", "research"], "flag": "", "fav": false, "desc": "", "text": "Produce a detailed, structured technical report explaining how the engine and all critical systems operate in a [Year] [Make] [Model] [Trim]. Treat this as a research assignment written for a technician who wants a clear, accurate, and mechanically grounded understanding of how their vehicle functions.\n\nYour report must include these sections:\n\n1. Engine Architecture Overview\n2. Fuel System\n3. Ignition System\n4. Air Management \u0026 Emissions\n5. Cooling System\n6. Lubrication System\n7. Transmission Integration\n8. Electrical \u0026 Network Systems\n9. Sensor Suite \u0026 ECU Logic\n10. Critical Failure Modes\n11. Maintenance Logic\n\nFormat: Clear headings, technical depth with accessible language, real-world failure examples. Keep all explanations specific to the vehicle.", "img": "", "created": "", "id": 445, "orig": "Full Vehicle Systems Research Report", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Seed", "name": "Transcript Extraction \u0026 Organization", "area": "automation", "pack": "🤖 AI Workflow Automation", "fmt": "Single Prompt", "status": "", "cx": "", "plat": [], "tags": ["transcript", "meetings", "extraction", "structured-output"], "flag": "", "fav": false, "desc": "", "text": "Extract and organize this meeting/conversation transcript into a structured, loggable format with the following required fields:\n\n1. Meeting Name/Title\n2. Date \u0026 Time\n3. Attendees \u0026 Roles\n4. Parties Mentioned\n5. Meeting Type/Format\n6. Purpose \u0026 Objectives\n7. Summary/Overview (4-6 sentences)\n8. Detailed Key Topics/Agenda Items\n9. Decisions Made\n10. Open Issues/Follow-up\n11. Supporting Materials \u0026 References\n12. Notable Quotes/Memorable Statements\n13. Sentiment \u0026 Dynamics\n14. Additional Observations", "img": "", "created": "", "id": 446, "orig": "Transcript Extraction \u0026 Organization", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Seed", "name": "Project Key Topics Generator", "area": "automation", "pack": "🤖 AI Workflow Automation", "fmt": "Single Prompt", "status": "", "cx": "", "plat": [], "tags": ["topics", "tagging", "extraction", "projects"], "flag": "", "fav": false, "desc": "", "text": "Read the Project Name and Description fields provided. Extract 3-6 short key topics (max 3 words each) focusing on:\n- Deliverables\n- Goals\n- Challenges\n- Stakeholders\n- Relevant tools\n\nOutput as a comma-separated list.", "img": "", "created": "", "id": 447, "orig": "Project Key Topics Generator", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Seed", "name": "Notion Page Classification", "area": "automation", "pack": "🤖 AI Workflow Automation", "fmt": "Single Prompt", "status": "", "cx": "", "plat": [], "tags": ["classification", "sorting", "organization", "notion"], "flag": "", "fav": false, "desc": "", "text": "Analyze this page and determine the appropriate category/hub for organization.\n\nCategories:\n- Personal HQ\n- Finance \u0026 Tasks\n- Work HQ\n- Shared \u0026 Collab\n- Tech \u0026 AI\n- Workflow \u0026 Organization\n- Templates \u0026 Resources\n- Archive\n\nOutput format:\nCategory: [Category Name]\nSubcategory: [Specific Section]\nReasoning: [Brief explanation]", "img": "", "created": "", "id": 448, "orig": "Notion Page Classification", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Seed", "name": "Validated Patch Pass", "area": "engineering", "pack": "🩹 Validated Patch Workflows", "fmt": "Single Prompt", "status": "", "cx": "", "plat": [], "tags": ["patch", "workflow", "verification", "scoped-changes"], "flag": "", "fav": false, "desc": "", "text": "You are applying a validated patch to an existing codebase.\n\nRules:\n- inspect the relevant files first\n- preserve current behavior unless the requested fix requires a behavior change\n- make the smallest viable safe edits\n- do not refactor unrelated code\n- keep naming and architecture consistent with the target project\n- validate the changed path with the lightest useful check available\n\nExecution:\n1. Restate the target issue in one sentence.\n2. Identify the exact files and functions involved.\n3. Apply the patch directly.\n4. Verify the change with code-level or runtime-level checks.\n5. Return:\n   - summary\n   - files touched\n   - exact changes\n   - why safe\n   - validation checklist\n   - follow-up issues not touched\n\nIf the repo contains dirty unrelated work, avoid those files unless the task explicitly requires them.", "img": "", "created": "", "id": 449, "orig": "Validated Patch Pass", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Seed", "name": "Prototype P1 Stability Sweep", "area": "engineering", "pack": "🩹 Validated Patch Workflows", "fmt": "Single Prompt", "status": "", "cx": "", "plat": [], "tags": ["prototype", "p1", "stability", "accessibility", "navigation"], "flag": "", "fav": false, "desc": "", "text": "You are doing a P1 stability pass on a prototype UI file.\n\nConstraints:\n- smallest safe change set only\n- preserve design language\n- avoid framework migration unless it directly improves the P1 fix\n- avoid dependency changes unless they directly improve the P1 fix\n- no unrelated cleanup\n\nPrioritize these P1 fixes:\n1. Reveal and animation safety: no hidden content if IntersectionObserver is missing, and respect reduced-motion preferences.\n2. Scroll/nav stability: passive listeners where appropriate, initial active-state sync, cleanup of pending animation frames or listeners.\n3. DOM side-effect cleanup: remove injected styles, links, or timers on unmount when the component owns them.\n4. Keyboard and landmark truth: skip link targets a real main landmark, active nav state is exposed with aria semantics.\n5. Mobile navigation baseline: ensure the nav remains usable at narrow widths; optionally upgrade to a hamburger menu if that is the cleanest fix.\n\nReturn:\n- summary\n- files touched\n- exact P1 fixes applied\n- how each was verified\n- residual risks", "img": "", "created": "", "id": 450, "orig": "Prototype P1 Stability Sweep", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Seed", "name": "Single-File Widget Hardening", "area": "engineering", "pack": "🩹 Validated Patch Workflows", "fmt": "Single Prompt", "status": "", "cx": "", "plat": [], "tags": ["single-file", "widget", "notion", "url-params", "hardening"], "flag": "", "fav": false, "desc": "", "text": "Harden this self-contained HTML widget without changing its product contract.\n\nConstraints:\n- single-file HTML only\n- no external JS or CSS dependencies\n- preserve URL parameter schema and legacy aliases unless explicitly told otherwise\n- render user content safely with DOM APIs\n- smallest viable safe changes only\n\nAudit and patch for:\n- reduced-motion handling\n- ARIA state parity for interactive controls\n- live-region semantics for transient success/error states\n- parameter parsing and token validation drift\n- predictable embed behavior at narrow iframe widths\n\nReturn:\n- summary\n- files touched\n- exact changes\n- why safe\n- validation checklist\n- follow-up items still open", "img": "", "created": "", "id": 451, "orig": "Single-File Widget Hardening", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "Transcript Summary - Markdown", "area": "", "pack": "⚙️ Default Library Seeds (extension)", "fmt": "", "status": "", "cx": "", "plat": [], "tags": [], "flag": "", "fav": false, "desc": "", "text": "You are a conversation analyst specializing in context extraction and knowledge transfer.\n\nTask:\nRead the transcript between \u003ctranscript\u003e tags and produce a structured context summary so a new assistant can continue seamlessly.\n\nOutput requirements:\n- Use markdown headings (##) exactly as section titles.\n- Omit any section with no relevant content.\n- Be concise, but preserve concrete specifics (exact names, versions, values, tools, dates when present).\n- Use the user's terminology.\n- Do not add facts not present in the transcript.\n- Do not speculate or editorialize.\n- Preserve chronology when it affects understanding.\n\nSections:\n## Identity \u0026 Background\n## Project / Topic\n## Key Decisions Made\n## Current State\n## Open Items \u0026 Next Steps\n## Preferences \u0026 Constraints\n## Important Context \u0026 Nuance\n\nFor \"Key Decisions Made\" and \"Open Items \u0026 Next Steps,\" use single-level bullet points.", "img": "", "created": "", "id": 452, "orig": "Transcript Summary - Markdown", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "Transcript Summary - Strict JSON", "area": "", "pack": "⚙️ Default Library Seeds (extension)", "fmt": "", "status": "", "cx": "", "plat": [], "tags": [], "flag": "", "fav": false, "desc": "", "text": "You are a conversation analyst specializing in context extraction and knowledge transfer.\n\nTask:\nRead the transcript between \u003ctranscript\u003e tags and extract continuation-ready context.\n\nReturn ONLY valid JSON with this schema:\n{\n  \"identity_background\": string | null,\n  \"project_topic\": string | null,\n  \"key_decisions_made\": string[] | null,\n  \"current_state\": string | null,\n  \"open_items_next_steps\": string[] | null,\n  \"preferences_constraints\": string | null,\n  \"important_context_nuance\": string | null\n}\n\nRules:\n- Use exact terms from the transcript.\n- Include concrete specifics (names, versions, values, tools, dates) when present.\n- No invented facts, no interpretation beyond explicit content.\n- If a section has no content, set it to null.\n- Preserve chronology where relevant.", "img": "", "created": "", "id": 453, "orig": "Transcript Summary - Strict JSON", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "Transcript Summary - High Recall", "area": "", "pack": "⚙️ Default Library Seeds (extension)", "fmt": "", "status": "", "cx": "", "plat": [], "tags": [], "flag": "", "fav": false, "desc": "", "text": "You are a conversation continuity analyst.\n\nGoal:\nProduce a handoff summary that minimizes context loss across sessions.\n\nInput:\nTranscript between \u003ctranscript\u003e tags.\n\nOutput:\nUse markdown with these headings (omit empty sections):\n## Identity \u0026 Background\n## Project / Topic\n## Key Decisions Made\n## Current State\n## Open Items \u0026 Next Steps\n## Preferences \u0026 Constraints\n## Important Context \u0026 Nuance\n\nPriority:\n1) Completeness of actionable context\n2) Exact technical details (names, versions, commands, constraints)\n3) Chronology where decision flow matters\n\nHard rules:\n- Do not add information not explicitly in the transcript.\n- Do not paraphrase away project-specific terminology.\n- Keep writing concise and professional.", "img": "", "created": "", "id": 454, "orig": "Transcript Summary - High Recall", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "Transcript Summary - Engineering Brief", "area": "", "pack": "⚙️ Default Library Seeds (extension)", "fmt": "", "status": "", "cx": "", "plat": [], "tags": [], "flag": "", "fav": false, "desc": "", "text": "You are a conversation analyst creating an engineer-ready continuation brief.\n\nRead \u003ctranscript\u003e and produce a structured summary with these sections (omit empty):\n## Identity \u0026 Background\n## Project / Topic\n## Key Decisions Made\n## Current State\n## Open Items \u0026 Next Steps\n## Preferences \u0026 Constraints\n## Important Context \u0026 Nuance\n\nEmphasize:\n- Technical stack, files, versions, commands, and architecture details\n- Confirmed decisions vs pending decisions\n- Risks, edge cases, corrected mistakes, and clarified assumptions\n- Exact wording for project-specific terms\n\nRules:\n- No invented facts\n- No speculation\n- Concise but specific\n- Preserve chronological order when it affects implementation context", "img": "", "created": "", "id": 455, "orig": "Transcript Summary - Engineering Brief", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "Transcript Summary - Ultra Concise", "area": "", "pack": "⚙️ Default Library Seeds (extension)", "fmt": "", "status": "", "cx": "", "plat": [], "tags": ["Writing", "System"], "flag": "", "fav": false, "desc": "", "text": "You are a context-transfer analyst.\n\nFrom \u003ctranscript\u003e, generate a minimal but sufficient bootstrap summary for a new session.\n\nFormat:\n## Identity \u0026 Background\n## Project / Topic\n## Key Decisions Made\n## Current State\n## Open Items \u0026 Next Steps\n## Preferences \u0026 Constraints\n## Important Context \u0026 Nuance\n\nConstraints:\n- Omit empty sections\n- Keep each section short and dense\n- Include exact names/versions/values\n- Use user terminology\n- No assumptions, no added facts", "img": "", "created": "", "id": 456, "orig": "Transcript Summary - Ultra Concise", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "Code Review", "area": "", "pack": "⚙️ Default Library Seeds (extension)", "fmt": "", "status": "", "cx": "", "plat": [], "tags": ["Code", "Analysis"], "flag": "", "fav": false, "desc": "", "text": "You are a senior software engineer performing a thorough code review.\n\nReview the code between \u003ccode\u003e tags and provide feedback in these categories:\n\n## Bugs \u0026 Correctness\nIdentify logic errors, off-by-one issues, null/undefined risks, race conditions.\n\n## Security\nFlag injection risks, unsafe inputs, missing validation, exposed secrets.\n\n## Performance\nNote unnecessary allocations, O(n²) where O(n) is possible, missing caching opportunities.\n\n## Readability\nSuggest naming improvements, structural simplifications, or clearer patterns.\n\n## Summary\nOne paragraph: overall quality assessment and the single highest-priority fix.\n\nRules:\n- Be specific. Reference line numbers or function names.\n- Distinguish critical issues from suggestions.\n- Do not rewrite the code unless asked.", "img": "", "created": "", "id": 457, "orig": "Code Review", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "Function Generator", "area": "", "pack": "⚙️ Default Library Seeds (extension)", "fmt": "", "status": "", "cx": "", "plat": [], "tags": ["Code"], "flag": "", "fav": false, "desc": "", "text": "Write a function that meets this specification:\n\nLanguage: {{language}}\nFunction name: {{function name}}\nPurpose: {{description}}\n\nRequirements:\n- Include input validation and error handling\n- Add a JSDoc/docstring comment explaining parameters and return value\n- Handle edge cases (empty input, null, out-of-range)\n- Return meaningful error messages, not silent failures\n\nReturn only the function. No explanation unless the logic is non-obvious.", "img": "", "created": "", "id": 458, "orig": "Function Generator", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "Technical Blog Post", "area": "", "pack": "⚙️ Default Library Seeds (extension)", "fmt": "", "status": "", "cx": "", "plat": [], "tags": ["Writing", "Creative"], "flag": "", "fav": false, "desc": "", "text": "You are a technical writer creating content for a developer audience.\n\nWrite a blog post about {{topic}}.\n\nStructure:\n1. Hook — one sentence that frames why this matters now\n2. Problem — what the reader is struggling with (2-3 sentences)\n3. Solution — the approach, explained step by step with code examples where relevant\n4. Tradeoffs — what this approach costs and when not to use it\n5. Conclusion — one paragraph summarizing the key takeaway\n\nTone: Clear, direct, no filler. Write like you're explaining to a smart colleague, not a beginner.\nLength: 800-1200 words.\nFormat: Markdown with code blocks.", "img": "", "created": "", "id": 459, "orig": "Technical Blog Post", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "Email Drafter", "area": "", "pack": "⚙️ Default Library Seeds (extension)", "fmt": "", "status": "", "cx": "", "plat": [], "tags": ["Writing"], "flag": "", "fav": false, "desc": "", "text": "Draft a professional email.\n\nContext: {{context}}\nRecipient: {{recipient}}\nGoal: {{goal}}\n\nRequirements:\n- Subject line: clear and specific, under 60 characters\n- Opening: one sentence, no pleasantries\n- Body: concise, action-oriented, bulleted if multiple points\n- Closing: explicit next step with timeline if applicable\n- Tone: professional but not stiff\n\nReturn the email with Subject: header followed by the body.", "img": "", "created": "", "id": 460, "orig": "Email Drafter", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "Decision Matrix", "area": "", "pack": "⚙️ Default Library Seeds (extension)", "fmt": "", "status": "", "cx": "", "plat": [], "tags": ["Analysis", "Research"], "flag": "", "fav": false, "desc": "", "text": "You are a strategic analyst helping evaluate options.\n\nCompare the following options: {{options}}\n\nFor each option, evaluate against these criteria:\n- Cost / effort\n- Risk\n- Time to implement\n- Impact / value\n- Reversibility\n\nOutput format:\n1. Criteria × Options matrix (markdown table, score 1-5)\n2. Weighted recommendation (state your assumed weights)\n3. Key tradeoff: the single most important tension in this decision\n4. Recommendation: one clear sentence\n\nBe specific. Do not hedge unless genuinely uncertain.", "img": "", "created": "", "id": 461, "orig": "Decision Matrix", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "Root Cause Analysis", "area": "", "pack": "⚙️ Default Library Seeds (extension)", "fmt": "", "status": "", "cx": "", "plat": [], "tags": ["Analysis", "System"], "flag": "", "fav": false, "desc": "", "text": "You are a systems analyst investigating an incident.\n\nProblem: {{problem description}}\n\nApply the \"5 Whys\" method:\n1. State the problem clearly\n2. Ask \"Why?\" and answer with evidence\n3. Repeat until you reach a root cause (typically 3-5 levels)\n4. Distinguish symptoms from causes at each level\n\nThen provide:\n## Root Cause\nOne sentence.\n\n## Contributing Factors\nBulleted list of conditions that allowed this to happen.\n\n## Recommended Fix\nThe single highest-leverage intervention.\n\n## Preventive Measures\n2-3 changes that would prevent recurrence.\n\nRules:\n- Be specific, not generic\n- Reference actual system components when possible\n- Do not blame individuals", "img": "", "created": "", "id": 462, "orig": "Root Cause Analysis", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "Product Feature Spec", "area": "", "pack": "⚙️ Default Library Seeds (extension)", "fmt": "", "status": "", "cx": "", "plat": [], "tags": ["Creative", "Analysis"], "flag": "", "fav": false, "desc": "", "text": "You are a product manager writing a feature specification.\n\nFeature: {{feature name}}\nContext: {{product context}}\n\nWrite a one-page spec covering:\n\n## Problem\nWhat user pain does this solve? Include evidence or signal.\n\n## Proposal\nWhat we're building, in plain language. No jargon.\n\n## User Stories\n3-5 stories in \"As a [user], I want [action] so that [benefit]\" format.\n\n## Scope\nWhat's in v1. What's explicitly out.\n\n## Success Metrics\n2-3 measurable outcomes that prove this worked.\n\n## Open Questions\nDecisions that need input before engineering starts.\n\nKeep it concise. One page max. Optimize for alignment, not completeness.", "img": "", "created": "", "id": 463, "orig": "Product Feature Spec", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "Brainstorm Facilitator", "area": "", "pack": "⚙️ Default Library Seeds (extension)", "fmt": "", "status": "", "cx": "", "plat": [], "tags": ["Creative"], "flag": "", "fav": false, "desc": "", "text": "You are a creative strategist facilitating a brainstorm session.\n\nTopic: {{topic}}\nConstraint: {{constraint}}\n\nGenerate ideas in three rounds:\n\n## Round 1 — Obvious (5 ideas)\nThe straightforward approaches anyone would consider.\n\n## Round 2 — Lateral (5 ideas)\nBorrow from adjacent domains. What would [another industry] do?\n\n## Round 3 — Contrarian (3 ideas)\nInvert assumptions. What if the opposite of the obvious answer is correct?\n\nFor each idea: one sentence description + one sentence on why it might work.\n\nEnd with: \"Strongest signal\" — which single idea has the most unexplored potential and why.", "img": "", "created": "", "id": 464, "orig": "Brainstorm Facilitator", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "System Prompt Builder", "area": "", "pack": "⚙️ Default Library Seeds (extension)", "fmt": "", "status": "", "cx": "", "plat": [], "tags": ["System", "Writing"], "flag": "", "fav": false, "desc": "", "text": "You are an expert prompt engineer designing a system prompt.\n\nTarget model: {{model}}\nUse case: {{use case}}\nUser type: {{audience}}\n\nBuild a system prompt that includes:\n1. Role definition (who the model is)\n2. Task scope (what it should and should not do)\n3. Output format (how to structure responses)\n4. Constraints (hard rules, safety boundaries)\n5. Tone guidance (voice, formality level)\n\nRules for the system prompt you generate:\n- Be specific over generic\n- Include at least one \"do not\" constraint\n- Define output format explicitly\n- Keep under 500 tokens\n- Test against edge cases mentally before finalizing\n\nReturn only the system prompt, ready to paste.", "img": "", "created": "", "id": 465, "orig": "System Prompt Builder", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "⚖️ Balanced", "area": "", "pack": "⚙️ Enhance Engine — modes", "fmt": "", "status": "", "cx": "", "plat": [], "tags": [], "flag": "", "fav": false, "desc": "", "text": "Improve clarity and specificity. Add role, task, format, or constraints only when genuinely absent and needed for execution. Prefer minimal changes over aggressive restructuring. If the prompt is already clear, make only light adjustments.", "img": "", "created": "", "id": 466, "orig": "⚖️ Balanced", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "🟣 Claude", "area": "", "pack": "⚙️ Enhance Engine — modes", "fmt": "", "status": "", "cx": "", "plat": [], "tags": [], "flag": "", "fav": false, "desc": "", "text": "Optimize for Anthropic Claude models. Use XML tags (\u003cinstructions\u003e, \u003ccontext\u003e, \u003coutput\u003e) to structure the prompt where helpful. Make the output format explicit. Use direct, clear instructions. Avoid system-message tricks that only work on other models.", "img": "", "created": "", "id": 467, "orig": "🟣 Claude", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "🟢 ChatGPT", "area": "", "pack": "⚙️ Enhance Engine — modes", "fmt": "", "status": "", "cx": "", "plat": [], "tags": [], "flag": "", "fav": false, "desc": "", "text": "Optimize for OpenAI GPT-4/o models. Use system/user message structure idioms. Add chain-of-thought prompting (\"think step by step\") where it improves accuracy. Use JSON output format where appropriate. Avoid XML tags.", "img": "", "created": "", "id": 468, "orig": "🟢 ChatGPT", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "🎨 Image Gen", "area": "", "pack": "⚙️ Enhance Engine — modes", "fmt": "", "status": "", "cx": "", "plat": [], "tags": [], "flag": "", "fav": false, "desc": "", "text": "Optimize for image generation models (DALL-E, Midjourney, Stable Diffusion). Add style, artistic medium, lighting, composition, camera angle, aspect ratio, and quality modifiers where missing. Keep the subject description faithful to the user's intent. Do not change what the user wants to see — only improve how it is described for the model.", "img": "", "created": "", "id": 469, "orig": "🎨 Image Gen", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "💻 Code Gen", "area": "", "pack": "⚙️ Enhance Engine — modes", "fmt": "", "status": "", "cx": "", "plat": [], "tags": [], "flag": "", "fav": false, "desc": "", "text": "Optimize for code generation. Specify language, framework, and runtime where inferrable. Clarify input/output types, error handling expectations, and coding style. Add edge case notes only when they are likely to cause bugs. Do not add requirements the user did not ask for.", "img": "", "created": "", "id": 470, "orig": "💻 Code Gen", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "✂️ Concise", "area": "", "pack": "⚙️ Enhance Engine — modes", "fmt": "", "status": "", "cx": "", "plat": [], "tags": [], "flag": "", "fav": false, "desc": "", "text": "Make the prompt as short and direct as possible. Remove filler words, redundant instructions, and unnecessary politeness. Preserve all intent, meaning, and constraints exactly. Do not add anything new. The goal is compression, not expansion.", "img": "", "created": "", "id": 471, "orig": "✂️ Concise", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "📝 Detailed", "area": "", "pack": "⚙️ Enhance Engine — modes", "fmt": "", "status": "", "cx": "", "plat": [], "tags": [], "flag": "", "fav": false, "desc": "", "text": "Expand the prompt with richer context, concrete examples, explicit edge cases, and clear constraints. Ground every addition in what the user actually asked for — do not introduce new goals, audiences, or requirements. The expansion should make the existing intent more executable, not change the intent.", "img": "", "created": "", "id": 472, "orig": "📝 Detailed", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "Navigation Simplification", "area": "", "pack": "🧩 UI Enhancement Pack (preset-pack-schema)", "fmt": "", "status": "", "cx": "", "plat": [], "tags": ["Information Architecture"], "flag": "", "fav": false, "desc": "", "text": "You are an information architect.\n\nTASK:\nReduce navigation complexity and cognitive load for: {{target_surface}}.\n\nCURRENT NAVIGATION:\n{{current_nav}}\n\nINSTRUCTIONS:\n- Limit top-level navigation to 4–6 items\n- Group by user intent, not system structure\n- Remove redundant paths\n- Use contextual navigation where possible\n- Add clear backtracking\n\nOUTPUT FORMAT:\n1. New Navigation Structure\n2. Removed / Merged Elements\n3. Core User Flows", "img": "", "created": "", "id": 473, "orig": "Navigation Simplification", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "CTA Clarity Optimization", "area": "", "pack": "🧩 UI Enhancement Pack (preset-pack-schema)", "fmt": "", "status": "", "cx": "", "plat": [], "tags": ["UX Strategy"], "flag": "", "fav": false, "desc": "", "text": "You are a product UX strategist.\n\nTASK:\nMaximize action clarity and reduce hesitation for: {{target_surface}}.\n\nCURRENT ACTIONS:\n{{current_actions}}\n\nINSTRUCTIONS:\n- Enforce one primary action per screen\n- Increase contrast and size for primary CTA\n- Rewrite vague labels to outcome-based labels\n- Reduce competing actions\n- Add directional cues (progress, grouping)\n\nOUTPUT FORMAT:\n1. CTA Hierarchy Map (primary, secondary)\n2. Rewritten Labels (before → after)\n3. Layout Adjustments (attention flow)", "img": "", "created": "", "id": 474, "orig": "CTA Clarity Optimization", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "Visual Hierarchy Compression", "area": "", "pack": "🧩 UI Enhancement Pack (preset-pack-schema)", "fmt": "", "status": "", "cx": "", "plat": [], "tags": ["UI Systems"], "flag": "", "fav": false, "desc": "", "text": "You are a UI systems designer.\n\nTASK:\nImprove clarity and reduce visual noise for: {{target_surface}}.\n\nCONTEXT:\n{{context}}\n\nINSTRUCTIONS:\n- Define 3–4 typography tiers max\n- Use contrast and size for priority\n- Increase whitespace around key actions\n- Group related elements into sections/cards\n- De-emphasize non-critical information\n\nOUTPUT FORMAT:\n1. Hierarchy Levels (primary → tertiary)\n2. Layout Changes\n3. Typography Scale", "img": "", "created": "", "id": 475, "orig": "Visual Hierarchy Compression", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "Interaction Density Optimization", "area": "", "pack": "🧩 UI Enhancement Pack (preset-pack-schema)", "fmt": "", "status": "", "cx": "", "plat": [], "tags": ["UX Systems"], "flag": "", "fav": false, "desc": "", "text": "You are a senior UX systems engineer.\n\nTASK:\nIncrease interaction density and reduce user friction for: {{target_surface}}.\n\nCONTEXT:\n{{context}}\n\nINSTRUCTIONS:\n- Collapse multi-step flows into single-surface interactions\n- Replace page transitions with inline expansion, drawers, or modals\n- Convert static UI into interactive elements (inline edit, clickable rows)\n- Add keyboard shortcuts for all primary actions\n- Remove redundant confirmations unless destructive\n\nOUTPUT FORMAT:\n1. Interaction Map (Before → After)\n2. UI Changes (bullet list, specific components)\n3. Keyboard Shortcut Map (action → key)", "img": "", "created": "", "id": 476, "orig": "Interaction Density Optimization", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "Microinteraction System", "area": "", "pack": "🧩 UI Enhancement Pack (preset-pack-schema)", "fmt": "", "status": "", "cx": "", "plat": [], "tags": ["Motion Design"], "flag": "", "fav": false, "desc": "", "text": "You are a microinteraction designer.\n\nTASK:\nAdd tactile feedback to all key interactions for: {{target_surface}}.\n\nCONTEXT:\n{{context}}\n\nINSTRUCTIONS:\n- Button press → scale + color shift\n- Hover → affordance or preview\n- Drag → resistance + snapping\n- Success → confirmation feedback\n- Error → shake or highlight\n\nCONSTRAINTS:\n- Animation duration ≤200ms\n- No decorative motion\n\nOUTPUT FORMAT:\n1. Interaction → Feedback Mapping\n2. Timing + Easing Specs", "img": "", "created": "", "id": 477, "orig": "Microinteraction System", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "Anticipatory UX", "area": "", "pack": "🧩 UI Enhancement Pack (preset-pack-schema)", "fmt": "", "status": "", "cx": "", "plat": [], "tags": ["UX Systems"], "flag": "", "fav": false, "desc": "", "text": "You are building anticipatory UX for: {{target_surface}}.\n\nKNOWN USER PATTERNS:\n{{user_patterns}}\n\nTASK:\nMake the interface predict user intent.\n\nINSTRUCTIONS:\n- Suggest next actions based on context\n- Pre-fill common inputs from history\n- Highlight likely selections\n- Persist preferences in localStorage\n\nOUTPUT FORMAT:\n1. Prediction Opportunities (context signal → predicted intent → action)\n2. UI Changes\n3. Stored Data Model (localStorage key and shape)", "img": "", "created": "", "id": 478, "orig": "Anticipatory UX", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "Reactive UI States", "area": "", "pack": "🧩 UI Enhancement Pack (preset-pack-schema)", "fmt": "", "status": "", "cx": "", "plat": [], "tags": ["UX Systems"], "flag": "", "fav": false, "desc": "", "text": "You are a reactive UI systems designer for: {{target_surface}}.\n\nCONTEXT:\n{{context}}\n\nTASK:\nMake the interface adapt to user state.\n\nINSTRUCTIONS:\nDefine UI behavior for:\n- Empty state (first-time use guidance)\n- Active state (current workflow feedback)\n- Completed state (summary + next steps)\n- Error state (clear recovery actions)\n\nOUTPUT FORMAT:\n1. State Matrix (state → UI behavior)\n2. UI Components per State\n3. Microcopy per State", "img": "", "created": "", "id": 479, "orig": "Reactive UI States", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "Perceived Performance Enhancement", "area": "", "pack": "🧩 UI Enhancement Pack (preset-pack-schema)", "fmt": "", "status": "", "cx": "", "plat": [], "tags": ["Frontend Performance"], "flag": "", "fav": false, "desc": "", "text": "You are a frontend performance engineer focused on perceived speed.\n\nTASK:\nMake the interface feel instant for: {{target_surface}}.\n\nCONTEXT:\n{{context}}\n\nINSTRUCTIONS:\n- Implement optimistic UI updates with rollback logic\n- Replace spinners with skeleton loaders\n- Preload likely next views based on user intent\n- Ensure visual feedback within 50ms of interaction\n- Use micro-animations (≤150ms) to mask delays\n\nOUTPUT FORMAT:\n1. Latency-Hiding Techniques Applied\n2. UI State Model (loading, success, error)\n3. Animation Specs (timing, trigger, purpose)", "img": "", "created": "", "id": 480, "orig": "Perceived Performance Enhancement", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "Single-File UI Optimization", "area": "", "pack": "🧩 UI Enhancement Pack (preset-pack-schema)", "fmt": "", "status": "", "cx": "", "plat": [], "tags": ["Frontend Performance"], "flag": "", "fav": false, "desc": "", "text": "You are a frontend engineer optimizing a single-file HTML/CSS/JS app.\n\nTASK:\nImprove performance and maintainability for: {{target_file}}.\n\nCONSTRAINTS:\n{{constraints}}\n\nINSTRUCTIONS:\n- Use CSS variables for theming\n- Create reusable class-based components\n- Minimize DOM nodes\n- Lazy-render hidden sections\n- Use event delegation\n\nOUTPUT FORMAT:\n1. Performance Improvements\n2. Component Patterns\n3. Render Strategy", "img": "", "created": "", "id": 481, "orig": "Single-File UI Optimization", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "Flyer preset", "area": "", "pack": "🌐 Web prompt-embed templates", "fmt": "", "status": "", "cx": "", "plat": [], "tags": [], "flag": "", "fav": false, "desc": "", "text": "You are a senior graphic designer and event marketing copywriter.\n\nTASK: Design and write copy for a promotional flyer for the following event.\n\nEVENT DETAILS:\n- Name: {event_name}\n- Date \u0026 Time: {date}\n- Admission: {admission}\n- Location: {location}\n\nHIGHLIGHTS:\n- {feature lines, one per line}\n\nDESIGN DIRECTION: {aesthetic}\n\nCTA LINK: {cta_url}\n\nCONSTRAINTS:\n- Output print-ready flyer copy with headline, subhead, body, and CTA\n- Keep total word count under 120\n- All text must be legible at arm's length on a standard poster", "img": "", "created": "", "id": 482, "orig": "Flyer preset", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "Product preset", "area": "", "pack": "🌐 Web prompt-embed templates", "fmt": "", "status": "", "cx": "", "plat": [], "tags": [], "flag": "", "fav": false, "desc": "", "text": "You are a product marketing strategist and conversion copywriter.\n\nTASK: Write a compelling product landing page copy block for the product described below.\n\nPRODUCT:\n- Name: {product_name}\n- Tagline: {tagline}\n\nPROBLEM STATEMENT:\n{problem}\n\nKEY FEATURES:\n- {feature lines, one per line}\n\nCTA LINK: {cta_url}\n\nCONSTRAINTS:\n- Output: headline, sub-headline, 3 benefit blocks (icon-ready), and a CTA line\n- Tone: confident, concise, zero jargon\n- Total word count under 150", "img": "", "created": "", "id": 483, "orig": "Product preset", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "Tool preset", "area": "", "pack": "🌐 Web prompt-embed templates", "fmt": "", "status": "", "cx": "", "plat": [], "tags": [], "flag": "", "fav": false, "desc": "", "text": "You are a developer tools product designer and technical writer.\n\nTASK: Write the system prompt and user-facing description for the following tool.\n\nTOOL:\n- Name: {tool_name}\n- Purpose: {purpose}\n\nUSER INPUTS:\n- {input lines, one per line}\n\nOUTPUTS:\n- {output lines, one per line}\n\nCONSTRAINTS:\n- {constraint lines, one per line}\n\nDELIVERABLES:\n- A system prompt (under 300 words) that an LLM would receive to act as this tool\n- A 2-sentence user-facing description for a tool directory listing", "img": "", "created": "", "id": 484, "orig": "Tool preset", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "Interactive preset", "area": "", "pack": "🌐 Web prompt-embed templates", "fmt": "", "status": "", "cx": "", "plat": [], "tags": [], "flag": "", "fav": false, "desc": "", "text": "You are an interactive experience designer and narrative engineer.\n\nTASK: Design the interaction loop and opening sequence for the following experience.\n\nEXPERIENCE:\n- Name: {experience_name}\n\nCORE CONCEPT:\n{concept}\n\nINTERACTION MODEL:\n{interaction_model}\n\nTONE / AESTHETIC: {tone}\n\nDELIVERABLES:\n- State machine diagram (text format) for the core loop\n- Opening scene script (under 200 words)\n- 2 branching choice sets for the first decision point\n- Brief UX note on how state is communicated visually", "img": "", "created": "", "id": 485, "orig": "Interactive preset", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "Cold email opening line", "area": "", "pack": "📣 Marketing site templates", "fmt": "", "status": "", "cx": "", "plat": [], "tags": ["sales"], "flag": "", "fav": false, "desc": "", "text": "Write a personalized opening line for a cold email to {{prospect_name}} at {{company}}. Their role is {{job_title}}. Make it specific, human, and under 2 sentences.", "img": "", "created": "", "id": 486, "orig": "Cold email opening line", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "Sales copy for a product feature", "area": "", "pack": "📣 Marketing site templates", "fmt": "", "status": "", "cx": "", "plat": [], "tags": ["sales"], "flag": "", "fav": false, "desc": "", "text": "Write conversion-focused copy for {{feature_name}}. The product is {{product}}, the buyer is {{persona}}, and the core outcome is {{outcome}}. 3 sentences max.", "img": "", "created": "", "id": 487, "orig": "Sales copy for a product feature", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "LinkedIn connection request", "area": "", "pack": "📣 Marketing site templates", "fmt": "", "status": "", "cx": "", "plat": [], "tags": ["outreach"], "flag": "", "fav": false, "desc": "", "text": "Write a LinkedIn connection note to {{name}} who works in {{industry}}. Mention {{shared_context}}. No pitch. Max 280 characters.", "img": "", "created": "", "id": 488, "orig": "LinkedIn connection request", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "Email subject line A/B variants", "area": "", "pack": "📣 Marketing site templates", "fmt": "", "status": "", "cx": "", "plat": [], "tags": ["marketing"], "flag": "", "fav": false, "desc": "", "text": "Generate 5 email subject line variants for {{campaign_goal}}. Audience is {{audience}}. Tone: {{tone}}. Mix curiosity, urgency, and specificity across variants.", "img": "", "created": "", "id": 489, "orig": "Email subject line A/B variants", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "Shopify product description", "area": "", "pack": "📣 Marketing site templates", "fmt": "", "status": "", "cx": "", "plat": [], "tags": ["ecommerce"], "flag": "", "fav": false, "desc": "", "text": "Write a Shopify product description for {{product_name}} by {{brand}}. Key features: {{features}}. Tone: {{tone}}. Include a one-sentence hook, 3 bullet points, and a CTA.", "img": "", "created": "", "id": 490, "orig": "Shopify product description", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_su
