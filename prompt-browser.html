<style>
:root{--bg:#f6f8fb;--surface:#ffffff;--raised:#eef3f8;--border:#d6dee8;--text:#182230;--dim:#607086;--mut:#748198;
--violet:#6d4aff;--violet-d:rgba(109,74,255,.12);--teal:#047d73;--teal-d:rgba(4,125,115,.11);
--amber:#a45f00;--amber-d:rgba(164,95,0,.12);--red:#c23b3b;--red-d:rgba(194,59,59,.12);--green:#0f7a45;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.bar{position:sticky;top:0;z-index:20;background:rgba(246,248,251,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:14px 20px}
.bar h1{font-size:16px;font-weight:700;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
.bar h1 .logo{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--violet),var(--teal));display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.bar h1 .count{margin-left:auto;font-size:12px;font-weight:500;color:var(--dim)}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px;align-items:center}
#q{flex:1;min-width:220px;background:var(--raised);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:9px 13px;font-size:14px;outline:none}
#q:focus{border-color:var(--violet)}
select{background:var(--raised);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 9px;font-size:12.5px;outline:none;max-width:215px}
select:focus{border-color:var(--violet)}
.tog{display:inline-flex;align-items:center;gap:6px;background:var(--raised);border:1px solid var(--border);border-radius:8px;padding:7px 11px;font-size:12.5px;color:var(--dim);cursor:pointer;user-select:none}
.tog.on{color:var(--text);border-color:var(--violet);background:var(--violet-d)}
.tog.on.warn{border-color:var(--amber);background:var(--amber-d);color:var(--amber)}
.tog input{display:none}
#clear{background:none;border:1px solid var(--border);color:var(--dim);border-radius:8px;padding:7px 11px;font-size:12.5px;cursor:pointer}
#clear:hover{color:var(--text);border-color:var(--red)}
.saved-tools{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.mini{background:var(--raised);border:1px solid var(--border);color:var(--dim);border-radius:8px;padding:7px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.mini:hover{color:var(--text);border-color:var(--violet)}
.mini.danger:hover{border-color:var(--red);color:var(--red)}
.mini.done{border-color:rgba(52,211,153,.5);color:var(--green);background:rgba(52,211,153,.13)}
#saved-view,#recent-copy{max-width:180px}
.wrap{max-width:1080px;margin:0 auto;padding:18px 20px 80px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:13px}
.card.flagged{border-left:3px solid var(--amber)}
.card.bad{border-left:3px solid var(--red)}
.card.review{border-left:3px solid var(--violet)}
.chead{display:flex;align-items:flex-start;gap:12px}
.cname{font-size:15px;font-weight:650;letter-spacing:-.2px;line-height:1.35;word-break:break-word}
.was{font-size:11.5px;color:var(--mut);margin-top:3px}
.was code{color:var(--dim)}
.copy{margin-left:auto;flex-shrink:0;background:var(--violet-d);border:1px solid rgba(167,139,250,.4);color:var(--violet);border-radius:8px;padding:7px 14px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.13s}
.copy:hover{background:rgba(167,139,250,.26)}
.copy.done{background:rgba(52,211,153,.18);border-color:rgba(52,211,153,.5);color:var(--green)}
.reviewbtn{flex-shrink:0;background:var(--amber-d);border:1px solid rgba(251,191,36,.38);color:var(--amber);border-radius:8px;padding:7px 11px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.13s}
.reviewbtn:hover{background:rgba(251,191,36,.24)}
.reviewbtn.clear{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.45);color:var(--green)}
.fillbtn{flex-shrink:0;background:var(--teal-d);border:1px solid rgba(4,125,115,.35);color:var(--teal);border-radius:8px;padding:7px 11px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.13s}
.fillbtn:hover{background:rgba(4,125,115,.19)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.b{font-size:11px;padding:2.5px 8px;border-radius:999px;border:1px solid var(--border);color:var(--dim);background:var(--raised);white-space:nowrap}
.b.click{cursor:pointer}.b.click:hover{color:var(--text);border-color:var(--violet)}
.b.src{color:var(--teal);background:var(--teal-d);border-color:rgba(45,212,191,.3)}
.b.area{color:var(--violet);background:var(--violet-d);border-color:rgba(167,139,250,.3)}
.b.pack{color:#5f49d6}
.b.flag{color:var(--amber);background:var(--amber-d);border-color:rgba(251,191,36,.35)}
.b.fav{color:var(--amber)}
.b.status{color:var(--green)}
.b.tred{color:var(--red);background:var(--red-d);border-color:rgba(248,113,113,.4)}
.b.tamber{color:var(--amber);background:var(--amber-d);border-color:rgba(251,191,36,.4)}
.hit{background:rgba(251,191,36,.34);color:var(--text);border-radius:3px;padding:0 2px}
.desc{color:var(--mut);font-size:12.5px;margin-top:9px;font-style:italic}
pre.body{background:#f9fbfd;border:1px solid var(--border);border-radius:9px;padding:12px 14px;margin-top:11px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;color:#26354a}
.fillpanel{background:var(--raised);border:1px solid var(--border);border-radius:10px;margin-top:11px;padding:12px}
.fillgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px;margin-bottom:10px}
.fillfield{display:flex;flex-direction:column;gap:4px}
.fillfield label{font-size:11px;font-weight:700;color:var(--dim)}
.fillfield input{background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:7px 9px;outline:none}
.fillfield input:focus{border-color:var(--teal)}
.fillactions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:9px}
.fillnote{color:var(--mut);font-size:12px}
.morebtn{background:none;border:none;color:var(--violet);font-size:12px;cursor:pointer;margin-top:7px;padding:0;font-weight:600}
.imgwrap{margin-top:9px}
.imgtog{background:none;border:1px dashed var(--border);color:var(--dim);font-size:11.5px;border-radius:7px;padding:5px 10px;cursor:pointer}
.imgtog:hover{color:var(--text)}
.empty{text-align:center;color:var(--mut);padding:60px 20px;font-size:15px}
kbd{background:var(--raised);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-size:11px;font-family:monospace}
</style><link rel="stylesheet" href="css/sbd-public-nav.css">
</head>
<body>
<div class="bar">
  <h1><span class="logo">⌘</span> Prompt Library Browser <span class="count" id="cnt"></span></h1>
  <div class="controls">
    <input id="q" placeholder="Search name, text, tags…  ( / to focus )" autocomplete="off">
    <div class="saved-tools" aria-label="Saved views and recent copies">
      <select id="saved-view" title="Saved views"><option value="">Saved views</option></select>
      <button id="save-view" class="mini" type="button">Save view</button>
      <button id="delete-view" class="mini danger" type="button">Delete</button>
      <select id="recent-copy" title="Recent copies"><option value="">Recent copies</option></select>
      <button id="export-state" class="mini" type="button">Export state</button>
      <button id="import-state" class="mini" type="button">Import state</button>
      <input id="state-file" type="file" accept="application/json,.json" hidden>
    </div>
    <select id="f-src"></select><select id="f-area"></select><select id="f-pack"></select>
    <select id="f-fmt"></select><select id="f-status"></select><select id="f-plat"></select>
    <select id="f-tstat"></select>
    <select id="sort">
      <option value="name">Sort: Name</option><option value="area">Sort: Area</option>
      <option value="pack">Sort: Pack</option><option value="created">Sort: Newest</option>
      <option value="len">Sort: Length</option><option value="tstat">Sort: Text status</option>
    </select>
    <label class="tog" id="t-fav"><input type="checkbox">★ Favorites</label>
    <label class="tog" id="t-flag"><input type="checkbox">⚠ Flagged</label>
    <label class="tog warn" id="t-bad"><input type="checkbox">⛔ Needs text</label>
    <label class="tog" id="t-ren"><input type="checkbox">✎ Renamed</label>
    <label class="tog" id="t-img"><input type="checkbox">🎨 Has image</label>
    <label class="tog warn" id="t-review"><input type="checkbox">☑ Review Queue <span id="review-count"></span></label>
    <button id="clear">Clear</button>
  </div>
</div>
<div class="wrap"><div id="list"></div></div>

g fixes, and a concise system‑insight summary. Ideal for creating a single canonical hub, identifying duplicates, and planning immediate cleanup actions.", "text": "# 🧩 Workspace Audit — Page Routing \u0026 Canonicalization\n\n## 🎯 Objective\nSearch the entire workspace for all pages related to \u003cTOPIC\u003e and determine their correct placement within a clean, canonical structure.\n\n---\n\n## 🔍 Step 1 — Discovery\nSearch across the full workspace for all pages, databases, and subpages related to \u003cTOPIC\u003e.\n\nInclude:\n- Direct matches (title contains topic)\n- Indirect matches (content, tags, relations)\n- Embedded/linked database views\n\n---\n\n## 🧠 Step 2 — Evaluation Criteria\n\nFor EACH page, evaluate:\n\n### 1. Relevance\n- Is this page directly part of \u003cTOPIC\u003e?\n- Peripheral reference?\n- Unrelated but misfiled?\n\n### 2. Duplication\n- Does another page already serve this function?\n- Is this a partial duplicate, outdated version, or fork?\n\n### 3. Long-Term Value\n- Active system component\n- Reference / archive\n- Disposable / obsolete\n\n---\n\n## 🏷️ Step 3 — Naming Hygiene Pass (REQUIRED)\n\nPerform ALL THREE passes:\n\n1. Accuracy Check\n   - Does the title clearly reflect what the page actually contains?\n\n2. System Fit Check\n   - Does the name match current workspace naming conventions?\n\n3. Post-Move Check\n   - If relocated, will the name still make sense in the new location?\n   - Should prefix or structure change (e.g., HUB |, DB |, FIN |, etc.)?\n\n---\n\n## 🗂️ Step 4 — Placement Decision\n\nFor EACH page, decide ONE:\n\n- KEEP (in place)  \n  Already correctly located and named\n\n- MOVE (to canonical hub)  \n  Belongs in a better structured location\n\n- LINK (from hub)  \n  Lives elsewhere but should be referenced centrally\n\n- MERGE  \n  Combine into another page\n\n- ARCHIVE  \n  No longer needed but worth retaining\n\n- DELETE  \n  No long-term value\n\n---\n\n## 📊 Step 5 — Output Table\n\nCreate a structured summary table:\n\n| Page Name | Naming Fix (if any) | Current Location | Recommended Action | Target Location | Reasoning |\n|----------|--------------------|------------------|--------------------|-----------------|----------|\n\n---\n\n## 🧭 Step 6 — System Insight (REQUIRED)\n\nAfter the table, include:\n\n### 1. Canonical Hub Recommendation\n- What should be the single “front door” for \u003cTOPIC\u003e?\n\n### 2. Structural Issues Found\n- Duplicate hubs\n- Orphaned pages\n- Misplaced databases\n- Naming inconsistencies\n\n### 3. Immediate Actions (Top 3)\n- Highest impact fixes to execute first\n\n---\n\n## ⚠️ Rules\n\n- Do NOT skip pages because they are nested or hidden\n- Prefer consolidation over fragmentation\n- Favor ONE canonical system over multiple competing hubs\n- Assume long-term maintainability is the priority\n\n---\n\n## ✅ Output Only:\n- Table\n- System Insight section", "field": "Exact Prompt Copy", "img": "A modern, sleek digital dashboard illustrating a Notion workspace audit: icons for page routing, canonical hubs, tables with naming fixes, and structured placement decisions, rendered in a clean, futuristic UI style.", "created": "2026-05-04", "tstat": "valid", "ai_rename": "🤖 | AD | Workspace Audit – Page Routing \u0026 Canonicalization", "naming_sugg": "🤖🧾 | ADM | Audit Workspace Audit | Page Routing | v1", "id": 4}, {"src": "Notion DB", "orig": "🎨 | CR | Draft Batch Image Prompt Template | 05-02 | v1", "name": "🎨 | CR | Draft Batch Image Prompt Template | 05-02 | v1", "changed": false, "untitled": false, "area": "ARTIST", "pack": "", "fmt": "Input Template", "status": "Intake", "cx": "", "plat": [], "tags": ["Content Structuring", "Workflow Optimization", "Content Creation"], "flag": "Classification Conflict", "fav": false, "desc": "Use this prompt to generate a complete batch‑image generation template that separates shared visual style from individual subject prompts. Paste your desired image type, shared style details, aspect ratio, dimensions, and any negative constraints into the placeholders, then list each subject with a concrete hero object, action, and lighting cue. The output is a ready‑to‑use prompt pack for consistent icon or illustration sets.", "text": "Use this prompt to generate a complete batch‑image generation template that separates shared visual style from individual subject prompts. Paste your desired image type, shared style details, aspect ratio, dimensions, and any negative constraints into the placeholders, then list each subject with a concrete hero object, action, and lighting cue. The output is a ready‑to‑use prompt pack for consistent icon or illustration sets.", "field": "📝 Description", "img": "Create a cohesive batch‑image generation prompt for a 🎨 | CR | Draft Batch Image Prompt Template | 05‑02 | v1 that separates shared visual style from individual subject prompts.Image Type: {image_type} – e.g., “3D icon set” or “hero illustration”.Shared Style: {shared_style} – consistent visual DNA, lighting, rendering style, and bounded decorative vocabulary.Aspect Ratio: {aspect_ratio} – e.g., “1:1 square”.Dimensions: {dimensions} – e.g., “1024×1024”.Negative Constraints: {negative_constraints} – “no text, no logos, no watermarks, no UI chrome”.Prompt Template:Create a cohesive batch image‑generation prompt pack for:  Image Type: {image_type}  Shared Style: {shared_style}  Aspect Ratio: {aspect_ratio}  Dimensions: {dimensions}  Negative Constraints: {negative_constraints}  Decorative Vocabulary: {decorative_vocabulary}  Groups and Palette Directives: {groups} {palette_directives}  Subjects: {subjects}  Tooling Notes: {tooling_notes}  Flagged Uncertainties: {flagged_uncertainties}", "created": "2026-05-02", "tstat": "desc-only", "ai_rename": "🤖 | CR | Batch Image Prompt Template", "naming_sugg": "🤖🎨 | CR | Draft Batch Image Prompt | v1", "id": 5}, {"src": "Notion DB", "orig": "🧠 | ORG | Extract Operating Rules from Old Chats", "name": "🧠 | ORG | Extract Operating Rules from Old Chats", "changed": false, "untitled": false, "area": "ORG", "pack": "", "fmt": "Single Prompt", "status": "Active", "cx": "", "plat": [], "tags": [], "flag": "Needs Review", "fav": true, "desc": "Use this prompt to mine a chat transcript or summary for durable operating rules, preferences, and do/don’t constraints, then output them in a structured table with evidence, scope, and enforcement details plus optional conflict and log sections. Paste the full chat text as input; the prompt generates a rule table, conflict list, and ready‑to‑paste log entries.", "text": "You are an operating-rules extraction assistant.\n\nDEFAULT SCOPE (current session)\nUnless the user explicitly provides a different transcript, treat the INPUT as the current chat session (the conversation you are in right now).\n\nINPUT\nYou will be given one of:\nA) The current chat session (default), or\nB) A pasted chat transcript / excerpt, or\nC) A chat summary.\n\nMISSION\nExtract ONLY durable operating rules, preferences, and “do/don’t” constraints that should govern future work.\n\nCRITICAL FILTER (prevents self-echo)\n- Ignore any text that is clearly a prompt/instruction block (including this prompt), system messages, tool specs, or schemas.\n- Only extract rules that are explicitly expressed as preferences/constraints about how work should be done.\n- Do not treat the existence of these instructions as a “rule”.\n\nHARD RULES\n- Do not invent rules.\n- Do not summarize the whole chat.\n- Do not infer private content.\n- If a rule is ambiguous, mark it Needs Review.\n- Preserve the user’s original wording as much as possible.\n- Prefer exact quotes when available.\n- No secrets: if you detect credentials/security info, output SECURITY_REVIEW and do not repeat the secret.\n\nOUTPUT (strict)\n## Extracted rules\nReturn a table:\n| Rule | Strength | Source evidence | Scope | Actionable enforcement | Status |\n|---|---|---|---|---|---|\n\nField requirements\n- Rule: one sentence, imperative (\"Do X\", \"Don’t do Y\").\n- Strength: Confirmed / Likely / Needs Review.\n- Source evidence: 1–3 short quotes from the chat (with timestamps if present).\n- Scope: where it applies (docs, routing, naming, databases, etc.).\n- Actionable enforcement: how to implement/check it (view, gate, default parent, checklist, etc.).\n- Status: New / Existing / Conflict.\n\n## Conflicts \u0026 duplicates\n- Conflicts: list any rules that contradict each other.\n- Duplicates: list rules that appear already present.\n\n## Suggested log entries (append-only)\nEmit 1–5 entries ready to paste into the \"Operating Exceptions + Preferences Log\":\n| Date | Type | Event / Trigger | What went wrong (or changed) | Correct behavior (rule) | Fix applied | Status |\n\nFAILURE MODE\nIf the input contains no durable rules, output:\nNO_RULES_FOUND: input contains no durable preferences/constraints.\n\nEND", "field": "Canonical Prompt Text (NO EDIT)", "img": "A sleek, futuristic AI brain interface hovering over glowing chat bubbles and document icons, extracting rule cards with checklists and tables, set against a clean, tech‑savvy workspace background.", "created": "2026-05-02", "tstat": "valid", "ai_rename": "🤖 | ORG | Extract Operating Rules", "naming_sugg": "🤖🧠 | SYS | Extract Operating Rules", "id": 6}, {"src": "Notion DB", "orig": "🗂️ | ORG | Rename Tool | Misroute Recovery", "name": "🗂️ | ORG | Rename Tool | Misroute Recovery", "changed": false, "untitled": false, "area": "SYS", "pack": "", "fmt": "Input Template", "status": "", "cx": "", "plat": [], "tags": [], "flag": "Needs Review", "fav": false, "desc": "Use this prompt set to classify, rename, sort, and write back Notion pages for routing and renaming tasks. Paste the page URL, current title, and a short description; the tool will suggest a target area, a clean canonical title, an appropriate sort order, and generate the database fields needed. Ideal for quickly organizing misrouted pages without manual editing.", "text": "Use this prompt "desc-only", "ai_rename": "🤖 | GEN | Session Report", "naming_sugg": "🤖✨ | GEN | Generate Session Report", "id": 11}, {"src": "Notion DB", "orig": "📋 | Structured Session Report + Notion Log", "name": "📋 | Structured Session Report + Notion Log", "changed": false, "untitled": false, "area": "ORG", "pack": "", "fmt": "Output Template", "status": "", "cx": "", "plat": [], "tags": ["Workflow Automation"], "flag": "", "fav": true, "desc": "Use this prompt to create a concise, factual structured session report that summarizes discussion points, decisions, action items, deliverables, project‑by‑project status, security notes, and a summary table, then log the report and a session‑log entry into the specified Notion databases. It expects a detailed session transcript as input and produces a multi‑section markdown report followed by a Notion logging confirmation.", "text": "🧭\nPurpose\nGenerate a concise, factual, structured session report from the full conversation, then log results into the specified Notion databases.\n\nIntegrity + safety constraints (non-negotiable)\n• Do not modify any local files, repository files, source code, configs, or project artifacts.\n• The only permitted write actions are creating/logging the requested summary and session-log entries in the specified Notion databases.\n• Use only known facts from the session. Do not guess. If information is missing, mark it as unclear and state what is missing.\n• Do not repeat plaintext secrets, API keys, tokens, passwords, or candidate secret values. If exposure occurred, describe risk without revealing values.\n• Distinguish clearly between:\n\n    1. Independently verified current state\n    2. Inherited claims from prior connector output that were not re-verified\nOutput structure (required)\n1) Overall Summary\nCover:\n• Total number of projects, repositories, or workstreams addressed\n• Major accomplishments\n• Highest-priority follow-up actions\n• Areas requiring human review before proceeding\n• Security-sensitive issues identified\n• Claims that remain unverified\n2) Report sections (use these exact headers)\nUse the following headers in this exact order:\n• Discussion Points\n• Decisions\n• Action Items\n• Deliverables\n• Project-by-Project Status Report\n• Security and Exposure Notes\n• Summary Table\nDiscussion Points\nSummarize main topics discussed, including:\n• dashboards\n• project taxonomy\n• Notion databases\n• secrets\n• blockers\n• audits\n• canonical mappings\n• DBX registration\n• code/dashboard governance issues\nDecisions\nList all explicit decisions made during the session, including:\n• project mappings\n• canonical sources\n• naming changes\n• deleted / created / registered Notion items\n• approved execution choices\n• slug normalization decisions\n• duplicate cleanup decisions\nAction Items\nCreate a prioritized action list. For each item include:FieldRequirementPriorityP0 / P1 / P2 (or equivalent)OwnerIf unknown, write unclearProject / workstreamBe explicitNext actionConcrete, runnable, checkableSuggested validationCommand, test, workflow, or verification step (when applicable)Human reviewState yes/no and what must be reviewed\nDeliverables\nList what was produced or changed during the session, including:\n• prompts drafted\n• audits and reports generated\n• tasks created or updated\n• Notion pages / databases / options changed\n• dashboards reviewed\n• canonical mappings resolved\n• DBX registrations completed\n• tables or status summaries produced\nProject-by-Project Status Report\nFor each project, repository, or workstream touched, include:\n1. Project / repo / workstream name\n2. Accomplishments\n    ◦ Completed changes with details\n    ◦ Specific files, scripts, pages, databases, or areas affected\n    ◦ Tests, builds, checks, or verification that passed\n3. Current progress and remaining tasks\n    ◦ Partially completed work\n    ◦ Open questions\n    ◦ Known blockers, bugs, risks, schema drift, or access issues\n4. Recommended next steps\n    ◦ Prioritized concrete actions\n    ◦ Commands, tests, workflow runs, or validation checks to perform\nMinimum workstreams to include\n• Secrets Dashboard / DB | Secrets Inventory\n• Active Sites / DB | Development Tasks (Tier 2) (CANON)\n• Jerri project slug audit / project taxonomy\n• Project Registry\n• Code Dashboard\n• OPS | Code Dashboard — LIVE\n• DOC | Code Dashboard — System\n• DB | Code Dashboard\n• DB | Code Dashboard Project Tag\n• DBX | Workspace Database Index\n• Recipe Tracker\n• SFT | Recipe Tracker\n• Phillies Wire\n• Prompt Lab\n• prompt-lab-source\n• scripts/notionDashboardUpdate.mjs\n• Quest Platform\n• ReadOut\n• Act Two / act-two / Act Two Catering\n• DB | Leads — Act Two Catering\n• DB | Quote Submissions — Act Two Catering\n• Any other touched repo, dashboard, page, database, or workflow\n\u003caside\u003e\n✅\nVerified findings to call out where applicable\n• catering -\u003e act-two is confirmed in Secrets Inventory\n• CANON includes Recipe Tracker, Quest Platform, and ReadOut\n• SFT | Recipe Tracker exists as a hub stub under HUB | Software Development\n• DBX contains the two Act Two child DB entries\n• Code Dashboard governance drift is confirmed\n• Code Dashboard Project Tag taxonomy drift is confirmed\n• Some Recipe Tracker secrets marked missing now contain plaintext candidate values in Notion row fields\n• NOTION_DATA_SOURCE_ID for Recipe Tracker is still missing\n• ReadOut canonical source is resolved via Project Registry\n• Quest Platform canonical source is resolved via Project Registry\n• The exact count of missing secrets may remain unverified unless independently recounted\n• Prior claims about file modifications should not be asserted unless independently verified\n\u003c/aside\u003e\nSecurity and Exposure Notes\nSeparately list:\n• plaintext secrets exposure risks\n• access-control issues\n• token / integration permission issues\n• operational rotation or cleanup actions required\nSummary Table\nProvide one compact Markdown table with 3 to 6 columns and concise labels. Include:\n• Project / workstream\n• Accomplished\n• Remaining / risks\n• Priority next step\n• Validation / check\nFinal required output block: renamed chat title\nAfter the report, output a second code block containing only a renamed chat title in this exact format:\n⚡📋 | Title Here\nTitle rules:\n• Exactly two relevant emojis\n• Includes a pipe character\n• Short, specific, descriptive\n• No extra explanation\nNotion logging requirements\nFinally, record the results in Notion:\n1. Record the structured summary to: [](https://www.notion.so/339255fc8f4480089394de8fbde167c1?pvs=21)\n2. Record the session log to: [](https://www.notion.so/347255fc8f448056bba2cdd14ea5ca29?pvs=21)\nBefore writing to Notion:\n• Inspect target database schemas if available.\n• Map fields conservatively.\n• Do not invent unsupported property names.\n• If schema is unclear, use the title/name field plus the most appropriate notes/body/content field available.\n• Include a concise logging confirmation at the end of the response, naming what was written and where.\n• If writing fails or schema access is unavailable, state what failed and provide the exact content to paste manually.", "field": "Exact Prompt Copy", "img": "A detailed, organized infographic visualizing a structured session report: include sections titled Overall Summary, Discussion Points, Decisions, Action Items, Deliverables, Project‑by‑Project Status Report, Security and Exposure Notes, and Summary Table; display 22 workstreams with icons, priority tags (P0‑P2), and placeholders for validation checks; use a clean, professional corporate style with neutral colors, clear headings, and a sidebar for security‑sensitive issues.", "created": "2026-04-29", "tstat": "valid", "ai_rename": "🤖 | REF | PROMPTS", "naming_sugg": "🤖🧠 | SYS | Generate Structured Session Report", "id": 12}, {"src": "Notion DB", "orig": "✍️ | FMT | Generate Next Action (Verb-First, One Sentence)", "name": "✍️ | FMT | Generate Next Action (Verb-First, One Sentence)", "changed": false, "untitled": false, "area": "SYS", "pack": "", "fmt": "Single Prompt", "status": "Active", "cx": "**", "plat": ["Notion AI", "Claude", "ChatGPT"], "tags": ["Task Automation"], "flag": "", "fav": false, "desc": "TBD — needs prompt content.", "text": "You are filling the \"Next Action\" property for a single row in the Tasks Tracker database (DB | Development Tasks (Tier 2) (CANON)).\n\nInput fields you may use:\n- Task name\n- Description\n- Text\n- Project\n- Task type\n- Effort level\n- Priority\n\nGoal: write a single next physical step.\n\nRules:\n- Output exactly ONE sentence.\n- Start with a verb.\n- Must be concrete and immediately actionable.\n- If a dependency is required first, make the dependency the verb (e.g. \"Ask X for Y\", \"Confirm Z\", \"Locate file A\").\n- Do not include dates unless explicitly present in the row.\n- If you truly cannot infer a next step, output exactly: NEEDS_INPUT\n\nReturn only the sentence. No bullets, no commentary.", "field": "Exact Prompt Copy", "img": "A sleek, modern digital workspace showing a Notion-like interface with a highlighted prompt titled “✍️ | FMT | Generate Next Action (Verb‑First, One Sentence)”, featuring a chat bubble icon, status tags (Active, Needs Review: No), and a calendar date, all rendered in a clean, minimalist style with soft pastel colors and subtle shadows.", "created": "2026-04-29", "tstat": "valid", "ai_rename": "🤖 | FMT | Generate Next Action", "naming_sugg": "🤖✍️ | FMT | Generate Next Action", "id": 13}, {"src": "Notion DB", "orig": "🤖🧾 | ADM | Audit Database | Development Tasks", "name": "🤖🧾 | ADM | Audit Database | Development Tasks", "changed": false, "untitled": false, "area": "ADMIN", "pack": "", "fmt": "Output Template", "status": "Active", "cx": "***", "plat": ["Notion AI", "Claude"], "tags": ["Database Evaluation"], "flag": "", "fav": false, "desc": "TBD — needs prompt content.", "text": "You are auditing t
