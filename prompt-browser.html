al", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "Enhance Engine — INTENT_POLICY", "area": "", "pack": "⚙️ Enhance Engine — modes", "fmt": "", "status": "", "cx": "", "plat": [], "tags": [], "flag": "", "fav": false, "desc": "", "text": "Preserve the user's original intent, subject, and scope exactly. Do not invent or assume a medium (email, blog, Notion, etc.), audience, or tone the user did not specify. If the prompt uses contextual references like \"the\", \"this\", or \"that\", keep them — do not replace with placeholders. Only add structure the prompt genuinely lacks. Shorter prompts are not automatically worse.", "img": "", "created": "", "id": 498, "orig": "Enhance Engine — INTENT_POLICY", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "Enhance Engine — buildSystemPrompt wrapper", "area": "", "pack": "⚙️ Enhance Engine — modes", "fmt": "", "status": "", "cx": "", "plat": [], "tags": [], "flag": "", "fav": false, "desc": "", "text": "You are an expert prompt engineer. ${INTENT_POLICY} ${modeObj.sys}\nReturn ONLY valid JSON, no markdown, no backticks:\n{\"enhanced\":\"...\",\"variants\":[{\"label\":\"...\",\"content\":\"...\"}],\"notes\":\"...\",\"assumptions\":[\"...\"],\"tags\":[\"...\"]}\nProduce 2 variants. In \"notes\", explain what you changed and why. In \"assumptions\", list anything you added that was not explicitly stated in the original prompt (medium, audience, tone, structure, constraints). If you added nothing, return an empty array. Available tags: ${tagList}.", "img": "", "created": "", "id": 499, "orig": "Enhance Engine — buildSystemPrompt wrapper", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "Lint fragment 1", "area": "", "pack": "🔧 Lint scaffolding (promptLint.js)", "fmt": "", "status": "", "cx": "", "plat": [], "tags": [], "flag": "" mpt-lab-source/ARCHITECTURE.md`\n\n## Guardrails\n\n- Do not hallucinate missing files, services, CI workflows, or production behavior.\n- Do not claim a feature is complete unless the code or docs prove it.\n- Do not collapse the extension, desktop, web app, and docs surfaces into one unless the repo actually does.\n- Do not overwrite unrelated local edits.\n- Do not touch `archives/` unless explicitly asked.\n- Do not widen scope from a targeted fix into a broad redesign unless requested.\n- If a file is dirty before your work, treat it as user-owned unless the task clearly requires editing it.\n\n## Output Rules\n\n- Be concise and execution-first.\n- Do not restate the request before acting.\n- Separate findings, applied changes, and verification.\n- Prefer one clear recommendation over several weak alternatives.\n- Use exact file paths, commands, and surfaces.\n- Mark inferences explicitly.\n\n## Verification Behavior\n\nStart with the smallest commands that establish truth for the current task, typically:\n\n- `git status --short --branch`\n- `rg` for the target feature or file\n- `sed -n` or similar targeted file reads\n- repo-local test/build commands only when relevant to the files changed\n\n## Default Priorities\n\n1. Preserve correctness across shared app, extension, desktop, web, and docs surfaces.\n2. Avoid regressions in provider flows, persistence, and prompt-authoring UX.\n3. Keep changes minimal, testable, and easy to verify.\n4. Document decisions when the repo shape or runtime behavior is non-obvious.", "img": "", "created": "", "id": 505, "orig": "Prompt Lab Agent (persona)", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "Ready-to-Paste Session Handoff Prompt", "area": "", "pack": "🧠 Operational / Agent / System", "fmt": "", "status": "", "cx": "", "plat": [], "tags": [], "flag": "", "fav": false, "desc": "", "text": "You are working in:\n/Users/daverobertson/Desktop/Code/10-active-projects/prompt-lab\n\nUse the current filesystem and git state as ground truth.\n\nRepo context:\n- Prompt Lab is a multi-surface prompt engineering product, not a markdown-only workspace.\n- Surfaces include:\n  - Chrome / Vivaldi MV3 extension\n  - Tauri desktop shell\n  - hosted web app\n  - public landing/docs\n- Live URLs:\n  - https://promptlab.tools/\n  - https://prompt-lab-tawny.vercel.app/app/\n\nInspect first:\n- /Users/daverobertson/Desktop/Code/10-active-projects/prompt-lab/AGENTS.md\n- /Users/daverobertson/Desktop/Code/10-active-projects/prompt-lab/PROMPT_LAB_AGENT.md\n- /Users/daverobertson/Desktop/Code/10-active-projects/prompt-lab/CURRENT_PROJECT_REPORT.md\n- /Users/daverobertson/Desktop/Code/10-active-projects/prompt-lab/prompt-lab-source/ARCHITECTURE.md\n\nCurrent dirty files already exist and should be treated as user-owned/in-progress unless the task explicitly targets them:\n- /Users/daverobertson/Desktop/Code/10-active-projects/prompt-lab/docs/index.html\n- /Users/daverobertson/Desktop/Code/10-active-projects/prompt-lab/prompt-lab-source/public/prompt-lab-landing.html\n\nCurrent likely focus:\n- finish or validate landing/docs alignment to promptlab.tools and the current Prompt Lab repo/app URLs\n- or address the known unresolved product issues:\n  - Create workflow still too vertically stacked\n  - experiments and run history still split\n\nGuardrails:\n- Do not restate the request before acting.\n- Do not overwrite unrelated local edits.\n- Do not touch archives/ unless explicitly asked.\n- Do not collapse extension, desktop, web app, and docs into one surface.\n- Use exact paths, commands, and verification.\n- Separate findings, edits, and verification.\n- Keep scope tight unless asked to expand it.\n\nFirst commands to run:\n- git -C /Users/daverobertson/Desktop/Code/10-active-projects/prompt-lab status --short --branch\n- git -C /Users/daverobertson/Desktop/Code/10-active-projects/prompt-lab diff --stat -- docs/index.html prompt-lab-source/public/prompt-lab-landing.html\n- sed -n '1,220p' /Users/daverobertson/Desktop/Code/10-active-projects/prompt-lab/AGENTS.md\n- sed -n '1,260p' /Users/daverobertson/Desktop/Code/10-active-projects/prompt-lab/prompt-lab-source/ARCHITECTURE.md\n\nThen:\n1. confirm the target surface\n2. inspect only the needed files\n3. implement or review\n4. verify narrowly\n5. return a short summary", "img": "", "created": "", "id": 506, "orig": "Ready-to-Paste Session Handoff Prompt", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "Prompt Lab Session Init", "area": "", "pack": "🧠 Operational / Agent / System", "fmt": "", "status": "", "cx": "", "plat": [], "tags": [], "flag": "", "fav": false, "desc": "", "text": "You are working in the Prompt Lab repo at:\n`/Users/daverobertson/Desktop/Code/10-active-projects/prompt-lab`\n\nRole:\n- Act as an execution-first engineering assistant for Prompt Lab.\n- Use the repo as ground truth.\n- Do not assume the repo is a single markdown/report workspace. It is a real product repo.\n\nCurrent Repo Shape:\n- Project rules: `AGENTS.md`\n- Root docs: `README.md`\n- Architecture: `prompt-lab-source/ARCHITECTURE.md`\n- Shared app + extension: `prompt-lab-source/prompt-lab-extension/`\n- Desktop shell: `prompt-lab-source/prompt-lab-desktop/`\n- Hosted web app + landing: `prompt-lab-source/prompt-lab-web/`\n- Public docs/static surface: `docs/`\n\nVerified Stack:\n- React\n- Vite\n- Chrome / Vivaldi MV3 extension\n- Tauri 2 desktop shell\n- Node 22\n- Vitest\n- Hosted web deployment with Vercel routing\n\nCurrent Known Dirty State:\n- `docs/index.html`\n- `prompt-lab-source/public/prompt-lab-landing.html`\n\nTreat those files as already modified before you begin. Do not revert unrelated edits.\n\nGuardrails:\n- Check the current filesystem before making claims.\n- Separate findings, edits, and verification.\n- Do not restate the request before acting.\n- Do not hallucinate missing files, scripts, or deployment behavior.\n- Do not touch `archives/` unless explicitly asked.\n- Do not widen a focused task into a repo-wide redesign.\n- If the task affects one surface only, keep the change scoped to that surface unless shared code clearly requires broader edits.\n\nPriority Order:\n1. Confirm target surface and relevant files.\n2. Inspect `git status --short --branch`.\n3. Read only the files needed for the task.\n4. Implement the smallest correct change.\n5. Run the narrowest relevant verification.\n6. Return a short summary with findings, changes, and verification.\n\nUseful Verification Commands:\n- `git -C /Users/daverobertson/Desktop/Code/10-active-projects/prompt-lab status --short --branch`\n- `sed -n '1,220p' /Users/daverobertson/Desktop/Code/10-active-projects/prompt-lab/AGENTS.md`\n- `sed -n '1,220p' /Users/daverobertson/Desktop/Code/10-active-projects/prompt-lab/prompt-lab-source/ARCHITECTURE.md`\n- `sed -n '1,220p' /Users/daverobertson/Desktop/Code/10-active-projects/prompt-lab/prompt-lab-source/package.json`\n\nTask Framing:\n- For implementation tasks: inspect first, then patch precisely.\n- For review tasks: findings first, ordered by severity, with file references.\n- For docs/tasks/prompts: make them repo-realistic and aligned to Prompt Lab’s actual product surfaces.\n\nOutput Rules:\n- Short by default.\n- Exact paths over vague references.\n- One clear recommendation if a choice is needed.\n- Clearly label assumptions.", "img": "", "created": "", "id": 507, "orig": "Prompt Lab Session Init", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "Prompt Lab Copilot Instructions", "area": "", "pack": "🧠 Operational / Agent / System", "fmt": "", "status": "", "cx": "", "plat": [], "tags": [], "flag": "", "fav": false, "desc": "", "text": "# Prompt Lab Copilot Instructions\n\n## Architecture Overview\n\nPrompt Lab is a multi-platform prompt engineering workbench with a shared React frontend deployed across three runtime shells:\n\n- **Chrome Extension (MV3)**: Side panel build using `chrome.runtime.sendMessage` for API calls\n- **Desktop App (Tauri 2)**: Native wrapper reusing the shared frontend with localStorage persistence\n- **Web App (Vercel)**: Hosted deployment with CORS proxy edge function at `/api/proxy`\n\nThe shared React application lives in `prompt-lab-source/prompt-lab-extension/src/` and is imported by all platforms. Platform-specific behavior is abstracted through `src/lib/platform.js`.\n\n## Key Components \u0026 Data Flow\n\n- **Providers**: 5 LLM providers (Anthropic, OpenAI, Gemini, OpenRouter, Ollama) abstracted through `src/lib/providers.js` and `src/lib/providerRegistry.js`\n- **Prompt Library**: Versioned prompts with collections, tags, and metadata stored in local browser storage via `src/hooks/usePromptLibrary.js`\n- **Experiment Store**: A/B testing and eval runs persisted to IndexedDB via `src/experimentStore.js`\n- **PII Engine**: Automatic scanning and redaction using `src/lib/piiEngine.js` before API calls\n- **Platform Adapters**: Extension uses `chrome.storage.local`, desktop uses localStorage, web uses proxy-aware fetch\n\n## Development Workflows\n\n### Extension Development\n```bash\ncd prompt-lab-source/prompt-lab-extension\nnpm install\nnpm run dev          # Vite dev server at localhost:5173\nnpm test             # Vitest + React Testing Library (52 tests)\nnpm run test:e2e     # Playwright smoke tests after build\nnpm run build        # Build to dist/ for Chrome loading\n```\n\n### Desktop Development\n```bash\ncd prompt-lab-source/prompt-lab-desktop\nnpm install\ncargo tauri dev      # Launch desktop app with hot reload\ncargo tauri build    # Cross-platform .app/.exe/.deb/.AppImage builds\n```\n\n### Web Development\n```bash\ncd prompt-lab-source/prompt-lab-web\nnpm install\nnpm run dev          # Vite dev server\nvercel dev           # Local proxy testing with /api/proxy\nnpm run build        # Multi-page build (landing + /app/)\n```\n\n## Project Conventions\n\n### Platform Detection\nUse `src/lib/platform.js` exports:\n- `isExtension` - true when running as Chrome extension\n- `VITE_WEB_MODE` - true for hosted web deployment\n- Platform-specific implementations in `src/lib/desktopApi.js` and `src/lib/proxyFetch.js`\n\n### State Management\n- Custom hooks in `src/hooks/` for complex state (library, editor, A/B tests)\n- Local storage via `src/lib/storage.js` with keys from `storageKeys`\n- Session state via `src/hooks/useSessionState.js` for temporary UI state\n\n### Prompt Schema\nPrompts follow `src/lib/promptSchema.js` with:\n- Version history (max 25 versions)\n- Collections and tags from `src/constants.js`\n- Golden responses for benchmarking\n- Import aliases: `prompt`→`enhanced`, `description`→`notes`, `category`→`collection`\n\n### Provider Integration\n- All provider calls go through `src/lib/platform.js` abstractions\n- API keys stored per-platform (extension: chrome.storage, desktop/web: localStorage)\n- Ollama requests bypass proxy, connect direct to localhost\n- Error handling via `src/errorTaxonomy.js`\n\n### UI Patterns\n- Dark/light theme detection via `src/hooks/useUiState.js`\n- Command palette with keyboard shortcuts (Cmd/Ctrl+K)\n- Toast notifications via `src/Toast.jsx`\n- Drag-and-drop for prompt composition and library reordering\n\n## Integration Points\n\n### External Dependencies\n- **Tauri 2**: Desktop shell with Rust backend\n- **Vercel Edge Functions**: CORS proxy for web deployment\n- **Provider APIs**: Direct calls with user-provided API keys\n- **Ollama**: Local LLM server integration\n\n### Cross-Component Communication\n- Hooks communicate via shared state and callbacks\n- Platform adapters provide consistent API across runtimes\n- Storage layer abstracts browser vs native persistence\n- Provider registry normalizes model parameters and responses\n\n## Testing \u0026 Validation\n\n- Unit tests: Vitest with React Testing Library\n- E2E tests: Playwright for extension smoke tests\n- CI: Separate workflows for extension and desktop builds\n- PII validation: Automatic scanning before provider calls\n- Schema validation: Runtime checks for prompt and experiment data\n\n## Key Files to Reference\n\n- `src/App.jsx` - Main application surface and tab routing\n- `src/lib/platform.js` - Platform abstraction layer\n- `src/hooks/usePromptLibrary.js` - Library state management\n- `src/lib/providers.js` - Provider API implementations\n- `src/lib/promptSchema.js` - Data structure definitions\n- `ARCHITECTURE.md` - Detailed platform and runtime architecture\n- `ROADMAP.md` - Current priorities and platform strategy", "img": "", "created": "", "id": 508, "orig": "Prompt Lab Copilot Instructions", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "Codex — Ghost Variables (Logic Layer)", "area": "", "pack": "🧠 Operational / Agent / System", "fmt": "", "status": "", "cx": "", "plat": [], "tags": [], "flag": "", "fav": false, "desc": "", "text": "## Prompt 1: Ghost Variables (Logic Layer)\n\n**Target files (modify only these):**\n- `prompt-lab-extension/src/promptUtils.js`\n- `prompt-lab-extension/src/hooks/usePromptEditor.js`\n\n**Do NOT modify:** `App.jsx`, `background.js`, `manifest.json`, `platform.js`, or any other file.\n\n### Context\n\nPrompt Lab has a template variable system. When a user loads a saved prompt containing\n`{{varName}}` placeholders, the app extracts the variable names, shows a form for the\nuser to fill in values, then substitutes them into the prompt text.\n\nCurrent flow in `usePromptEditor.js` (line 294):\n```javascript\nconst loadEntry = entry =\u003e {\n  const vars = extractVars(entry?.enhanced);\n  if (vars.length \u003e 0) {\n    setPendingTemplate(entry);\n    setVarVals(Object.fromEntries(vars.map(v =\u003e [v, ''])));\n    setShowVarForm(true);\n  } else {\n    applyEntry(entry);\n  }\n};\n```\n\n`extractVars` is in `promptUtils.js` (line 46):\n```javascript\nexport function extractVars(text) {\n  if (typeof text !== 'string') return [];\n  return [...new Set([...text.matchAll(/\\{\\{(\\w[\\w ]*)\\}\\}/g)].map(m =\u003e m[1]))];\n}\n```\n\n`applyTemplate` is in `usePromptEditor.js` (line 310):\n```javascript\nconst applyTemplate = () =\u003e {\n  if (!pendingTemplate) return;\n  let text = ensureString(pendingTemplate.enhanced);\n  Object.entries(varVals).forEach(([k, v]) =\u003e { text = text.replaceAll(`{{${k}}}`, v); });\n  applyEntry({ ...pendingTemplate, enhanced: text });\n  setShowVarForm(false); setPendingTemplate(null);\n};\n```\n\n### Task\n\nAdd \"ghost variables\" — built-in variable names that auto-resolve to dynamic values\nwithout requiring manual input. When a template contains only ghost variables, skip the\nform entirely and apply immediately. When it contains a mix, show the form with ghost\nvars pre-filled and manual vars empty.\n\n### Requirements\n\n**1. Add to `promptUtils.js` — new exports after `extractVars`:**\n\nAdd a resolver map with these 6 built-in ghost variables:\n\n| Name | Resolver |\n|------|----------|\n| `date` | `new Date().toLocaleDateString()` |\n| `time` | `new Date().toLocaleTimeString()` |\n| `datetime` | `new Date().toLocaleString()` |\n| `timestamp` | `new Date().toISOString()` |\n| `year` | `String(new Date().getFullYear())` |\n| `clipboard` | `navigator.clipboard.readText()` with try/catch returning `''` on failure |\n\nExport three new functions:\n\n- `isGhostVar(name)` — returns `true` if `name.toLowerCase().trim()` is a key in the resolver map\n- `resolveGhostVars(varNames)` — takes a `string[]`, returns `Promise\u003cRecord\u003cstring, string\u003e\u003e` with resolved values for each ghost var found. Non-ghost vars are skipped. Each resolver is individually try/caught (failure → empty string).\n- `GHOST_VAR_NAMES` — a constant array of the 6 resolver keys (for UI use)\n\nThe clipboard resolver must be `async` and use `navigator.clipboard.readText()`.\nIf the clipboard API throws or is unavailable, return `''` (empty string, not an error message).\n\n**2. Modify `loadEntry` in `usePromptEditor.js`:**\n\nMake `loadEntry` async. Split extracted vars into ghost vs manual:\n\n```\nconst ghostNames = vars.filter(isGhostVar);\nconst manualNames = vars.filter(v =\u003e !isGhostVar(v));\n```\n\nResolve ghost vars via `resolveGhostVars(ghostNames)`.\n\n- If ALL vars are ghost (`manualNames.length === 0`): apply the template immediately\n  using the resolved values — substitute each ghost var's value into the template text\n  via `.replaceAll()`, then call `applyEntry()`. Do NOT show the var form.\n  Clear `pendingTemplate` after applying.\n\n- If there are manual vars: set `varVals` with ghost vars pre-filled from resolved values\n  and manual vars initialized to `''`. Then show the var form as usual.\n\nImport `isGhostVar` and `resolveGhostVars` from `../promptUtils.js`.\n\n**3. Do NOT add a `registerGhostResolver()` function.** The registry is fixed.\nExtension-specific resolvers are out of scope.\n\n### Constraints\n\n- `loadEntry` callers use it as `onClick={() =\u003e loadEntry(entry)}`. Making it async\n  is safe — no caller consumes the return value.\n- Do not change the function signature of `applyTemplate()` — it still reads from\n  `varVals` state for the mixed (ghost + manual) case.\n- Do not modify `extractVars()` — it should still return ALL variable names including\n  ghost vars.\n- All 49 existing tests must pass after your changes (`npm test`).\n- Do not add new test files in this change.\n- Do not add console.log statements.\n- Use the existing `ensureString` import from `../lib/utils.js` when needed.\n\n### Verification\n\nAfter your changes, these scenarios should work:\n\n1. A template with `{{date}}` only → `loadEntry` resolves the date and applies\n   immediately without showing the var form.\n2. A template with `{{date}}` and `{{topic}}` → var form shows with date pre-filled\n   (today's date string) and topic empty.\n3. A template with `{{clipboard}}` when clipboard is inaccessible → resolves to `''`,\n   still applies or shows form normally.\n4. A template with no variables → `applyEntry()` called directly (unchanged behavior).\n5. A template with only manual vars like `{{context}}` → var form shows with empty\n   values (unchanged behavior).\n\n---", "img": "", "created": "", "id": 509, "orig": "Codex — Ghost Variables (Logic Layer)", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "Codex — Golden Response Benchmark (Schema + Logic Layer)", "area": "", "pack": "🧠 Operational / Agent / System", "fmt": "", "status": "", "cx": "", "plat": [], "tags": [], "flag": "", "fav": false, "desc": "", "text": "## Prompt 2: Golden Response Benchmark (Schema + Logic Layer)\n\n**Target files (modify only these):**\n- `prompt-lab-extension/src/lib/promptSchema.js`\n- `prompt-lab-extension/src/hooks/usePromptLibrary.js`\n- `prompt-lab-extension/src/promptUtils.js`\n\n**Do NOT modify:** `App.jsx`, `platform.js`, `providers.js`, or any other file.\n\n### Context\n\nPrompt Lab saves prompts to a library. Each entry is normalized through\n`normalizeEntry()` in `promptSchema.js` (line 204). The library hook\n`usePromptLibrary.js` provides CRUD operations. The app already has `wordDiff(a, b)`\nin `promptUtils.js` for comparing text.\n\nUsers iteratively refine prompts but have no way to pin a \"known good\" model output\nas a benchmark for future comparisons.\n\nCurrent entry schema (from `normalizeEntry`, line 204):\n```javascript\n{\n  id, title, original, enhanced, variants, notes, tags, collection,\n  createdAt, updatedAt, useCount, currentVersionId, versions, testCases, metadata\n}\n```\n\nThere is NO `goldenResponse` field currently.\n\nThe library hook (`usePromptLibrary.js`) exposes `updateLibraryEntry(id, updaterFn)`\nwhich takes an entry ID and an updater function that receives the current entry and\nreturns the updated entry.\n\n`encodeShare()` in `promptUtils.js` (line 51) whitelists specific fields for URL sharing:\n```javascript\nexport function encodeShare(entry) {\n  return btoa(unescape(encodeURIComponent(JSON.stringify({\n    title: entry.title, original: entry.original, enhanced: entry.enhanced,\n    variants: entry.variants, tags: entry.tags, notes: entry.notes,\n  }))));\n}\n```\n\n### Task\n\nAdd a `goldenResponse` field to the prompt entry schema and provide library hook\nmethods to pin and clear golden responses. Also add an n-gram similarity function\nfor comparing text.\n\n### Requirements\n\n**1. Add `goldenResponse` to `normalizeEntry()` in `promptSchema.js`:**\n\nAfter the `metadata` field in the return object, add:\n\n```javascript\ngoldenResponse: entry.goldenResponse ? {\n  text: ensureString(entry.goldenResponse.text).slice(0, 20000),\n  pinnedAt: entry.goldenResponse.pinnedAt || fallbackTs,\n  pinnedFromRunId: ensureString(entry.goldenResponse.pinnedFromRunId) || null,\n  provider: ensureString(entry.goldenResponse.provider),\n  model: ensureString(entry.goldenResponse.model),\n} : null,\n```\n\n- If `entry.goldenResponse` is falsy, default to `null`.\n- Text is capped at 20,000 characters.\n- `pinnedFromRunId` is nullable — it links to an eval run but may not always be set.\n- Use the existing `ensureString` helper already imported in that file.\n\n**2. Do NOT modify `getPromptSnapshot()`, `appendVersionSnapshot()`, or `restorePromptVersion()`.**\nGolden response is a prompt-level annotation, not a version-level one. Version snapshots\nshould not capture or restore goldenResponse.\n\n**3. Do NOT modify `encodeShare()`.** Share URLs should not include golden responses.\n\n**4. Add two methods to `usePromptLibrary.js`:**\n\nInside the `usePromptLibrary` hook, add:\n\n```javascript\nconst pinGoldenResponse = (entryId, { text, runId, provider, model }) =\u003e {\n  updateLibraryEntry(entryId, entry =\u003e ({\n    ...entry,\n    goldenResponse: {\n      text,\n      pinnedAt: new Date().toISOString(),\n      pinnedFromRunId: runId || null,\n      provider: provider || '',\n      model: model || '',\n    },\n    updatedAt: new Date().toISOString(),\n  }));\n  notify('Pinned as golden response');\n};\n\nconst clearGoldenResponse = (entryId) =\u003e {\n  updateLibraryEntry(entryId, entry =\u003e ({\n    ...entry,\n    goldenResponse: null,\n    updatedAt: new Date().toISOString(),\n  }));\n  notify('Golden response cleared');\n};\n```\n\nInclude both in the hook's return object alongside the existing methods.\n\n**5. Add `ngramSimilarity()` to `promptUtils.js`:**\n\nNew exported function:\n\n```javascript\nexport function ngramSimilarity(a, b, n = 3) {\n  if (!a || !b) return 0;\n  const ngrams = (str) =\u003e {\n    const words = str.toLowerCase().split(/\\s+/).filter(Boolean);\n    if (words.length \u003c n) return new Set([words.join(' ')]);\n    const set = new Set();\n    for (let i = 0; i \u003c= words.length - n; i++) {\n      set.add(words.slice(i, i + n).join(' '));\n    }\n    return set;\n  };\n  const setA = ngrams(a);\n  const setB = ngrams(b);\n  const intersection = new Set([...setA].filter(x =\u003e setB.has(x)));\n  const union = new Set([...setA, ...setB]);\n  return union.size === 0 ? 1 : intersection.size / union.size;\n}\n```\n\nReturns a float between 0.0 and 1.0. Identical texts return 1.0.\nEither input being empty/falsy returns 0.\n\n### Constraints\n\n- All 49 existing tests must pass after your changes (`npm test`).\n- Do not add new test files in this change.\n- Do not add console.log statements.\n- Do not modify `createPromptEntry()`, `updatePromptEntry()`, `restorePromptVersion()`,\n  `getPromptSnapshot()`, `appendVersionSnapshot()`, or `encodeShare()`.\n- `normalizeEntry()` is the ONLY place the schema shape is defined — that's where\n  `goldenResponse` goes.\n- The `updateLibraryEntry` function is already available in the hook scope — do not\n  re-implement it.\n\n### Verification\n\nAfter your changes:\n\n1. `normalizeEntry({})` → returns object with `goldenResponse: null`\n2. `normalizeEntry({ goldenResponse: { text: 'good output', provider: 'anthropic', model: 'claude-sonnet-4-20250514' } })` → returns normalized goldenResponse with pinnedAt timestamp\n3. `normalizeEntry({ goldenResponse: { text: 'x'.repeat(30000) } })` → text truncated to 20,000 chars\n4. `ngramSimilarity('the quick brown fox', 'the quick brown fox')` → `1.0`\n5. `ngramSimilarity('the quick brown fox', 'a slow red dog')` → value between 0.0 and 1.0\n6. `ngramSimilarity('', 'hello')` → `0`\n7. `ngramSimilarity('short', 'short')` → `1.0` (falls back to single-ngram when words \u003c n)\n8. Existing library export/import continues to work — golden responses included in export, restored on import\n9. Share URLs do NOT include golden response data\n10. Version restore does NOT alter the golden response on the entry", "img": "", "created": "", "id": 510, "orig": "Codex — Golden Response Benchmark (Schema + Logic Layer)", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}, {"src": "Local Code", "name": "Codex — App.jsx UI Wiring (Ghost Vars + Golden Response)", "area": "", "pack": "🧠 Operational / Agent / System", "fmt": "", "status": "", "cx": "", "plat": [], "tags": [], "flag": "", "fav": false, "desc": "", "text": "# Codex Prompt: App.jsx UI Wiring for Ghost Variables + Golden Response\n\n**Target file (modify only this):**\n- `prompt-lab-extension/src/App.jsx`\n\n**Do NOT modify:** any hooks, utilities, schema files, or other components.\n\n## Context\n\nTwo data-layer features have been implemented and verified:\n\n1. **Ghost Variables** — `isGhostVar()` and `resolveGhostVars()` exist in `promptUtils.js`.\n   The `loadEntry()` hook in `usePromptEditor.js` already resolves ghost vars and\n   pre-fills `varVals` with their values. The var form modal in App.jsx (line 613)\n   currently renders all variables identically — ghost vars need a visual indicator.\n\n2. **Golden Response** — `pinGoldenResponse()` and `clearGoldenResponse()` exist on\n   the library hook. `ngramSimilarity()` exists in `promptUtils.js`. `wordDiff()` is\n   already imported and used. The prompt schema now includes `goldenResponse` on\n   library entries. The UI needs pin buttons and a comparison panel.\n\n## Current App.jsx Structure (relevant sections)\n\n**Imports (line 1–18):**\n```javascript\nimport { wordDiff, scorePrompt, extractVars, looksSensitive } from './promptUtils';\nimport useLibrary from './hooks/usePromptLibrary.js';\n```\n\n**Hook destructuring (line 46–72):**\n```javascript\nconst lib = useLibrary(notify);\nconst ed = usePromptEditor(ui, lib);\nconst {\n  // ...existing destructured values...\n  varVals, setVarVals, showVarForm, setShowVarForm, pendingTemplate, applyTemplate,\n  enhance, doSave, clearEditor, openSavePanel, openOptions, copy,\n  loadEntry, addToComposer,\n  editingId, enhanced, showDiff, evalRuns, showEvalHistory,\n} = ed;\n```\n\n**Var form modal (lines 613–636):**\nRenders a modal with inputs for each key in `varVals`. All vars look identical.\n\n**Enhanced output section (lines 287–307):**\nShows the enhanced text with Show Diff / Copy buttons in the header.\n\n**Eval history section (lines 334–368):**\nCollapsible panel showing eval runs with provider, model, latency, and copy button.\n\n## Task\n\n### Part 1: Ghost Variable Badges\n\n**1a. Add import:**\nAdd `isGhostVar` to the existing import from `'./promptUtils'` (line 4):\n```javascript\nimport {\n  wordDiff, scorePrompt, extractVars,\n  looksSensitive, isGhostVar,\n} from './promptUtils';\n```\n\n**1b. Update var form (line 622–627):**\nFor each variable in the form, check `isGhostVar(k)`. If true, add a small\n`(auto)` badge next to the label. The pre-filled value is already in `varVals[k]`\nfrom the hook — no logic changes needed, just visual.\n\nCurrent:\n```jsx\n{Object.keys(varVals).map(k =\u003e (\n  \u003cdiv key={k}\u003e\n    \u003clabel className=\"text-xs font-mono font-semibold text-violet-400 block mb-1\"\u003e{`{{${k}}}`}\u003c/label\u003e\n    \u003cinput className={`w-full ${m.input} border rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-violet-500 ${m.text}`}\n      placeholder={`Value for ${k}…`} value={varVals[k]} onChange={e =\u003e setVarVals(p =\u003e ({ ...p, [k]: e.target.value }))} /\u003e\n  \u003c/div\u003e\n))}\n```\n\nChange to:\n```jsx\n{Object.keys(varVals).map(k =\u003e (\n  \u003cdiv key={k}\u003e\n    \u003clabel className=\"text-xs font-mono font-semibold text-violet-400 block mb-1\"\u003e\n      {`{{${k}}}`}\n      {isGhostVar(k) \u0026\u0026 \u003cspan className=\"ml-1.5 text-emerald-400 font-sans text-[10px] font-normal\"\u003e(auto)\u003c/span\u003e}\n    \u003c/label\u003e\n    \u003cinput className={`w-full ${m.input} border rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-violet-500 ${m.text}`}\n      placeholder={isGhostVar(k) ? `Auto-filled · editable` : `Value for ${k}…`}\n      value={varVals[k]} onChange={e =\u003e setVarVals(p =\u003e ({ ...p, [k]: e.target.value }))} /\u003e\n  \u003c/div\u003e\n))}\n```\n\n### Part 2: Golden Response UI\n\n**2a. Add imports:**\nAdd `ngramSimilarity` to the `promptUtils` import (line 4):\n```javascript\nimport {\n  wordDiff, scorePrompt, extractVars,\n  looksSensitive, isGhostVar, ngramSimilarity,\n} from './promptUtils';\n```\n\n**2b. Add state for golden comparison toggle (after line 72):**\n```javascript\nconst [showGoldenCompare, setShowGoldenCompare] = useState(false);\n```\n\nAdd `useState` is already imported on line 1.\n\n**2c. Derive the current entry's golden response (after existing derived values ~line 75):**\n```javascript\nconst currentEntry = editingId ? lib.library.find(e =\u003e e.id === editingId) : null;\nconst goldenResponse = currentEntry?.goldenResponse || null;\n```\n\n**2d. Add \"Pin as Golden\" button to enhanced output header (line 291):**\n\nIn the enhanced section header (line 289–296), add a pin button between the\nexisting buttons. Only show when `editingId` is set and `enhanced` has content:\n\nCurrent header buttons area:\n```jsx\n\u003cdiv className={`flex items-center gap-3 ${compact ? 'flex-wrap justify-end' : ''}`}\u003e\n  \u003cbutton onClick={() =\u003e setShowDiff(p =\u003e !p)} ...\u003eShow Diff\u003c/button\u003e\n  \u003cbutton onClick={() =\u003e copy(enhanced)} ...\u003eCopy\u003c/button\u003e\n\u003c/div\u003e\n```\n\nAdd after the Copy button:\n```jsx\n{editingId \u0026\u0026 (\n  \u003cbutton onClick={() =\u003e lib.pinGoldenResponse(editingId, { text: enhanced })}\n    className={`flex items-center gap-1 text-xs ${m.textSub} hover:text-amber-400 transition-colors`}\n    title=\"Pin current output as golden response\"\u003e\n    \u003cIc n=\"Star\" size={10} /\u003ePin Golden\n  \u003c/button\u003e\n)}\n```\n\n**2e. Add \"Pin as Golden\" button to each eval run row (line 343–361):**\n\nInside the eval run card, after the existing copy button (line 356–359), add:\n\n```jsx\n{editingId \u0026\u0026 run.output \u0026\u0026 (\n  \u003cbutton onClick={() =\u003e lib.pinGoldenResponse(editingId, {\n    text: run.output,\n    runId: run.id,\n    provider: run.provider,\n    model: run.model,\n  })}\n    className={`mt-1 flex items-center gap-1 ${m.textSub} hover:text-amber-400 transition-colors`}\u003e\n    \u003cIc n=\"Star\" size={10} /\u003ePin as Golden\n  \u003c/button\u003e\n)}\n```\n\n**2f. Add Golden Response comparison panel (after line 368, after eval history closes):**\n\nAfter the eval history `\u003c/div\u003e` (the one closing the surface container on line 368),\nadd a new collapsible section. Only render when `goldenResponse` exists:\n\n```jsx\n{goldenResponse \u0026\u0026 (\n  \u003cdiv className={`${m.surface} border ${m.border} rounded-lg`}\u003e\n    \u003cbutton onClick={() =\u003e setShowGoldenCompare(p =\u003e !p)}\n      className={`w-full flex justify-between items-center px-3 py-2 text-xs font-semibold text-amber-400 uppercase tracking-wider`}\u003e\n      \u003cspan className=\"flex items-center gap-1.5\"\u003e\u003cIc n=\"Star\" size={10} /\u003eGolden Response\u003c/span\u003e\n      \u003cIc n={showGoldenCompare ? 'ChevronUp' : 'ChevronDown'} size={10} /\u003e\n    \u003c/button\u003e\n    {showGoldenCompare \u0026\u0026 (\n      \u003cdiv className=\"px-3 pb-3 flex flex-col gap-2\"\u003e\n        {enhanced \u0026\u0026 (\n          \u003cdiv className=\"flex items-center gap-3\"\u003e\n            \u003cspan className={`text-xs ${m.textMuted}`}\u003e\n              Similarity: {Math.round(ngramSimilarity(enhanced, goldenResponse.text) * 100)}%\n            \u003c/span\u003e\n            \u003cdiv className=\"flex-1 h-1.5 rounded-full bg-gray-700 overflow-hidden\"\u003e\n              \u003cdiv className=\"h-full bg-amber-400 rounded-full transition-all\"\n                style={{ width: `${Math.round(ngramSimilarity(enhanced, goldenResponse.text) * 100)}%` }} /\u003e\n            \u003c/div\u003e\n          \u003c/div\u003e\n        )}\n        \u003cdiv className={`${m.codeBlock} border ${m.border} rounded-lg p-3 text-sm leading-loose max-h-48 overflow-y-auto`}\u003e\n          {enhanced ? (\n            wordDiff(goldenResponse.text, enhanced).map((d, i) =\u003e (\n              \u003cspan key={i} className={`${d.t === 'add' ? m.diffAdd : d.t === 'del' ? m.diffDel : m.diffEq} px-0.5 rounded mr-0.5`}\u003e{d.v}\u003c/span\u003e\n            ))\n          ) : (\n            \u003cp className={`text-xs ${m.textAlt}`}\u003e{goldenResponse.text.slice(0, 500)}{goldenResponse.text.length \u003e 500 ? '…' : ''}\u003c/p\u003e\n          )}\n        \u003c/div\u003e\n        \u003cdiv className=\"flex items-center justify-between\"\u003e\n          \u003cspan className={`text-xs ${m.textMuted}`}\u003e\n            Pinned {new Date(goldenResponse.pinnedAt).toLocaleDateString()}\n            {goldenResponse.provider \u0026\u0026 ` · ${goldenResponse.provider}`}\n            {goldenResponse.model \u0026\u0026 ` ${goldenResponse.model}`}\n          \u003c/span\u003e\n          \u003cbutton onClick={() =\u003e lib.clearGoldenResponse(editingId)}\n            className={`text-xs ${m.textSub} hover:text-red-400 transition-colors`}\u003e\n            Clear Golden\n          \u003c/button\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n    )}\n  \u003c/div\u003e\n)}\n```\n\n## Constraints\n\n- Do NOT modify any hook files, utility files, or schema files\n- Do NOT add new component files — all changes are inline in App.jsx\n- Do NOT change any existing behavior — this is purely additive UI\n- The `lib` object already exposes `pinGoldenResponse` and `clearGoldenResponse` —\n  just call them. Check `usePromptLibrary.js` line 234 if needed.\n- The `Ic` component (lucide icons) is already imported. Use icon names like\n  `\"Star\"`, `\"Copy\"`, `\"ChevronUp\"`, `\"ChevronDown\"` — these are already used elsewhere.\n- Do NOT compute `ngramSimilarity` twice — if you need the value in both the percentage\n  text and the progress bar, compute it once and store in a variable.\n- Maintain the existing code style: Tailwind classes, `${m.xxx}` theme tokens,\n  single-line JSX where the existing code uses it.\n- All 49 existing tests must still pass.\n\n## Verification\n\nAfter your changes:\n\n1. Load a template with `{{date}}` and `{{topic}}` — var form shows `{{date}}` with\n   `(auto)` badge and pre-filled value, `{{topic}}` with no badge and empty input\n2. In the editor with `editingId` set and enhanced output showing — \"Pin Golden\" button\n   visible next to Copy in the enhanced header\n3. Click \"Pin Golden\" — toast says \"Pinned as golden response\"\n4. Golden Response section appears below eval history with amber star icon\n5. Expand it — shows similarity percentage with progress bar, word diff of golden\n   vs current enhanced, pinned date, and \"Clear Golden\" button\n6. Click \"Clear Golden\" — section disappears, toast confirms\n7. In eval history, each run row shows \"Pin as Golden\" button when `editingId` is set\n8. Click pin on an eval run — golden response set with that run's output, provider, model\n9. No `editingId` set — no pin buttons visible anywhere", "img": "", "created": "", "id": 511, "orig": "Codex — App.jsx UI Wiring (Ghost Vars + Golden Response)", "changed": false, "untitled": false, "tstat": "valid", "field": "local", "ai_rename": "", "naming_sugg": ""}]</script>
<script>
const DATA = JSON.parse(document.getElementById('prompt-data').textContent);
const PREVIEW = 320;
const BAD = new Set(['empty','placeholder','missing-core','desc-only']);
const TLABEL = {valid:'valid',short:'short',"desc-only":'description-only',placeholder:'placeholder text','missing-core':'missing core','empty':'empty'};
const esc = s => (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
const STORE = {state:'promptBrowser.state.v1',views:'promptBrowser.views.v1',recent:'promptBrowser.recent.v1',review:'promptBrowser.review.v1',fill:'promptBrowser.fillValues.v1'};
const DEFAULT_STATE = {q:'',src:'',area:'',pack:'',fmt:'',status:'',plat:'',tstat:'',sort:'name',fav:false,flag:false,bad:false,ren:false,img:false,review:false};
const FILTERS = [['f-src','src'],['f-area','area'],['f-pack','pack'],['f-fmt','fmt'],['f-status','status'],['f-plat','plat'],['f-tstat','tstat'],['sort','sort']];
const TOGGLES = [['t-fav','fav'],['t-flag','flag'],['t-bad','bad'],['t-ren','ren'],['t-img','img'],['t-review','review']];
const state = {...DEFAULT_STATE};
function readStore(key,fallback){ try{ const raw=localStorage.getItem(key); return raw?JSON.parse(raw):fallback; }catch(e){ return fallback; } }
function writeStore(key,value){ try{ localStorage.setItem(key,JSON.stringify(value)); }catch(e){} }
const reviewIds = new Set(readStore(STORE.review,[]).map(String));
const fillState = {id:null,values:{}};
let fillValues = readStore(STORE.fill,{});
function cleanState(input){ const next={...DEFAULT_STATE}; Object.keys(DEFAULT_STATE).forEach(k=>{ if(input&&Object.prototype.hasOwnProperty.call(input,k))next[k]=typeof DEFAULT_STATE[k]==='boolean'?!!input[k]:(input[k]||''); }); return next; }
function captureState(){ return cleanState(state); }
function uniq(key){ const s=new Set();
  DATA.forEach(d=>{ const v=d[key]; if(Array.isArray(v))v.forEach(x=>x&&s.add(x)); else if(v)s.add(v); });
  return [...s].sort((a,b)=>a.localeCompare(b)); }
function fillSel(id,label,key){ const sel=$(id); sel.innerHTML='<option value="">'+label+': all</option>'+
  uniq(key).map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join(''); }
fillSel('f-src','Source','src'); fillSel('f-area','Area','area'); fillSel('f-pack','Pack','pack');
fillSel('f-fmt','Format','fmt'); fillSel('f-status','Status','status'); fillSel('f-plat','Platform','plat');
fillSel('f-tstat','Text','tstat');
function syncControls(){
  $('q').value=state.q||'';
  FILTERS.forEach(([id,k])=>{ const el=$(id); if(el)el.value=state[k]||DEFAULT_STATE[k]||''; });
  TOGGLES.forEach(([id,k])=>{ const el=$(id); if(!el)return; el.classList.toggle('on',!!state[k]); const input=el.querySelector('input'); if(input)input.checked=!!state[k]; });
}
function applyState(next){ Object.assign(state,cleanState(next)); syncControls(); render(); }
function savedViews(){ return readStore(STORE.views,[]).filter(v=>v&&v.name&&v.state); }
function saveViews(views){ writeStore(STORE.views,views.slice(0,30)); }
function renderSavedViews(selected=''){
  const views=savedViews().sort((a,b)=>a.name.localeCompare(b.name));
  $('saved-view').innerHTML='<option value="">Saved views</option>'+views.map(v=>'<option value="'+esc(v.name)+'">'+esc(v.name)+'</option>').join('');
  $('saved-view').value=selected&&views.some(v=>v.name===selected)?selected:'';
}
function saveCurrentView(){
  const seed=state.q||state.area||state.pack||'My view';
  const name=(prompt('Save current filters as:',seed)||'').trim();
  if(!name)return;
  const views=savedViews().filter(v=>v.name!==name);
  views.push({name,state:captureState(),updatedAt:new Date().toISOString()});
  saveViews(views); renderSavedViews(name); flash($('save-view'),'Saved');
}
function deleteCurrentView(){
  const name=$('saved-view').value;
  if(!name)return;
  if(!confirm('Delete saved view "'+name+'"?'))return;
  saveViews(savedViews().filter(v=>v.name!==name)); renderSavedViews(); flash($('delete-view'),'Deleted');
}
function recentCopies(){ return readStore(STORE.recent,[]).filter(v=>v&&v.name); }
function renderRecentCopies(){
  const recent=recentCopies();
  $('recent-copy').innerHTML='<option value="">Recent copies</option>'+recent.map(v=>'<option value="'+esc(v.name)+'">'+esc(v.name)+'</option>').join('');
}
function stateBackup(){
  writeStore(STORE.state,captureState());
  return {app:'prompt-browser',version:1,exportedAt:new Date().toISOString(),data:{
    state:captureState(),views:savedViews(),recent:recentCopies(),review:[...reviewIds],fill:fillValues
  }};
}
function downloadJson(name,payload){
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=name; a.click(); URL.revokeObjectURL(url);
}
function normalizeViews(input){
  return (Array.isArray(input)?input:[]).filter(v=>v&&v.name&&v.state).map(v=>({name:String(v.name).slice(0,80),state:cleanState(v.state),updatedAt:v.updatedAt||new Date().toISOString()})).slice(0,30);
}
function normalizeRecent(input){
  return (Array.isArray(input)?input:[]).filter(v=>v&&v.name).map(v=>({id:Number.isFinite(+v.id)?+v.id:null,name:String(v.name).slice(0,160),at:v.at||new Date().toISOString()})).slice(0,10);
}
function normalizeReview(input){
  const valid=new Set(DATA.map(d=>String(d.id)));
  return [...new Set((Array.isArray(input)?input:[]).map(String).filter(id=>valid.has(id)))];
}
function normalizeFill(input){
  const out={};
  if(input&&typeof input==='object'&&!Array.isArray(input))Object.keys(input).forEach(k=>{ const key=fillKey(k); const val=String(input[k]??'').slice(0,5000); if(key&&val)out[key]=val; });
  return out;
}
function restoreBackup(text){
  const parsed=JSON.parse(text), data=parsed&&parsed.data?parsed.data:parsed;
  if(!data||typeof data!=='object')throw new Error('State file does not contain an object.');
  const nextState=cleanState(data.state||DEFAULT_STATE), views=normalizeViews(data.views), recent=normalizeRecent(data.recent), review=normalizeReview(data.review), fill=normalizeFill(data.fill);
  saveViews(views); writeStore(STORE.recent,recent); writeStore(STORE.review,review); writeStore(STORE.fill,fill);
  reviewIds.clear(); review.forEach(id=>reviewIds.add(id));
  fillValues=fill; fillState.id=null; fillState.values={};
  renderSavedViews(); renderRecentCopies(); applyState(nextState);
  return {views:views.length,recent:recent.length,review:review.length,fill:Object.keys(fill).length};
}
function exportLocalState(){
  downloadJson('prompt-browser-state-'+new Date().toISOString().slice(0,10)+'.json',stateBackup());
  flash($('export-state'),'Exported');
}
async function importLocalState(file){
  const text=await file.text();
  const summary=restoreBackup(text);
  flash($('import-state'),'Imported');
  alert('Imported state: '+summary.views+' saved views, '+summary.review+' review items, '+summary.fill+' fill values.');
}
function addRecentCopy(d){
  if(!d||!d.name)return;
  const item={id:d.id,name:d.name,at:new Date().toISOString()};
  const recent=[item,...recentCopies().filter(v=>v.name!==item.name)].slice(0,10);
  writeStore(STORE.recent,recent); renderRecentCopies();
}
function regexEsc(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function queryTerms(){ return [...new Set((state.q||'').toLowerCase().split(/\s+/).map(t=>t.trim()).filter(Boolean))]; }
function searchFields(d){ return [d.name,d.orig,(d.tags||[]).join(' '),d.pack,d.area,d.fmt,d.src,d.desc,d.text,d.img].filter(Boolean); }
function searchScore(d,terms){
  if(!terms.length)return 0;
  const fields=[
    [d.name,120],[d.orig,75],[(d.tags||[]).join(' '),95],[d.pack,70],[d.area,65],
    [d.fmt,48],[d.src,36],[d.desc,32],[d.text,12],[d.img,6]
  ];
  let score=0;
  terms.forEach(term=>{
    fields.forEach(([value,weight])=>{
      const hay=String(value||'').toLowerCase();
      if(!hay.includes(term))return;
      score+=weight;
      if(hay.startsWith(term))score+=Math.round(weight*.35);
      if(new RegExp('(^|\\W)'+regexEsc(term)+'(\\W|$)','i').test(hay))score+=Math.round(weight*.22);
    });
  });
  if(d.fav)score+=8;
  if(d.flag)score-=3;
  return score;
}
function hi(value,terms){
  const s=String(value||'');
  if(!terms.length)return esc(s);
  const re=new RegExp(terms.slice().sort((a,b)=>b.length-a.length).map(regexEsc).join('|'),'ig');
  let out='',last=0,match;
  while((match=re.exec(s))){
    out+=esc(s.slice(last,match.index))+'<mark class="hit">'+esc(match[0])+'</mark>';
    last=match.index+match[0].length;
  }
  return out+esc(s.slice(last));
}
function fillKey(label){ return String(label||'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,64)||'value'; }
function cleanLabel(label){ return String(label||'value').replace(/^insert\s+/i,'').replace(/^paste\s+/i,'').trim()||'value'; }
function addPlaceholder(map,token,label){
  const clean=cleanLabel(label);
  const key=fillKey(clean);
  if(!map.has(token))map.set(token,{token,label:clean,key});
}
function extractPlaceholders(text){
  const map=new Map(), s=String(text||'');
  let m;
  const curly=/\{\{\s*([^{}\n]{1,60})\s*\}\}/g;
  while((m=curly.exec(s)))addPlaceholder(map,m[0],m[1]);
  const angle=/<\s*([A-Z][A-Z0-9_ -]{1,50})\s*>/g;
  while((m=angle.exec(s)))addPlaceholder(map,m[0],m[1]);
  const bracket=/\[(Insert|Paste|Provide|Enter|Add|Describe|List|Your)[^\]\n]{1,70}\]/gi;
  while((m=bracket.exec(s)))addPlaceholder(map,m[0],m[0].slice(1,-1));
  return [...map.values()];
}
function valuesForPlaceholders(placeholders){
  const values={};
  placeholders.forEach(p=>{ values[p.key]=fillState.values[p.key]??fillValues[p.key]??''; });
  return values;
}
function saveFillValues(values){
  fillValues={...fillValues,...values};
  Object.keys(fillValues).forEach(k=>{ if(!fillValues[k])delete fillValues[k]; });
  writeStore(STORE.fill,fillValues);
}
function applyFill(text,placeholders,values){
  let out=String(text||'');
  placeholders.forEach(p=>{ const v=values[p.key]; if(v)out=out.split(p.token).join(v); });
  return out;
}
function renderFillPanel(d){
  const placeholders=extractPlaceholders(d.text);
  const values=valuesForPlaceholders(placeholders);
  const filled=applyFill(d.text,placeholders,values);
  const fields=placeholders.map(p=>'<div class="fillfield"><label for="fill-'+d.id+'-'+esc(p.key)+'">'+esc(p.label)+'</label><input id="fill-'+d.id+'-'+esc(p.key)+'" data-fill-input="'+esc(p.key)+'" value="'+esc(values[p.key])+'" placeholder="'+esc(p.token)+'"></div>').join('');
  return '<div class="fillpanel" data-fill-panel="'+d.id+'">'
    +'<div class="fillgrid">'+fields+'</div>'
    +'<div class="fillactions"><button class="copy" data-copy-filled="'+d.id+'">Copy Filled</button><button class="mini" data-close-fill="'+d.id+'">Close</button><span class="fillnote">'+placeholders.length+' field'+(placeholders.length===1?'':'s')+'</span></div>'
    +'<pre class="body" data-fill-preview="'+d.id+'">'+esc(filled)+'</pre>'
    +'</div>';
}
function startFill(d){
  if(fillState.id===d.id){ fillState.id=null; fillState.values={}; render(); return; }
  const values={};
  extractPlaceholders(d.text).forEach(p=>{ values[p.key]=fillValues[p.key]||''; });
  fillState.id=d.id; fillState.values=values; render();
}
function updateFillFromInputs(id){
  const panel=document.querySelector('[data-fill-panel="'+id+'"]');
  if(!panel)return fillState.values;
  const values={};
  panel.querySelectorAll('[data-fill-input]').forEach(input=>{ values[input.dataset.fillInput]=input.value; });
  fillState.values=values; saveFillValues(values);
  const d=DATA[+id], placeholders=extractPlaceholders(d.text), preview=panel.querySelector('[data-fill-preview]');
  if(preview)preview.textContent=applyFill(d.text,placeholders,values);
  return values;
}
function copyFilled(id,btn){
  const d=DATA[+id], placeholders=extractPlaceholders(d.text), values=updateFillFromInputs(id);
  doCopy(applyFill(d.text,placeholders,values),btn,{...d,name:d.name+' filled'});
}
function reviewKey(d){ return String(d&&d.id); }
function isReview(d){ return reviewIds.has(reviewKey(d)); }
function saveReviewIds(){ writeStore(STORE.review,[...reviewIds]); updateReviewCount(); }
function updateReviewCount(){ const el=$('review-count'); if(el)el.textContent=reviewIds.size?'('+reviewIds.size+')':''; }
function markReview(d){ if(!d)return; reviewIds.add(reviewKey(d)); saveReviewIds(); render(); }
function clearReview(d){ if(!d)return; reviewIds.delete(reviewKey(d)); saveReviewIds(); render(); }
function match(d){
  const held=isReview(d);
  if(state.review){ if(!held)return false; }
  else if(held)return false;
  if(state.src&&d.src!==state.src)return false;
  if(state.area&&d.area!==state.area)return false;
  if(state.pack&&d.pack!==state.pack)return false;
  if(state.fmt&&d.fmt!==state.fmt)return false;
  if(state.status&&d.status!==state.status)return false;
  if(state.plat&&!(d.plat||[]).includes(state.plat))return false;
  if(state.tstat&&d.tstat!==state.tstat)return false;
  if(state.fav&&!d.fav)return false;
  if(state.flag&&!d.flag)return false;
  if(state.bad&&!BAD.has(d.tstat))return false;
  if(state.ren&&!d.changed)return false;
  if(state.img&&!d.img)return false;
  const terms=queryTerms();
  if(terms.length){ const h=searchFields(d).join(' ').toLowerCase();
    for(const t of terms) if(t&&!h.includes(t))return false; }
  return true;
}
function sortFn(a,b){ const s=state.sort;
  if(s==='created')return (b.created||'').localeCompare(a.created||'');
  if(s==='len')return b.text.length-a.text.length;
  if(s==='tstat')return (a.tstat||'').localeCompare(b.tstat||'')||a.name.localeCompare(b.name);
  if(s==='area')return (a.area||'~').localeCompare(b.area||'~')||a.name.localeCompare(b.name);
  if(s==='pack')return (a.pack||'~').localeCompare(b.pack||'~')||a.name.localeCompare(b.name);
  return a.name.localeCompare(b.name);
}
function card(d,terms=[]){
  const held=isReview(d);
  const long=d.text.length>PREVIEW;
  const prevRaw=long?d.text.slice(0,PREVIEW)+'…':(d.text?d.text:'(no prompt text)');
  const prev=hi(prevRaw,terms);
  let bd='<span class="b src">'+hi(d.src,terms)+'</span>';
  if(held)bd+='<span class="b flag">☑ review</span>';
  if(d.tstat&&d.tstat!=='valid'){ const cls=BAD.has(d.tstat)&&d.tstat!=='desc-only'?'tred':'tamber';
    bd+='<span class="b '+cls+'">'+esc(TLABEL[d.tstat]||d.tstat)+'</span>'; }
  if(d.area)bd+='<span class="b area click" data-filter="area" data-val="'+esc(d.area)+'">'+hi(d.area,terms)+'</span>';
  if(d.pack)bd+='<span class="b pack click" data-filter="pack" data-val="'+esc(d.pack)+'">'+hi(d.pack,terms)+'</span>';
  if(d.fmt)bd+='<span class="b">'+hi(d.fmt,terms)+'</span>';
  if(d.cx)bd+='<span class="b">'+esc(d.cx)+'</span>';
  if(d.status)bd+='<span class="b status">'+hi(d.status,terms)+'</span>';
  (d.plat||[]).forEach(p=>bd+='<span class="b">'+hi(p,terms)+'</span>');
  if(d.fav)bd+='<span class="b fav">★</span>';
  if(d.flag)bd+='<span class="b flag">⚠ '+hi(d.flag,terms)+'</span>';
  (d.tags||[]).forEach(t=>bd+='<span class="b">#'+hi(t,terms)+'</span>');
  const klass = held ? ' review' : (BAD.has(d.tstat)&&d.tstat!=='desc-only' ? ' bad' : (d.flag?' flagged':''));
  const reviewButton = held ? '<button class="reviewbtn clear" data-clear-review="'+d.id+'">Clear review</button>' : '<button class="reviewbtn" data-mark-review="'+d.id+'">Review</button>';
  const placeholders=extractPlaceholders(d.text);
  const fillButton = placeholders.length ? '<button class="fillbtn" data-fill="'+d.id+'">'+(fillState.id===d.id?'Close fill':'Fill')+'</button>' : '';
  return '<div class="card'+klass+'">'
    +'<div class="chead"><div><div class="cname">'+hi(d.name,terms)+'</div>'
    +(d.changed&&d.orig!==d.name?'<div class="was">↳ was: <code>'+hi(d.orig,terms)+'</code></div>':'')+'</div>'
    +'<button class="copy" data-copy="'+d.id+'">Copy</button>'+fillButton+reviewButton+'</div>'
    +'<div class="badges">'+bd+'</div>'
    +(d.desc?'<div class="desc">'+hi(d.desc,terms)+'</div>':'')
    +(fillState.id===d.id?renderFillPanel(d):'')
    +'<pre class="body" data-body="'+d.id+'">'+prev+'</pre>'
    +(long?'<button class="morebtn" data-more="'+d.id+'">Show full ▾</button>':'')
    +(d.img?'<div class="imgwrap"><button class="imgtog" data-img="'+d.id+'">🎨 Image prompt ▾</button></div>':'')
    +'</div>';
}
function render(){
  const terms=queryTerms();
  const r=DATA.filter(match).sort((a,b)=>terms.length?(searchScore(b,terms)-searchScore(a,terms)||sortFn(a,b)):sortFn(a,b));
  $('list').innerHTML = r.length?r.map(d=>card(d,terms)).join(''):'<div class="empty">No prompts match those filters.</div>';
  const base=state.review?reviewIds.size:DATA.length-reviewIds.size;
  $('cnt').textContent = r.length+' / '+base+' prompts'+(reviewIds.size&&!state.review?' · '+reviewIds.size+' in review':'');
  updateReviewCount();
  writeStore(STORE.state,captureState());
}
function flash(btn,txt){ const o=btn.textContent; btn.textContent=txt; btn.classList.add('done'); setTimeout(()=>{btn.textContent=o;btn.classList.remove('done')},1300); }
function doCopy(text,btn,item){ const ok=()=>{ addRecentCopy(item); flash(btn,'✓ Copied'); };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(ok,()=>fb(text,ok)); } else fb(text,ok); }
function fb(text,ok){ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');ok();}catch(e){} document.body.removeChild(ta); }
$('list').addEventListener('click',e=>{
  const cp=e.target.closest('[data-copy]'); if(cp){ const d=DATA[+cp.dataset.copy]; doCopy(d.text,cp,d); return; }
  const cf=e.target.closest('[data-copy-filled]'); if(cf){ copyFilled(cf.dataset.copyFilled,cf); return; }
  const ff=e.target.closest('[data-fill]'); if(ff){ startFill(DATA[+ff.dataset.fill]); return; }
  const xf=e.target.closest('[data-close-fill]'); if(xf){ fillState.id=null; fillState.values={}; render(); return; }
  const mr=e.target.closest('[data-mark-review]'); if(mr){ markReview(DATA[+mr.dataset.markReview]); return; }
  const cr=e.target.closest('[data-clear-review]'); if(cr){ clearReview(DATA[+cr.dataset.clearReview]); return; }
  const mo=e.target.closest('[data-more]'); if(mo){ const id=+mo.dataset.more,d=DATA[id],pre=document.querySelector('[data-body="'+id+'"]');
    if(mo.dataset.open){ pre.textContent=d.text.slice(0,PREVIEW)+'…'; mo.textContent='Show full ▾'; delete mo.dataset.open; }
    else{ pre.textContent=d.text; mo.textContent='Show less ▴'; mo.dataset.open='1'; } return; }
  const ig=e.target.closest('[data-img]'); if(ig){ const id=+ig.dataset.img,d=DATA[id];
    if(ig.dataset.open){ const x=ig.parentNode.querySelector('.imgbox'); if(x)x.remove(); ig.textContent='🎨 Image prompt ▾'; delete ig.dataset.open; }
    else{ const pre=document.createElement('pre'); pre.className='body imgbox'; pre.textContent=d.img;
      const b=document.createElement('button'); b.className='copy'; b.style.marginTop='8px'; b.textContent='Copy image prompt'; b.onclick=()=>doCopy(d.img,b,{...d,name:d.name+' image prompt'});
      ig.parentNode.appendChild(pre); ig.parentNode.appendChild(b); ig.textContent='🎨 Image prompt ▴'; ig.dataset.open='1'; } return; }
  const fl=e.target.closest('[data-filter]'); if(fl){ const k=fl.dataset.filter; state[k]=fl.dataset.val; $('f-'+k).value=fl.dataset.val; render(); window.scrollTo({top:0,behavior:'smooth'}); }
});
$('list').addEventListener('input',e=>{ const input=e.target.closest('[data-fill-input]'); if(input&&fillState.id!==null)updateFillFromInputs(fillState.id); });
let t; $('q').addEventListener('input',e=>{clearTimeout(t);t=setTimeout(()=>{state.q=e.target.value;render();},110);});
FILTERS.forEach(([id,k])=>$(id).addEventListener('change',e=>{state[k]=e.target.value;render();}));
TOGGLES.forEach(([id,k])=>{
  $(id).addEventListener('click',()=>{state[k]=!state[k];$(id).classList.toggle('on',state[k]);$(id).querySelector('input').checked=state[k];render();});});
$('saved-view').addEventListener('change',e=>{ const view=savedViews().find(v=>v.name===e.target.value); if(view)applyState(view.state); });
$('save-view').addEventListener('click',saveCurrentView);
$('delete-view').addEventListener('click',deleteCurrentView);
$('export-state').addEventListener('click',exportLocalState);
$('import-state').addEventListener('click',()=>$('state-file').click());
$('state-file').addEventListener('change',e=>{ const file=e.target.files&&e.target.files[0]; if(!file)return;
  importLocalState(file).catch(err=>{ alert('Import failed: '+(err&&err.message?err.message:'Invalid state file')); }).finally(()=>{ e.target.value=''; }); });
$('recent-copy').addEventListener('change',e=>{ if(!e.target.value)return; applyState({...DEFAULT_STATE,q:e.target.value,sort:'name'}); e.target.value=''; window.scrollTo({top:0,behavior:'smooth'}); });
$('clear').addEventListener('click',()=>{ applyState(DEFAULT_STATE); $('saved-view').value=''; });
document.addEventListener('keydown',e=>{ if(e.key==='/'&&document.activeElement!==$('q')){e.preventDefault();$('q').focus();}
  if(e.key==='Escape'&&document.activeElement===$('q')){$('q').value='';state.q='';render();$('q').blur();}});
renderSavedViews(); renderRecentCopies(); applyState(readStore(STORE.state,DEFAULT_STATE));
</script>
<script src="js/sbd-public-nav.js" defer></script>
