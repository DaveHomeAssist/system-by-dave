<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projectors, sign in</title>
<link rel="stylesheet" href="avd/tokens.css">
<link rel="stylesheet" href="avd/bundle.css">
<link rel="stylesheet" href="app.css">
<style>
.pj-login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:var(--space-4)}
.pj-login form{width:min(380px,100%);display:flex;flex-direction:column;gap:var(--space-4);padding:var(--space-5);background:var(--surface);border:1px solid var(--hairline);border-radius:var(--radius-md)}
</style>
</head>
<body>
<main class="pj-login">
  <form id="f" autocomplete="off">
    <span class="avd-tape">Frozen at WST</span>
    <h1 style="margin:0;font-size:20px;line-height:26px;font-weight:600">Projector control</h1>
    <label class="avd-field"><span class="avd-field__label">Password</span><input id="code" class="avd-input" type="password" autocomplete="current-password" required autofocus></label>
    <p id="err" class="pj-mono" role="alert" style="margin:0;color:var(--state-blocked)"></p>
    <button class="avd-btn avd-btn--primary avd-btn--block" type="submit">Sign in</button>
    <p class="pj-mono pj-note">Use the relay password for both LAN and tunnel access. Local access does not depend on Cloudflare; sessions last until the relay restarts.</p>
  </form>
</main>
<script>
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault(); const err = document.getElementById('err'); err.textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ code: document.getElementById('code').value }) });
    const j = await r.json(); if (!r.ok) throw new Error(j.error || 'sign in failed');
    location.href = '/';
  } catch (x) { err.textContent = x.message; }
};
</script>
</body>
</html>
